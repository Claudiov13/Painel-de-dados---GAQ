<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Painel de Dados de Compras GAQ</title>
  <link rel="stylesheet" href="./styles.css?v={{REVISION}}"/>
  <script>
    window.addEventListener('error', function (event) {
      var box = document.getElementById('boot-status');
      if (box) { box.hidden = false; box.textContent = 'Não foi possível abrir o painel. Aguarde o OneDrive concluir a sincronização e recarregue. ' + (event.message || ''); }
    });
    window.addEventListener('unhandledrejection', function () {
      var box = document.getElementById('boot-status');
      if (box) { box.hidden = false; box.textContent = 'Ocorreu uma falha. Recarregue o painel após conferir a sincronização do OneDrive.'; }
    });
  </script>
  <script defer src="./assets/vendor.js?v={{REVISION}}"></script>
  <script defer src="./auth.js?v={{REVISION}}"></script>
  <script defer src="./assets/runtime.js?v={{REVISION}}"></script>
  <script defer src="./assets/app.js?v={{REVISION}}"></script>
</head>
<body>
  <div id="boot-status" hidden role="alert" class="gaq-data-notice"></div>
  <div id="root"><div role="status" class="gaq-data-notice">Abrindo o Painel GAQ…</div></div>
  <noscript>Ative o JavaScript no navegador para abrir o painel.</noscript>
  {{OTRS_TEMPLATES}}
  <script>
    setTimeout(function () {
      if (!window.React || !window.PainelRepository || !document.querySelector('#root button')) {
        var box = document.getElementById('boot-status'); box.hidden = false;
        box.textContent = 'A abertura ainda não foi concluída. Confira se a pasta assets foi sincronizada e recarregue o painel.';
      }
    }, 15000);
  </script>
</body>
</html>
