<script type="text/template" id="otrs-tpl-rapido">
(async function extrairChamados() {

  const LISTA_CHAMADOS = {{LISTA_CHAMADOS}};
  const DELAY_ENTRE_CHAMADOS_MS = 2500;
  const resultado = {};

  function sleep(ms) {
    return new Promise(resolve => setTimeout(resolve, ms));
  }

  function limparTexto(txt) {
    if (!txt) return "";
    return txt
      .replace(/\r\n/g, "\n")
      .replace(/\r/g, "\n")
      .replace(/\n{3,}/g, "\n\n")
      .trim();
  }

  async function fetchTicketHTML(numero) {
    const searchURL = `https://servicedesk.sesc.com.br/otrs/index.pl?Action=AgentTicketSearch;Subaction=Search;TicketNumber=${numero}`;
    const resp = await fetch(searchURL, { credentials: "include" });
    const html = await resp.text();
    const matchZoom = html.match(/AgentTicketZoom;TicketID=(\d+)/);
    if (!matchZoom) {
      const matchDirect = resp.url.match(/TicketID=(\d+)/);
      if (!matchDirect) return null;
      const zoomURL = `https://servicedesk.sesc.com.br/otrs/index.pl?Action=AgentTicketZoom;TicketID=${matchDirect[1]}`;
      const rz = await fetch(zoomURL, { credentials: "include" });
      return { ticketId: matchDirect[1], html: await rz.text() };
    }
    const zoomURL = `https://servicedesk.sesc.com.br/otrs/index.pl?Action=AgentTicketZoom;TicketID=${matchZoom[1]}`;
    const respZoom = await fetch(zoomURL, { credentials: "include" });
    return { ticketId: matchZoom[1], html: await respZoom.text() };
  }

  async function fetchIframeTexto(src) {
    if (!src || src === "about:blank") return "";
    try {
      const url = src.startsWith("http") ? src : `https://servicedesk.sesc.com.br${src}`;
      const resp = await fetch(url, { credentials: "include" });
      const html = await resp.text();
      const parser = new DOMParser();
      const doc = parser.parseFromString(html, "text/html");
      return limparTexto(doc.body ? (doc.body.innerText || doc.body.textContent || "") : "");
    } catch (e) {
      return "";
    }
  }

  function getValorLabel(container, labelTexto) {
    const labels = Array.from(container.querySelectorAll("label"));
    const lbl = labels.find(l => (l.innerText || l.textContent || "").trim() === labelTexto);
    if (!lbl) return "";
    const next = lbl.nextElementSibling;
    return next ? limparTexto(next.innerText || next.textContent || "") : "";
  }

  function extrairSidebar(doc) {
    const sidebar = doc.querySelector(".SidebarColumn");
    if (!sidebar) return { infoChamado: {}, infoCliente: {} };
    function getVal(texto) { return getValorLabel(sidebar, texto); }
    const infoChamado = {
      tipo                          : getVal("Tipo:"),
      idade                         : getVal("Idade:"),
      criado                        : getVal("Criado:"),
      estado                        : getVal("Estado:"),
      bloqueio                      : getVal("Bloqueio:"),
      fila                          : getVal("Fila:"),
      servico                       : getVal("Serviço:"),
      estado_de_incidente_do_servico: getVal("Estado de Incidente do Serviço:"),
      acordo_de_nivel_de_servico    : getVal("Acordo de Nível de Serviço:"),
      prioridade                    : getVal("Prioridade:"),
      id_do_cliente                 : getVal("ID do Cliente:"),
      tecnico                       : getVal("Técnico:"),
      titulo                        : "",
    };
    const h1 = doc.querySelector("h1");
    if (h1) {
      infoChamado.titulo = (h1.innerText || h1.textContent || "")
        .replace(/^Ticket#\d+\s*[—\-]\s*/, "").trim();
    } else {
      infoChamado.titulo = (doc.title || "")
        .replace(/^\d+\s*[-—]\s*/, "")
        .replace(/\s*-\s*Detalhes.*/, "").trim();
    }
    const infoCliente = {
      titulo         : getVal("Título:"),
      nome           : getVal("Nome:"),
      sobrenome      : getVal("Sobrenome:"),
      usuario        : getVal("Usuário:"),
      email          : getVal("E-mail:"),
      telefone       : getVal("Telefone:"),
      endereco       : getVal("Endereço:"),
      empresa        : getVal("Empresa:"),
      centro_de_custo: getVal("Centro de Custo:"),
      matricula      : getVal("Matricula:"),
    };
    return { infoChamado, infoCliente };
  }

  function extrairTabelaArtigos(doc) {
    const rows = doc.querySelectorAll("#ArticleTable tbody tr");
    const artigos = [];
    rows.forEach(row => {
      const tds = Array.from(row.querySelectorAll("td"));
      if (tds.length >= 6) {
        artigos.push({
          numero : parseInt((tds[1].innerText || tds[1].textContent || "").trim()) || 0,
          tipo   : limparTexto(tds[2].innerText || tds[2].textContent || ""),
          de     : limparTexto(tds[4].innerText || tds[4].textContent || ""),
          assunto: limparTexto(tds[5].innerText || tds[5].textContent || ""),
          criado : limparTexto(tds[6] ? (tds[6].innerText || tds[6].textContent || "") : ""),
        });
      }
    });
    return artigos;
  }

  async function extrairInteracoes(doc) {
    const widgets = Array.from(doc.querySelectorAll(".WidgetSimple"));
    const artWidgets = widgets.filter(w => {
      const h2 = w.querySelector("h2");
      return h2 && (h2.innerText || h2.textContent || "").match(/Artigo #\d+/);
    });
    artWidgets.sort((a, b) => {
      const na = parseInt(a.querySelector("h2").textContent.match(/Artigo #(\d+)/)[1]);
      const nb = parseInt(b.querySelector("h2").textContent.match(/Artigo #(\d+)/)[1]);
      return na - nb;
    });
    const interacoes = [];
    for (const widget of artWidgets) {
      const h2 = widget.querySelector("h2");
      const numMatch = (h2.innerText || h2.textContent || "").match(/Artigo #(\d+)/);
      const numero = numMatch ? parseInt(numMatch[1]) : 0;
      const fieldset = widget.querySelector("fieldset");
      const de      = fieldset ? getValorLabel(fieldset, "De:")     : "";
      const para    = fieldset ? getValorLabel(fieldset, "Para:")    : "";
      const assunto = fieldset ? getValorLabel(fieldset, "Assunto:") : "";
      const criado = (() => {
        const header = widget.querySelector(".Header");
        if (header) {
          const m = (header.innerText || header.textContent || "").match(/Criado:\s*([\d\/]+\s[\d:]+)/);
          if (m) return m[1].trim();
        }
        return "";
      })();
      const iframeEl = widget.querySelector("iframe:not(#AttachmentWindow)");
      let mensagem = "";
      if (iframeEl) {
        const src = iframeEl.getAttribute("src");
        mensagem = await fetchIframeTexto(src);
      }
      interacoes.push({ numero, tipo: "", de, para, assunto, criado, mensagem });
    }
    return interacoes;
  }

  console.log(`%c[Extrator OTRS] Iniciando extração de ${LISTA_CHAMADOS.length} chamados.`, "color: #4CAF50; font-weight: bold;");

  const progressoSalvo = JSON.parse(sessionStorage.getItem("otrs_extrator_resultado") || "{}");
  const jaProcessados = new Set(Object.keys(progressoSalvo));
  Object.assign(resultado, progressoSalvo);
  if (jaProcessados.size > 0) {
    console.log(`[Extrator OTRS] Retomando: ${jaProcessados.size} chamados já processados.`);
  }

  for (let i = 0; i < LISTA_CHAMADOS.length; i++) {
    const numero = LISTA_CHAMADOS[i];
    if (jaProcessados.has(numero)) {
      console.log(`[Extrator OTRS] ⭐ Pulando ${numero} (já processado).`);
      continue;
    }
    console.log(`%c[Extrator OTRS] ⟶ Chamado ${i + 1}/${LISTA_CHAMADOS.length}: #${numero}`, "color: #2196F3; font-weight: bold;");
    try {
      const ticketData = await fetchTicketHTML(numero);
      if (!ticketData) {
        console.warn(`[Extrator OTRS] ⚠ Não encontrou #${numero}. Pulando.`);
        resultado[numero] = { erro: "ticket não encontrado" };
        continue;
      }
      const parser = new DOMParser();
      const doc = parser.parseFromString(ticketData.html, "text/html");
      const { infoChamado, infoCliente } = extrairSidebar(doc);
      const tabelaArtigos = extrairTabelaArtigos(doc);
      const tabelaMap = {};
      tabelaArtigos.forEach(a => { tabelaMap[a.numero] = a; });
      const interacoesRaw = await extrairInteracoes(doc);
      const interacoes = interacoesRaw.map(art => {
        const tabRow = tabelaMap[art.numero] || {};
        return {
          numero  : art.numero,
          tipo    : tabRow.tipo    || art.tipo,
          de      : art.de        || tabRow.de || "",
          para    : art.para,
          assunto : art.assunto   || tabRow.assunto || "",
          criado  : art.criado    || tabRow.criado  || "",
          mensagem: art.mensagem,
        };
      });
      resultado[numero] = {
        informacoes_do_chamado: infoChamado,
        informacoes_do_cliente: infoCliente,
        interacoes,
      };
      sessionStorage.setItem("otrs_extrator_resultado", JSON.stringify(resultado));
      console.log(`[Extrator OTRS] ✓ #${numero} extraído — ${interacoes.length} interações.`);
    } catch (e) {
      console.error(`[Extrator OTRS] ✗ Erro no chamado #${numero}:`, e);
      resultado[numero] = { erro: String(e) };
    }
    if (i < LISTA_CHAMADOS.length - 1) {
      console.log(`[Extrator OTRS] ⏳ Aguardando ${DELAY_ENTRE_CHAMADOS_MS / 1000}s...`);
      await sleep(DELAY_ENTRE_CHAMADOS_MS);
    }
  }

  console.log("%c[Extrator OTRS] Todos os chamados processados. Gerando arquivo...", "color: #4CAF50; font-weight: bold;");
  const jsonFinal = JSON.stringify(resultado, null, 2);
  try { JSON.parse(jsonFinal); console.log("[Extrator OTRS] ✓ JSON válido."); }
  catch (e) { console.error("[Extrator OTRS] ✗ JSON inválido:", e); }
  const blob = new Blob([new TextEncoder().encode(jsonFinal)], { type: "application/json" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = "chamados_servicedesk.json";
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  setTimeout(() => URL.revokeObjectURL(url), 2000);
  sessionStorage.removeItem("otrs_extrator_resultado");
  console.log("%c[Extrator OTRS] ✓ Download disparado: chamados_servicedesk.json", "color: #4CAF50; font-weight: bold;");
  return resultado;
})();
</script>
