const durCountByModYear = {};
const yearsSet = new Set();
const today0 = new Date(); today0.setHours(0,0,0,0);

function getInicioFim(r){
  const ini = pd(r["DATA DO RECEBIMENTO DA RC"] || r["Data Recebimento RC"] || r["Recebimento RC"]);
  if (!ini) return { ini: null, fim: null };
  const fimRaw = pd(r["CPL_DATA_HOMOLOGACAO_FINAL"]) || pd(r["DATA DE ENVIO DO PEDIDO (fornecedor) OU SUITE SESC (SCONT ou CPL)"]);
  const fim = fimRaw || today0; // hoje já está zerado no parseBase, mas aqui garantimos zero hora
  return { ini, fim };
}

baseVis.forEach(r => {
  if (!r.Modalidade) return;
  const { ini, fim } = getInicioFim(r);
  if (!ini || !fim) return;
  const y = ini.getFullYear();
  yearsSet.add(y);
  const d = Math.max(0, du(ini, fim));
  if (!durByModYear[r.Modalidade]) durByModYear[r.Modalidade] = {};
  if (!durCountByModYear[r.Modalidade]) durCountByModYear[r.Modalidade] = {};
  durByModYear[r.Modalidade][y] = (durByModYear[r.Modalidade][y] || 0) + d;
  durCountByModYear[r.Modalidade][y] = (durCountByModYear[r.Modalidade][y] || 0) + 1;
});

const yearsAll = [...yearsSet].sort((a,b)=>a-b);
const latestYear = yearsAll.length ? yearsAll[yearsAll.length-1] : null;
const prevYear = yearsAll.length > 1 ? yearsAll[yearsAll.length-2] : null;

const tempoPorModalidadeAno = (() => {
  if (!latestYear) return { years: [], data: [] };
  const y1 = prevYear, y2 = latestYear;
  const rows = Object.keys(durByModYear).map(mod => {
    const sum2 = (durByModYear[mod][y2] || 0), cnt2 = (durCountByModYear[mod][y2] || 0);
    const sum1 = y1 ? (durByModYear[mod][y1] || 0) : 0, cnt1 = y1 ? (durCountByModYear[mod][y1] || 0) : 0;
    const avg2 = cnt2 ? Math.round(sum2/cnt2) : null;
    const avg1 = cnt1 ? Math.round(sum1/cnt1) : null;
    const totalCnt = cnt1 + cnt2;
    return { name: mod, avg1, avg2, cnt1, cnt2, totalCnt, [String(y1)]: avg1, [String(y2)]: avg2 };
  })
  // manter modalidades com volume mínimo para comparativo fazer sentido
  .filter(r => (r.cnt2 >= 3) || (r.cnt1 >= 3))
  // prioriza volume do ano mais recente
  .sort((a,b) => (b.cnt2 - a.cnt2) || (b.totalCnt - a.totalCnt))
  .slice(0, 12);

  return { years: y1 ? [y1, y2] : [y2], data: rows };
})();

// Modalidades Mais Lentas: APENAS processos concluídos
// Início: DATA DO RECEBIMENTO DA RC (aging oficial)
// Fim: CPL_DATA_HOMOLOGACAO_FINAL, senão DATA DE ENVIO DO PEDIDO
const topModLentas = (() => {
  const modMap = {};
  conc.forEach(r => {
    if (!r.Modalidade) return;
    const ini = pd(r["DATA DO RECEBIMENTO DA RC"] || r["Data Recebimento RC"] || r["Recebimento RC"]);
    const fim = pd(r["CPL_DATA_HOMOLOGACAO_FINAL"]) || pd(r["DATA DE ENVIO DO PEDIDO (fornecedor) OU SUITE SESC (SCONT ou CPL)"]);
    if (!ini || !fim) return;
    const d = Math.max(0, du(ini, fim));
    if (!modMap[r.Modalidade]) modMap[r.Modalidade] = { sum: 0, cnt: 0 };
    modMap[r.Modalidade].sum += d;
    modMap[r.Modalidade].cnt++;
  });
  return Object.entries(modMap)
    .filter(([_, v]) => v.cnt >= 3)
    .map(([name, v]) => ({ name, media: Math.round(v.sum / v.cnt), count: v.cnt }))
    .sort((a, b) => b.media - a.media)
    .slice(0, 5);
})();

    const now = new Date();
    const meses = [];
    for (let i = 11; i >= 0; i--) {
      const d = new Date(now.getFullYear(), now.getMonth() - i, 1);
      const label = d.toLocaleDateString("pt-BR", { month: "short", year: "2-digit" });
      const y = d.getFullYear(), mo = d.getMonth();
      const abertos = baseVis.filter(r => r._ref && r._ref.getFullYear() === y && r._ref.getMonth() === mo).length;
      const conclM = conc.filter(r => {
        const env = pd(r["DATA DE ENVIO DO PEDIDO (fornecedor) OU SUITE SESC (SCONT ou CPL)"]);
        return env && env.getFullYear() === y && env.getMonth() === mo;
      }).length;
      meses.push({ label, abertos, concluidos: conclM });
    }
    const compCarga = {};
    emAL.forEach(r => {
      const c = r.ehCPL ? (r.Pregoeiro || r.cplResp) : r.respNCL; if (!c) return;
      if (!compCarga[c]) compCarga[c] = { total: 0, criticos: 0 };
      compCarga[c].total++;
      if (r.criticoNclGestao || r.criticoCpl) compCarga[c].criticos++;
    });
    const topSobrecarregados = Object.entries(compCarga)
      .map(([name, v]) => ({ name, ...v })).sort((a,b) => b.criticos - a.criticos || b.total - a.total).slice(0,5);
    const concDentroSLA = conc.filter(r => r.LeadTime > 0 && r.LeadTime <= 50).length;
    const taxaSLA = concLTs.length ? Math.round((concDentroSLA / concLTs.length) * 100) : 0;
    const risco = emAL.filter(r => r.diasTotais > 100);

    // ── Trends: comparativo mês atual vs mês anterior ──
    const nowT = new Date();
    const curM = nowT.getMonth(), curY = nowT.getFullYear();
    const prevM = curM === 0 ? 11 : curM - 1;
    const prevYT = curM === 0 ? curY - 1 : curY;
    const curMonthProcs = baseVis.filter(r => r._ref && r._ref.getMonth() === curM && r._ref.getFullYear() === curY);
    const prevMonthProcs = baseVis.filter(r => r._ref && r._ref.getMonth() === prevM && r._ref.getFullYear() === prevYT);
    // Conclusões/problemas pelo mês em que foram encerrados (ultimaData), não pelo mês de abertura
    const curConc = baseVis.filter(r => r.isConcluded && r.ultimaData && r.ultimaData.getMonth() === curM && r.ultimaData.getFullYear() === curY).length;
    const prevConc = baseVis.filter(r => r.isConcluded && r.ultimaData && r.ultimaData.getMonth() === prevM && r.ultimaData.getFullYear() === prevYT).length;
    const curProb = baseVis.filter(r => (r.isCanceled || r.isFailed) && r.ultimaData && r.ultimaData.getMonth() === curM && r.ultimaData.getFullYear() === curY).length;
    const prevProb = baseVis.filter(r => (r.isCanceled || r.isFailed) && r.ultimaData && r.ultimaData.getMonth() === prevM && r.ultimaData.getFullYear() === prevYT).length;
    const trendConc = curConc > prevConc ? "up" : curConc < prevConc ? "down" : "flat";
    const trendProb = curProb < prevProb ? "up" : curProb > prevProb ? "down" : "flat";

    // ── Comparativo Período Mês vs Mês Anterior (KPIs múltiplos) ──
    const curMA = curMonthProcs.length, prevMA = prevMonthProcs.length;
    const curConcN = curMonthProcs.filter(r => r.isConcluded).length;
    const prevConcN = prevMonthProcs.filter(r => r.isConcluded).length;
    const curAgingArr = curMonthProcs.filter(r => r.emA && r.diasTotaisGestao > 0).map(r => r.diasTotaisGestao);
    const prevAgingArr = prevMonthProcs.filter(r => r.emA && r.diasTotaisGestao > 0).map(r => r.diasTotaisGestao);
    const curMediaAging = curAgingArr.length ? Math.round(curAgingArr.reduce((a,b)=>a+b,0)/curAgingArr.length) : 0;
    const prevMediaAging = prevAgingArr.length ? Math.round(prevAgingArr.reduce((a,b)=>a+b,0)/prevAgingArr.length) : 0;
    const curCrit = curMonthProcs.filter(r => r.emA && r.criticoNclGestao).length;
    const prevCrit = prevMonthProcs.filter(r => r.emA && r.criticoNclGestao).length;
    const pctDelta = (cur, prev) => prev === 0 ? (cur > 0 ? "+100" : "0") : ((cur - prev) / prev * 100).toFixed(0);
    const comparativo = {
      aberturas: { cur: curMA, prev: prevMA, delta: pctDelta(curMA, prevMA) },
      conclusoes: { cur: curConcN, prev: prevConcN, delta: pctDelta(curConcN, prevConcN) },
      problematicos: { cur: curProb, prev: prevProb, delta: pctDelta(curProb, prevProb) },
      agingMedio: { cur: curMediaAging, prev: prevMediaAging, delta: pctDelta(curMediaAging, prevMediaAging) },
      criticos: { cur: curCrit, prev: prevCrit, delta: pctDelta(curCrit, prevCrit) },
    };

    return {
      tot, emA: emAL.length, conc: conc.length, canc: canc.length, frac: frac.length,
      taxaProb, taxaConc, mediaLTConc, taxaSLA, aging, topAreasProb, topModLentas,
      tempoPorModalidadeAno, comparativo,
      criticalTotal: (alertNCL.length + alertCPL.length),
      meses, topSobrecarregados,
      risco: risco.length,
      alertNCLCount: alertNCL.length, alertCPLCount: alertCPL.length,
      nclBackCount: nclBack.length, cplBackCount: cplBack.length,
      trendConc, trendProb, curConc, prevConc, curProb, prevProb,
    };
  }, [baseVis, alertNCL, alertCPL, nclBack, cplBack]);

    const slaAtendidosSD = sdTriagem.filter(r => !r.atrasoSD);
    const slaVencidos = uniqRows([...atrasadosRC, ...sdAtrasado]);
    const slaAtendidos = uniqRows([...slaAtendidosRC, ...slaAtendidosSD]);
    const criticosEntregaVencida = criticos.filter(r => r._sla.entregaVencida);
    const atencaoJanela = atencao.filter(r => r._sla.janelaComprometida);
    const atencaoPrazo = atencao.filter(r => r._sla.atencaoPrazo || r._sla.projecaoEstouraSla);
    const criticosSlaEntrega = criticos.filter(r => r._sla.slaVencido && (r._sla.entregaVencida || r._sla.projecaoForaCronograma));
    const conclValidos = fBase.filter(r => {
      if (!r.isConcluded || (r.diasTotais || 0) <= 0) return false;
      const prazo = r.prazoGeral || getPrazoGeral(nrm(r.Modalidade || ""));
      return prazo > 0;
    });
    const conclNoPrazo = conclValidos.filter(r => {
      const prazo = r.prazoGeral || getPrazoGeral(nrm(r.Modalidade || ""));
      return (r.diasTotais || 0) <= prazo;
    });
    const slaCumprido = conclValidos.length ? Math.round((conclNoPrazo.length / conclValidos.length) * 100) : 0;
    const mediaScore = areaScore.score;
    const scoreColor = mediaScore >= 75 ? "var(--gaq-green)" : mediaScore >= 50 ? "var(--gaq-orange)" : "var(--gaq-red)";
    const activeAttention = criticos.length + atencao.length;
    const firstValid = (...vals) => vals.find(v => v && v !== "—" && v !== "N/A") || "Sistema";
    const processLabel = (r) => r.NumRC || r.TicketSD || r.ProcessKey || "Sem identificador";
    const stampLabel = (dt) => {
      if (!dt) return "sem data";

      return dt.toDateString() === now.toDateString()
        ? dt.toLocaleTimeString("pt-BR", { hour: "2-digit", minute: "2-digit" })

    const monthBuckets = Array.from({ length: 8 }, (_, idx) => {

      d.setDate(1);
      d.setMonth(d.getMonth() - (7 - idx));

    });
    const byMonth = (rows, pickDate, calcValue) => monthBuckets.map(({ y, m }) => {
      const scoped = rows.filter(r => {

    const sparkEmAndamento = byMonth(fBack, r => r.dataAbertura, rows => rows.length);
    const sparkAtrasados = byMonth(slaVencidos, r => r.dataAbertura, rows => rows.length);
    const sparkCriticos = byMonth(criticos, r => r.dataAbertura, rows => rows.length);
    const sparkSla = byMonth(slaAtendidos, r => r.dataAbertura, rows => rows.length);
    const sparkScore = byMonth(classificadosOverview, r => r.dataAbertura, rows => rows.length

    const subareaStatusDefs = [
      { key: "critico", label: "Crítico", color: "#d35400" },
      { key: "atencao", label: "Em atenção", color: "#ff9500" },
      { key: "sla_vencido", label: "SLA vencido", color: "#ff3b30" },

    const subareas = [
      { key: "NCL", label: "NCL · Núcleo de Compras", color: "var(--gaq-ncl)", rows: fBack.filter(r => r.faseSubarea === "NCL") },
      { key: "CPL", label: "CPL · Comissão de Licitação", color: "var(--gaq-cpl)", rows: fBack.filter(r => r.faseSubarea === "CPL") },
      { key: "Scont", label: "Scont · Contratos", color: "var(--gaq-rsp)", rows: fBack.filter(r => r.faseSubarea === "Scont") },
    ].map(item => {
      const classifiedRows = classificadosOverview.filter(r => r.faseSubarea === item.key);
      const statusSegments = subareaStatusDefs.map(def => {

        return {
          ...def,
          rows,
          count: rows.length,
          pct: item.rows.length ? Math.round((rows.length / item.rows.length) * 100) : 0,
        };
      });
      return {
        ...item,
        pct: fBack.length ? Math.round((item.rows.length / fBack.length) * 100) : 0,
        statusSegments,

    });

    const recentActivity = [...fBase]
      .filter(r => r.ultimaData)
      .sort((a, b) => b.ultimaData - a.ultimaData)
      .slice(0, 6)
      .map(r => {
        const who = firstValid(r.respFase, r.respAtivo, r.Comprador, r.Pregoeiro, r.AnalistaContrato, r.respNCL);
        const label = processLabel(r);
        const detail = r.statusDet || r.status || r.faseAtual || "Sem status";
        const color = r.isConcluded ? "var(--gaq-green)"
          : r.atrasoGeral ? "var(--gaq-red)"
          : r.faseSubarea === "CPL" ? "var(--gaq-cpl)"
          : r.faseSubarea === "Scont" ? "var(--gaq-rsp)"
          : "var(--gaq-blue)";
        const verb = r.isConcluded ? "encerrou"
          : r.isCanceled ? "cancelou"
          : r.isFailed ? "marcou fracasso em"
          : r.NumRC ? "movimentou"
          : "atualizou";
        return { proc: r, who, label, detail, color, verb, stamp: stampLabel(r.ultimaData) };
      });

    const rankRows = (rows, field) => Object.entries(rows.reduce((acc, r) => {
      const key = r[field] || "Não informado";
      if (!acc[key]) acc[key] = [];
      acc[key].push(r);

    }, {}))
      .map(([label, procRows]) => ({ label, count: procRows.length, rows: procRows }))

      .slice(0, 10);

    const areasAtivas = rankRows(fBack, "Área Requisitante");
    const statusAtivos = topStatus.map(([label, count]) => ({
      label,
      count,
      rows: fBack.filter(r => (r.statusDet || r.status || "Sem status").toString().trim() === label),
    }));
    const rowScopeKey = (r) => r ? (r.ProcessKey || `${r.NumRC || ""}|${r.TicketSD || ""}|${r.Objeto || ""}`) : "";
    const scopeKeys = new Set(fBase.map(rowScopeKey));
    const scopedBaseDiffFeed = isDiretor
      ? baseDiffFeed.filter(change => change.proc && scopeKeys.has(rowScopeKey(change.proc)))

    };
  }, [loginUser, loginArea, base, fBack, fBase, topStatus, baseDiffFeed, baseDiffInfo, mediaNCL, mediaCPL, meta, phaseIntervals]);

    const addDecor = (list, issueKey, detailFn) => list.map(r => ({
      ...r,
      _dqIssue: issueKey,
      _dqDetail: typeof detailFn === "function" ? detailFn(r) : detailFn,
    }));
    const uniqRows = (list) => {
      const seen = new Set();
      return (list || []).filter(r => {
        const key = rowKey(r);
        if (!key || seen.has(key)) return false;
        seen.add(key);

      });
    };

    const duplicateRows = (field) => {
      const groups = {};

        if (!groups[raw]) groups[raw] = [];
        groups[raw].push(r);
      });
      return Object.entries(groups)

      return {

        rows: match,

    const topAreas = Object.entries(porArea).sort((a,b)=>b[1]-a[1]).slice(0,8).map(([k,v])=>`${k}: ${v}`).join("; ");
    const topMods = Object.entries(porMod).sort((a,b)=>b[1]-a[1]).slice(0,6).map(([k,v])=>`${k}: ${v}`).join("; ");

    // Top 30 processos críticos com info reduzida (para caber no contexto)
    const isoDate = d => (d instanceof Date && !isNaN(d)) ? d.toISOString().slice(0,10) : null;
    const topCriticos = ativos.slice().sort((a,b)=>(b.diasTotaisGestao||0)-(a.diasTotaisGestao||0)).slice(0,30).map(r => ({
      rc: r.NumRC || "—",
      sd: r.TicketSD || "—",
      area: r["Área Requisitante"] || "—",
      modalidade: r.Modalidade || "—",
      status: r.statusDet || r.status || "—",
      fase: r.faseAtual || "—",
      respAtivo: r.respAtivo || "—",
      diasRC: r.diasTotaisGestao || 0,
      diasSD: r.diasSDAberto || r.diasSD || 0,
      slaVencido: !!(r.atrasoGeral || r.atrasoSD),
      dataAberturaRC: isoDate(r.aberturaRC),
      dataAberturaSD: isoDate(r.aberturaSD),
      objeto: (r.Objeto || "").slice(0, 200),
    }));

    // Top 30 mais recentes por abertura RC (para perguntas de recência)
    const maisRecentes = ativos.filter(r => r.aberturaRC).slice()
      .sort((a,b) => b.aberturaRC - a.aberturaRC).slice(0,30).map(r => ({
        rc: r.NumRC || "—",
        sd: r.TicketSD || "—",
        area: r["Área Requisitante"] || "—",
        modalidade: r.Modalidade || "—",
        status: r.statusDet || r.status || "—",
        respAtivo: r.respAtivo || "—",
        dataAberturaRC: isoDate(r.aberturaRC),
        dataAberturaSD: isoDate(r.aberturaSD),
        diasRC: r.diasTotaisGestao || 0,
        objeto: (r.Objeto || "").slice(0, 200),
      }));

    return {
      meta: { totalBase: baseVis.length, totalAtivos: ativos.length, totalConcluidos: concl.length, totalCancelados: canc.length, totalFracassados: frac.length, slaVencido: slaVencido.length, criticosRC: criticosRC.length, sdSemRC: sdSemRC.length, sdEncSemRC: sdEncSemRC.length },
      distribuicao: { topAreas, topMods },
      topCriticos,
      maisRecentes,
    };
  }

  async function askIA() {
    const q = (iaQuestion || "").trim();
    if (!q || iaLoading) return;
    if (!window.IA_API_KEY) { setIaError("Chave de IA não configurada (apikey.js)."); return; }

    setIaError("");
    setIaLoading(true);
    setIaConversa(prev => [...prev, { role: "user", text: q }]);

    const ctx = buildIAContext();
    const systemInstr = `Você é um assistente analítico do Painel GAQ (Gerência de Aquisições do Sesc), focado em compras públicas. Responda em português, de forma direta, objetiva e estruturada (use marcadores quando útil). Baseie suas respostas APENAS nos dados fornecidos em CONTEXTO. Se a pergunta não puder ser respondida com os dados, diga isso claramente. Inclua números, percentuais e referências a RC/SD quando relevante.

CONTEXTO DA BASE:
- Total de processos visíveis: ${ctx.meta.totalBase}
- Em andamento: ${ctx.meta.totalAtivos}
- Concluídos: ${ctx.meta.totalConcluidos} · Cancelados: ${ctx.meta.totalCancelados} · Fracassados: ${ctx.meta.totalFracassados}
- Com SLA vencido (atraso): ${ctx.meta.slaVencido}
- RC com aging > 100 d.u.: ${ctx.meta.criticosRC}
- Pré-compra (SD) sem RC: ${ctx.meta.sdSemRC} (sendo ${ctx.meta.sdEncSemRC} já encerrados aguardando a área abrir RC)

DISTRIBUIÇÃO POR ÁREA (top): ${ctx.distribuicao.topAreas}
DISTRIBUIÇÃO POR MODALIDADE (top): ${ctx.distribuicao.topMods}

TOP 30 PROCESSOS CRÍTICOS (ordenados por aging RC desc):
${JSON.stringify(ctx.topCriticos, null, 2)}

TOP 30 PROCESSOS MAIS RECENTES (ordenados por dataAberturaRC desc — datas em formato YYYY-MM-DD):
${JSON.stringify(ctx.maisRecentes, null, 2)}

PERGUNTA DO USUÁRIO: ${q}`;

    try {
      const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${encodeURIComponent(window.IA_API_KEY)}`;
      const resp = await fetch(url, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          contents: [{ role: "user", parts: [{ text: systemInstr }] }],
          generationConfig: {
            temperature: 0.3,
            maxOutputTokens: 2048,
            thinkingConfig: { thinkingBudget: 0 },
          },
        }),
      });
      if (!resp.ok) {
        const errTxt = await resp.text();
        throw new Error(`HTTP ${resp.status}: ${errTxt.slice(0, 300)}`);
      }
      const data = await resp.json();
      const finishReason = data.candidates?.[0]?.finishReason;
      let text = data.candidates?.[0]?.content?.parts?.[0]?.text || "";
      if (text && finishReason === "MAX_TOKENS") {
        text += "\n\n_(resposta interrompida no limite de tokens — refaça a pergunta de forma mais específica para um retorno completo)_";
      }
      if (!text) {
        if (finishReason === "SAFETY") text = "Resposta bloqueada por filtro de segurança da IA.";
        else if (finishReason === "MAX_TOKENS") text = "A IA atingiu o limite de tokens antes de gerar texto. Faça uma pergunta mais específica.";
        else if (data.promptFeedback?.blockReason) text = `Pergunta bloqueada: ${data.promptFeedback.blockReason}`;
        else text = "Sem resposta.";
      }
      setIaConversa(prev => [...prev, { role: "ia", text }]);
      setIaQuestion("");
    } catch (e) {
      setIaError("Falha ao consultar IA: " + (e.message || e));
      setIaConversa(prev => [...prev, { role: "ia", text: "❌ Erro ao consultar IA. Verifique a chave em apikey.js e a conexão." }]);
    } finally {
      setIaLoading(false);
    }
  }

        {/* ════════════ ABA: DIAGNÓSTICO (DIRETORIA) ════════════ */}
        {aba === "dirDiag" && isDiretor && diretorDiag && (() => {

          const topPressao = diag.topCriticos.length > 0 ? diag.topCriticos : diag.classificados.slice(0, 8);
          const flowMax = Math.max(1, ...diag.flowByYear.map(r => Math.max(r.entradas, r.concluidos, r.encerrados)));

          );

          const branches = [
            {
              key: "critico",
              icon: "🔴",
              title: "Casos Críticos",
              color: "#c0392b",
              bg: "#fff5f4",

              items: [

                        { label: "Janela comprometida", value: diag.janelaComprometida.length, rows: diag.janelaComprometida, drillTitle: `Diagnóstico Diretoria — Janela comprometida (${scopeLabel})` },

            {
              key: "atencao",
              icon: "🟠",

              bg: "#fff8f1",
              rows: diag.atencao,
              subtitle: "Quase-críticos. Disparam quando alguma margem (SLA ou entrega) está ≤ 3 d.u., OU quando SLA e entrega estão ambos ≤ 8 d.u. de margem, OU quando a projeção atual já estoura o SLA.",
              mods: diag.atencaoTopMods,
              items: [
                { label: "Margem crítica (≤ 3 d.u.)", value: diag.atencaoForte.length, rows: diag.atencaoForte, drillTitle: `Diretoria — Atenção · margem crítica (${scopeLabel})` },
                { label: "Pressão dupla (≤ 8 d.u.)", value: diag.atencaoCombinada.length, rows: diag.atencaoCombinada, drillTitle: `Diretoria — Atenção · pressão dupla (${scopeLabel})` },
                { label: "Score da área", value: diag.mediaScore },

              drillTitle: `Diagnóstico Diretoria — Casos em Atenção (${scopeLabel})`,
            },
            {
              key: "controlado",
              icon: "🟢",
              title: "Casos Controlados",
              color: "#1e8449",
              bg: "#f3fbf5",
              rows: diag.controlados,
              subtitle: "Pipeline sem pressão imediata entre SLA da modalidade e data prevista de entrega.",
              mods: diag.controladosTopMods,
              items: [
                { label: "Base monitorada", value: diag.classificados.length },
                { label: "Consumo médio do prazo", value: `${diag.mediaConsumoPrazo}%` },
                        { label: "Score da área", value: diag.mediaScore },

              drillTitle: `Diagnóstico Diretoria — Casos Controlados (${scopeLabel})`,

                  <div style={{ fontSize: 10, color: "var(--text3)" }}>Pressão combinada do pipeline</div>
                </div>
                <div onClick={() => openDrill(`Diagnóstico Diretoria — Pré-compra em triagem (${scopeLabel})`, diag.sdTriagem)}
                  style={{ flex: 1, minWidth: 150, background: "var(--card)", borderRadius: 12, padding: "16px 18px", boxShadow: "var(--shadow)", borderTop: "4px solid #16a085", cursor: diag.sdTriagem.length > 0 ? "pointer" : "default" }}>
                  <div style={{ fontSize: 10, fontWeight: 700, color: "#16a085", textTransform: "uppercase", letterSpacing: .5 }}>Pré-compra sem RC</div>
                  <div style={{ fontSize: 32, fontWeight: 800, color: "#16a085" }}>{diag.sdTriagem.length}</div>

                    style={{ background: "#f4f8fc", border: "1px solid #dce6f0", borderRadius: 14, padding: "14px 16px", marginBottom: 14, cursor: diag.ativosComRC.length > 0 ? "pointer" : "default" }}>
                    <div style={{ fontSize: 10, fontWeight: 700, color: "#1f618d", textTransform: "uppercase", letterSpacing: .45 }}>Raiz</div>
                    <div style={{ fontSize: 18, fontWeight: 800, color: "#154360", marginTop: 4 }}>Processos em andamento com RC</div>
                    <div style={{ fontSize: 11, color: "var(--text3)", marginTop: 4 }}>{diag.ativosComRC.length} processo(s) avaliados · consumo médio do prazo {diag.mediaConsumoPrazo}%.</div>
                  </div>
                  <div style={{ position: "relative", paddingLeft: 26 }}>
                    <div style={{ position: "absolute", left: 10, top: 0, bottom: 8, width: 2, background: "linear-gradient(180deg, #d6dde8 0%, #eef3f8 100%)" }} />

                <div style={{ display: "grid", gap: 14 }}>
                  <div style={{ background: "var(--card)", borderRadius: 16, padding: "16px 18px", boxShadow: "var(--shadow)", borderTop: "4px solid #e67e22" }}>
                    <div style={{ fontSize: 13, fontWeight: 800, color: "#e67e22", marginBottom: 10 }}>Radar de Entrega</div>
                    <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 8 }}>
                      {[

                        { label: "Janela comprometida", value: diag.janelaComprometida.length, color: "#d35400", onClick: () => openDrill(`Diagnóstico Diretoria — Janela comprometida (${scopeLabel})`, diag.janelaComprometida) },

                        { label: "Sem data de entrega", value: diag.semDataEntrega.length, color: "#7f8c8d", onClick: () => openDrill(`Diagnóstico Diretoria — Sem data de entrega (${scopeLabel})`, diag.semDataEntrega) },
                      ].map(item => (
                        <button key={item.label} onClick={item.onClick} disabled={item.value === 0}
                          style={{ textAlign: "left", borderRadius: 12, border: `1px solid ${item.color}33`, background: item.value > 0 ? item.color + "12" : "#f7f9fb", padding: "10px 12px", cursor: item.value > 0 ? "pointer" : "not-allowed" }}>

                          <div style={{ fontSize: 24, fontWeight: 800, color: item.color, marginTop: 4 }}>{item.value}</div>
                        </button>

                  </div>

                  <div style={{ background: "var(--card)", borderRadius: 16, padding: "16px 18px", boxShadow: "var(--shadow)", borderTop: "4px solid #16a085" }}>
                    <div style={{ fontSize: 13, fontWeight: 800, color: "#16a085", marginBottom: 10 }}>Triagem pré-compra</div>
                    <div style={{ fontSize: 11, color: "var(--text3)", marginBottom: 10 }}>Processos ainda sem RC não entram no score executivo, mas ficam visíveis para não perder o SLA da pré-compra.</div>
                    <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 8 }}>
                      <div onClick={() => openDrill(`Diagnóstico Diretoria — Pré-compra sem RC (${scopeLabel})`, diag.sdTriagem)}
                        style={{ borderRadius: 12, border: "1px solid #16a08533", background: "#16a08512", padding: "10px 12px", cursor: diag.sdTriagem.length > 0 ? "pointer" : "default" }}>
                        <div style={{ fontSize: 10, color: "#16a085", fontWeight: 700, textTransform: "uppercase" }}>Pré-compra sem RC</div>
                        <div style={{ fontSize: 24, fontWeight: 800, color: "#16a085", marginTop: 4 }}>{diag.sdTriagem.length}</div>
                      </div>
                      <div onClick={() => openDrill(`Diagnóstico Diretoria — Pré-compra acima do prazo (${scopeLabel})`, diag.sdTriagem.filter(r => r.atrasoSD))}
                        style={{ borderRadius: 12, border: "1px solid #c0392b33", background: "#c0392b12", padding: "10px 12px", cursor: diag.sdTriagem.filter(r => r.atrasoSD).length > 0 ? "pointer" : "default" }}>
                        <div style={{ fontSize: 10, color: "#c0392b", fontWeight: 700, textTransform: "uppercase" }}>Pré-compra > {PRAZO_SD} d.u.</div>
                        <div style={{ fontSize: 24, fontWeight: 800, color: "#c0392b", marginTop: 4 }}>{diag.sdTriagem.filter(r => r.atrasoSD).length}</div>

              <div style={{ background: "var(--card)", borderRadius: 16, padding: "18px 20px", boxShadow: "var(--shadow)", marginBottom: 20 }}>
                <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", gap: 10, flexWrap: "wrap", marginBottom: 12 }}>
                  <div>
                    <div style={{ fontWeight: 800, fontSize: 15, color: "#154360" }}>Top Casos Mais Pressionados</div>

                  </div>
                  {topPressao.length > 0 && <button onClick={() => openDrill(`Diagnóstico Diretoria — Top Pressão (${scopeLabel})`, topPressao)}

                  </button>}
                </div>
                {topPressao.length === 0 ? <div style={{ fontSize: 12, color: "var(--text3)", padding: "12px 0" }}>Nenhum processo com RC em andamento para este âmbito.</div> : (

                            <td style={{ padding: "8px 6px", color: "var(--text)" }}>{r.Modalidade || "—"}</td>
                            <td style={{ padding: "8px 6px", color: "var(--text2)" }}>{r["Área Requisitante"] || "—"}</td>
                            <td style={{ padding: "8px 6px", textAlign: "center", fontWeight: 800, color: r._diag.pctPrazo >= 1 ? "#c0392b" : r._diag.pctPrazo >= 0.7 ? "#e67e22" : "#1e8449" }}>{r._diag.pctPrazoLabel}%</td>
                            <td style={{ padding: "8px 6px", textAlign: "center", fontWeight: 700, color: r._diag.entregaVencida ? "#c0392b" : (r._diag.entregaCurta ? "#e67e22" : "#1e8449") }}>{formatSignedDays(r._diag.diasEntregaUteis, "Sem data")}</td>
                            <td style={{ padding: "8px 6px", textAlign: "center", fontWeight: 700, color: r._diag.janelaComprometida ? "#c0392b" : "#1e8449" }}>{formatSignedDays(r._diag.folgaEntrega, "Sem data")}</td>
                          </tr>
                        ))}
                      </tbody>
                    </table>
                  </div>
                )}
              </div>

              <div style={{ background: "var(--card)", borderRadius: 16, padding: "18px 20px", boxShadow: "var(--shadow)" }}>
                <div style={{ fontWeight: 800, fontSize: 15, color: "#154360", marginBottom: 4 }}>Entradas x Conclusões</div>
                <div style={{ fontSize: 11, color: "var(--text3)", marginBottom: 14 }}>Leitura anual do que está entrando na área e do que efetivamente está sendo concluído/encerrado.</div>
                <div style={{ display: "flex", gap: 12, flexWrap: "wrap", marginBottom: 14 }}>
                  <div style={{ flex: 1, minWidth: 140, borderRadius: 12, padding: "12px 14px", background: "#2e86c112", border: "1px solid #2e86c133" }}>
                    <div style={{ fontSize: 10, color: "#2e86c1", fontWeight: 700, textTransform: "uppercase" }}>Entradas {diag.flowAtual.ano}</div>
                    <div style={{ fontSize: 28, fontWeight: 800, color: "#2e86c1", marginTop: 2 }}>{diag.flowAtual.entradas}</div>
                  </div>
                  <div style={{ flex: 1, minWidth: 140, borderRadius: 12, padding: "12px 14px", background: "#27ae6012", border: "1px solid #27ae6033" }}>
                    <div style={{ fontSize: 10, color: "#27ae60", fontWeight: 700, textTransform: "uppercase" }}>Concluídos {diag.flowAtual.ano}</div>
                    <div style={{ fontSize: 28, fontWeight: 800, color: "#27ae60", marginTop: 2 }}>{diag.flowAtual.concluidos}</div>
                  </div>
                  <div style={{ flex: 1, minWidth: 140, borderRadius: 12, padding: "12px 14px", background: "#8e44ad12", border: "1px solid #8e44ad33" }}>
                    <div style={{ fontSize: 10, color: "#8e44ad", fontWeight: 700, textTransform: "uppercase" }}>Encerrados {diag.flowAtual.ano}</div>
                    <div style={{ fontSize: 28, fontWeight: 800, color: "#8e44ad", marginTop: 2 }}>{diag.flowAtual.encerrados}</div>
                  </div>
                  <div style={{ flex: 1, minWidth: 140, borderRadius: 12, padding: "12px 14px", background: (diag.flowAtual.saldo > 0 ? "#f39c1212" : "#1e844912"), border: `1px solid ${diag.flowAtual.saldo > 0 ? "#f39c1233" : "#1e844933"}` }}>
                    <div style={{ fontSize: 10, color: diag.flowAtual.saldo > 0 ? "#d68910" : "#1e8449", fontWeight: 700, textTransform: "uppercase" }}>Saldo {diag.flowAtual.ano}</div>
                    <div style={{ fontSize: 28, fontWeight: 800, color: diag.flowAtual.saldo > 0 ? "#d68910" : "#1e8449", marginTop: 2 }}>{diag.flowAtual.saldo > 0 ? `+${diag.flowAtual.saldo}` : diag.flowAtual.saldo}</div>
                  </div>
                </div>
                {diag.flowByYear.length === 0 ? <div style={{ fontSize: 12, color: "var(--text3)" }}>Sem histórico suficiente para este escopo.</div> : (
                  <div style={{ display: "grid", gap: 10 }}>
                    {diag.flowByYear.map(row => (
                      <div key={row.ano} style={{ border: "1px solid var(--border2)", borderRadius: 14, padding: "12px 14px" }}>
                        <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", gap: 12, flexWrap: "wrap", marginBottom: 10 }}>
                          <div style={{ fontSize: 15, fontWeight: 800, color: "#154360" }}>{row.ano}</div>
                          <div style={{ display: "flex", gap: 8, flexWrap: "wrap" }}>
                            <button onClick={() => openDrill(`Entradas ${row.ano} (${scopeLabel})`, row.entradasList)} disabled={row.entradas === 0}
                              style={{ padding: "5px 10px", borderRadius: 999, border: "1px solid #2e86c133", background: "#2e86c112", color: "#2e86c1", cursor: row.entradas > 0 ? "pointer" : "not-allowed", fontSize: 11, fontWeight: 700 }}>
                              Entradas: {row.entradas}
                            </button>
                            <button onClick={() => openDrill(`Concluídos ${row.ano} (${scopeLabel})`, row.concluidosList)} disabled={row.concluidos === 0}
                              style={{ padding: "5px 10px", borderRadius: 999, border: "1px solid #27ae6033", background: "#27ae6012", color: "#27ae60", cursor: row.concluidos > 0 ? "pointer" : "not-allowed", fontSize: 11, fontWeight: 700 }}>
                              Concluídos: {row.concluidos}
                            </button>
                            <button onClick={() => openDrill(`Encerrados ${row.ano} (${scopeLabel})`, row.encerradosList)} disabled={row.encerrados === 0}
                              style={{ padding: "5px 10px", borderRadius: 999, border: "1px solid #8e44ad33", background: "#8e44ad12", color: "#8e44ad", cursor: row.encerrados > 0 ? "pointer" : "not-allowed", fontSize: 11, fontWeight: 700 }}>
                              Encerrados: {row.encerrados}
                            </button>
                          </div>
                        </div>
                        <div style={{ display: "grid", gap: 6 }}>
                          {[
                            { label: "Entradas", value: row.entradas, color: "#2e86c1" },
                            { label: "Concluídos", value: row.concluidos, color: "#27ae60" },
                            { label: "Encerrados", value: row.encerrados, color: "#8e44ad" },
                          ].map(bar => (
                            <div key={bar.label} style={{ display: "grid", gridTemplateColumns: "92px 1fr 64px", gap: 8, alignItems: "center" }}>
                              <div style={{ fontSize: 11, color: "var(--text2)", fontWeight: 700 }}>{bar.label}</div>
                              <div style={{ background: "#eef3f8", borderRadius: 999, height: 10, overflow: "hidden" }}>
                                <div style={{ width: `${(bar.value / flowMax) * 100}%`, minWidth: bar.value > 0 ? 8 : 0, height: "100%", background: bar.color, borderRadius: 999 }} />
                              </div>
                              <div style={{ fontSize: 11, color: bar.color, fontWeight: 800, textAlign: "right" }}>{bar.value}</div>
                            </div>
                          ))}
                        </div>
                        <div style={{ display: "flex", justifyContent: "space-between", gap: 12, flexWrap: "wrap", marginTop: 10, fontSize: 11, color: "var(--text3)" }}>
                          <span>Taxa de conclusão: <b style={{ color: "#27ae60" }}>{row.taxaConclusao}%</b></span>
                          <span>Taxa de encerramento: <b style={{ color: "#8e44ad" }}>{row.taxaEncerramento}%</b></span>
                          <span>Saldo: <b style={{ color: row.saldo > 0 ? "#d68910" : "#1e8449" }}>{row.saldo > 0 ? `+${row.saldo}` : row.saldo}</b></span>
                        </div>
                      </div>
                    ))}
                  </div>
                )}
              </div>
            </div>
          );
        })()}

        {/* ════════════ ABA: TIMELINE (DIRETORIA) ════════════ */}
        {aba === "dirTimeline" && base.length > 0 && (() => {
          // Processos em andamento COM RC (aging oficial a partir da RC)
          const tlBack = base.filter(r => r.emA && r.NumRC && r.NumRC.trim() !== "");
          // Agrupar por modalidade normalizada
          const modMap = new Map();
          tlBack.forEach(r => {
            const mn = nrm(r.Modalidade || "N/I");
            if (!modMap.has(mn)) modMap.set(mn, { label: r.Modalidade || "N/I", procs: [] });
            modMap.get(mn).procs.push(r);
          });
          const modRows = [...modMap.values()].sort((a, b) => b.procs.length - a.procs.length);

          // Cores por modalidade
          const MOD_COLORS = { "pregao": "#1a5276", "concorrencia": "#6c3483", "dispensa": "#e67e22", "inexigibilidade": "#c0392b", "adesao": "#16a085", "credenciamento": "#2e86c1", "dialogo": "#8e44ad" };
          const getModColor = (mn) => {
            for (const [k, v] of Object.entries(MOD_COLORS)) { if (mn.includes(k)) return v; }
            return "#34495e";
          };

          // Função para abrir drill-down (com contexto de fase opcional)
          const openDrill = (title, procs, phaseCtx) => { if (procs.length > 0) setDirTLDrill({ title, procs, phaseCtx: phaseCtx || null }); };

          return (
            <div className="anim-fade">
              {/* Header */}
              <div style={{ marginBottom: 18 }}>
                <div className="gaq-h1" style={{ marginBottom: 4 }}>Timeline por Modalidade</div>
                <div className="gaq-body" style={{ color: "var(--gaq-text-3)" }}>Visao consolidada das etapas por modalidade · {tlBack.length} processos em andamento com RC</div>
              </div>

              {/* KPIs resumo */}
              <div className="gaq-kpi-grid" style={{ gridTemplateColumns: "repeat(auto-fit, minmax(160px, 1fr))", marginBottom: 18 }}>
                <div className="gaq-kpi" style={{ borderTop: "3px solid #2e86c1", cursor: "pointer" }} onClick={() => openDrill("Todos os Processos em Andamento", tlBack)}>
                  <span className="lbl">Total em Andamento</span>
                  <div className="val" style={{ color: "#2e86c1" }}>{tlBack.length}</div>
                </div>
                <div className="gaq-kpi" style={{ borderTop: "3px solid #27ae60", cursor: "pointer" }} onClick={() => openDrill("Processos com SLA Atendido", tlBack.filter(r => !r.atrasoGeral))}>
                  <span className="lbl">SLA Atendido</span>
                  <div className="val" style={{ color: "#27ae60" }}>{tlBack.filter(r => !r.atrasoGeral).length}</div>
                </div>
                <div className="gaq-kpi" style={{ borderTop: "3px solid #e74c3c", cursor: "pointer" }} onClick={() => openDrill("Todos os Processos com SLA Vencido", tlBack.filter(r => r.atrasoGeral))}>
                  <span className="lbl">SLA Vencido</span>
                  <div className="val" style={{ color: "#e74c3c" }}>{tlBack.filter(r => r.atrasoGeral).length}</div>
                </div>
                <div className="gaq-kpi" style={{ borderTop: "3px solid #f39c12" }}>
                  <span className="lbl">Modalidades</span>
                  <div className="val" style={{ color: "#f39c12" }}>{modRows.length}</div>
                </div>
              </div>

              {/* Timeline por modalidade */}
              {modRows.map(({ label: modLabel, procs: modProcs }) => {
                const mn = nrm(modLabel);
                const modColor = getModColor(mn);
                const prazo = getPrazoGeral(mn);
                const colIdxs = getTLColsForMod(mn);
                const atrasados = modProcs.filter(r => r.atrasoGeral);

                // SLA por fase: dinâmico (se disponível) ou estático
                const dynamicSLA = buildDynamicSLA(phaseIntervals, mn);
                const isCPLMod = mn.includes("pregao") || mn.includes("concorrencia") || mn.includes("dialogo");
                const baseSLA = isCPLMod ? SLA_CPL : SLA_SIMPLES;
                const faseSLA = dynamicSLA || baseSLA;
                const hoje = new Date();

                // 1) Determinar posição de cada processo pela ÚLTIMA DATA PREENCHIDA.
                // Ignora fases voláteis (ex.: Indicação Analista) — sua data não representa
                // o avanço do processo no trilho, pois pode acontecer fora de sequência.
                const procLastIdx = new Map();
                modProcs.forEach(r => {
                  let lastIdx = -1;
                  for (let ci = colIdxs.length - 1; ci >= 0; ci--) {
                    const cIdx = colIdxs[ci];
                    const k = TL_COLS[cIdx][1];
                    if (VOLATILE_TIMELINE_KEYS.has(k)) continue;
                    if (pd(r[k])) { lastIdx = cIdx; break; }
                  }
                  // Se nenhuma data preenchida, colocar na primeira fase
                  if (lastIdx < 0) lastIdx = colIdxs[0];
                  procLastIdx.set(r, lastIdx);
                });

                // 2) Para cada etapa, agrupar processos cuja última data preenchida = esse idx
                // SLA por fase: dias desde a última data preenchida vs SLA da PRÓXIMA fase
                const phaseData = colIdxs.map((idx, posInList) => {
                  const [phaseLabel, phaseKey] = TL_COLS[idx];
                  const procsAtPhase = modProcs.filter(r => procLastIdx.get(r) === idx);

                  // Próxima fase no fluxo (para saber o SLA de transição)
                  const nextPos = posInList + 1;
                  const nextIdx = nextPos < colIdxs.length ? colIdxs[nextPos] : -1;
                  const nextPhaseKey = nextIdx >= 0 ? TL_COLS[nextIdx][1] : null;
                  let nextSLA = null;
                  if (nextPhaseKey) {
                    if (SLA_SD.hasOwnProperty(nextPhaseKey)) nextSLA = SLA_SD[nextPhaseKey];
                    else if (faseSLA.hasOwnProperty(nextPhaseKey)) nextSLA = faseSLA[nextPhaseKey];
                  }

                  // Verificar atraso por fase: dias desde a última data preenchida vs SLA da próxima fase
                  const procsComDelay = procsAtPhase.map(r => {
                    const lastDate = pd(r[phaseKey]);
                    const diasNaFase = lastDate ? du(lastDate, hoje) : 0;
                    const atrasoFase = (nextSLA != null && nextSLA > 0 && diasNaFase > nextSLA);
                    return { proc: r, diasNaFase, slaFase: nextSLA, atrasoFase };
                  });
                  const foraPrazo = procsComDelay.filter(x => x.atrasoFase).length;
                  const noPrazo = procsAtPhase.length - foraPrazo;

                  return { idx, phaseLabel, phaseKey, total: procsAtPhase.length, noPrazo, foraPrazo, procs: procsAtPhase, procsComDelay, nextSLA, nextPhaseKey };
                });

                return (
                  <div key={mn} style={{ background: "var(--card)", borderRadius: 14, marginBottom: 18, boxShadow: "var(--shadow)", overflow: "hidden", border: `1px solid ${modColor}22` }}>
                    {/* Header da modalidade */}
                    <div style={{ background: `linear-gradient(135deg, ${modColor} 0%, ${modColor}cc 100%)`, padding: "14px 20px", color: "#fff", display: "flex", justifyContent: "space-between", alignItems: "center" }}>
                      <div>
                        <div style={{ fontSize: 16, fontWeight: 800 }}>{modLabel}</div>
                        <div style={{ fontSize: 11, opacity: .8 }}>Prazo: {prazo} d.u. (a partir do Recebimento RC) · {modProcs.length} processo(s) em andamento</div>
                      </div>
                      <div style={{ display: "flex", gap: 10 }}>
                        <div onClick={() => openDrill(`Todos — ${modLabel}`, modProcs)}
                          style={{ background: "rgba(255,255,255,0.2)", borderRadius: 8, padding: "6px 12px", textAlign: "center", cursor: "pointer" }}>
                          <div style={{ fontSize: 18, fontWeight: 800 }}>{modProcs.length}</div>
                          <div style={{ fontSize: 8, opacity: .8 }}>total</div>
                        </div>
                        <div onClick={() => openDrill(`SLA Atendido — ${modLabel}`, modProcs.filter(r => !r.atrasoGeral))}
                          style={{ background: "rgba(39,174,96,0.3)", borderRadius: 8, padding: "6px 12px", textAlign: "center", cursor: "pointer" }}>
                          <div style={{ fontSize: 18, fontWeight: 800 }}>{modProcs.length - atrasados.length}</div>
                          <div style={{ fontSize: 8, opacity: .9 }}>SLA atendido</div>
                        </div>
                        <div onClick={() => openDrill(`SLA Vencido — ${modLabel}`, atrasados)}
                          style={{ background: atrasados.length > 0 ? "rgba(231,76,60,0.4)" : "rgba(255,255,255,0.15)", borderRadius: 8, padding: "6px 12px", textAlign: "center", cursor: atrasados.length > 0 ? "pointer" : "default", border: atrasados.length > 0 ? "1px solid rgba(231,76,60,0.6)" : "none" }}>
                          <div style={{ fontSize: 18, fontWeight: 800 }}>{atrasados.length}</div>
                          <div style={{ fontSize: 8, opacity: .9 }}>atraso</div>
                        </div>
                      </div>
                    </div>

                    {/* Linha do timeline — scroll horizontal */}
                    <div style={{ overflowX: "auto", padding: "16px 12px 12px" }}>
                      <div style={{ display: "flex", alignItems: "flex-start", gap: 0, minWidth: "max-content" }}>
                        {phaseData.map((ph, pi) => {
                          const isLast = pi === phaseData.length - 1;
                          const hasProcs = ph.total > 0;
                          const bgColor = ph.foraPrazo > 0 ? "#fdecea" : ph.total > 0 ? "#eafaf1" : "var(--card2)";
                          const borderColor = ph.foraPrazo > 0 ? "#e74c3c" : ph.total > 0 ? "#27ae60" : "var(--border2)";
                          return (
                            <React.Fragment key={ph.idx}>
                              {/* Etapa */}
                              <div onClick={() => openDrill(`${modLabel} — ${ph.phaseLabel}`, ph.procs, { procsComDelay: ph.procsComDelay, phaseLabel: ph.phaseLabel, nextSLA: ph.nextSLA })}
                                style={{ display: "flex", flexDirection: "column", alignItems: "center", minWidth: 90, maxWidth: 110, cursor: hasProcs ? "pointer" : "default", transition: "transform .15s" }}
                                onMouseEnter={e => { if (hasProcs) e.currentTarget.style.transform = "scale(1.05)"; }}
                                onMouseLeave={e => e.currentTarget.style.transform = "scale(1)"}>
                                {/* Bolha com contadores */}
                                <div style={{ background: bgColor, border: `2px solid ${borderColor}`, borderRadius: 12, padding: "8px 6px", textAlign: "center", width: "100%", minHeight: 60, display: "flex", flexDirection: "column", justifyContent: "center", transition: "box-shadow .15s", boxShadow: hasProcs ? "0 2px 8px rgba(0,0,0,0.08)" : "none" }}>
                                  <div style={{ fontSize: 20, fontWeight: 800, color: ph.total > 0 ? (ph.foraPrazo > 0 ? "#c0392b" : "#1a5276") : "var(--text3)" }}>{ph.total}</div>
                                  {ph.total > 0 && (
                                    <div style={{ display: "flex", justifyContent: "center", gap: 6, marginTop: 3 }}>
                                      <span style={{ fontSize: 9, color: "#27ae60", fontWeight: 700 }}>{ph.noPrazo} ok</span>
                                      {ph.foraPrazo > 0 && <span style={{ fontSize: 9, color: "#e74c3c", fontWeight: 700 }}>{ph.foraPrazo} atr</span>}
                                    </div>
                                  )}
                                </div>
                                {/* Nome da etapa */}
                                <div style={{ fontSize: 9, color: "var(--text2)", textAlign: "center", marginTop: 5, lineHeight: 1.2, fontWeight: 600, maxWidth: 100, wordBreak: "break-word" }}>{ph.phaseLabel}</div>
                              </div>
                              {/* Conector → */}
                              {!isLast && (
                                <div style={{ display: "flex", alignItems: "center", paddingTop: 28, minWidth: 20 }}>
                                  <div style={{ height: 2, width: 20, background: `linear-gradient(90deg, ${modColor}66, ${modColor}33)` }} />
                                </div>
                              )}
                            </React.Fragment>
                          );
                        })}

                        {/* Coluna final: Atraso Geral */}
                        <div style={{ display: "flex", alignItems: "center", paddingTop: 28, minWidth: 20 }}>
                          <div style={{ height: 2, width: 24, background: `linear-gradient(90deg, ${modColor}33, #e74c3c66)` }} />
                        </div>
                        <div onClick={() => openDrill(`Atraso Geral — ${modLabel} (>${prazo} d.u.)`, atrasados)}
                          style={{ display: "flex", flexDirection: "column", alignItems: "center", minWidth: 100, cursor: atrasados.length > 0 ? "pointer" : "default", transition: "transform .15s" }}
                          onMouseEnter={e => { if (atrasados.length > 0) e.currentTarget.style.transform = "scale(1.05)"; }}
                          onMouseLeave={e => e.currentTarget.style.transform = "scale(1)"}>
                          <div style={{ background: atrasados.length > 0 ? "#fdecea" : "#eafaf1", border: `2px solid ${atrasados.length > 0 ? "#e74c3c" : "#27ae60"}`, borderRadius: 12, padding: "8px 10px", textAlign: "center", width: "100%", minHeight: 60, display: "flex", flexDirection: "column", justifyContent: "center", boxShadow: atrasados.length > 0 ? "0 2px 12px rgba(231,76,60,0.15)" : "none" }}>
                            <div style={{ fontSize: 22, fontWeight: 800, color: atrasados.length > 0 ? "#c0392b" : "#27ae60" }}>{atrasados.length}</div>
                            <div style={{ fontSize: 9, fontWeight: 700, color: atrasados.length > 0 ? "#c0392b" : "#27ae60" }}>
                              {atrasados.length > 0 ? `>${prazo} d.u.` : "Todos ok"}
                            </div>
                          </div>
                          <div style={{ fontSize: 9, color: "#e74c3c", textAlign: "center", marginTop: 5, fontWeight: 700 }}>Atraso Geral</div>
                        </div>
                      </div>
                    </div>
                  </div>
                );
              })}

              {/* Modal Drill-down: lista de processos */}
              {dirTLDrill && <>
                <div onClick={() => setDirTLDrill(null)} style={{ position: "fixed", top: 0, left: 0, right: 0, bottom: 0, background: "rgba(0,0,0,0.5)", zIndex: 9998 }} />
                <div style={{ position: "fixed", top: "5vh", left: "5vw", right: "5vw", bottom: "5vh", background: "var(--bg, #fff)", borderRadius: 16, boxShadow: "0 12px 48px rgba(0,0,0,0.3)", zIndex: 9999, display: "flex", flexDirection: "column", overflow: "hidden" }}>
                  {/* Header do modal */}
                  <div style={{ padding: "16px 24px", borderBottom: "2px solid var(--border2)", display: "flex", justifyContent: "space-between", alignItems: "center", flexShrink: 0, background: "var(--card)" }}>
                    <div>
                      <div style={{ fontWeight: 800, fontSize: 16, color: "#1a5276" }}>{dirTLDrill.title}</div>
                      <div style={{ fontSize: 12, color: "var(--text3)", marginTop: 2 }}>{dirTLDrill.procs.length} processo(s) · Clique em uma linha para ver detalhes</div>
                    </div>
                    <button onClick={() => setDirTLDrill(null)} style={{ background: "#e74c3c15", border: "1px solid #e74c3c33", color: "#e74c3c", cursor: "pointer", fontSize: 14, fontWeight: 700, borderRadius: 8, padding: "6px 16px", transition: "background .15s" }}
                      onMouseEnter={e => e.currentTarget.style.background = "#e74c3c25"}
                      onMouseLeave={e => e.currentTarget.style.background = "#e74c3c15"}>Fechar</button>
                  </div>
                  {/* Corpo com scroll */}
                  <div style={{ flex: 1, overflowY: "auto", padding: "0 4px" }}>
                    {dirTLDrill.procs.length === 0
                      ? <div style={{ textAlign: "center", padding: 40, color: "var(--text3)", fontSize: 14 }}>Nenhum processo nesta seleção.</div>
                      : (() => {
                        const hasPhaseCtx = !!dirTLDrill.phaseCtx;
                        const delayMap = new Map();
                        if (hasPhaseCtx && dirTLDrill.phaseCtx.procsComDelay) {
                          dirTLDrill.phaseCtx.procsComDelay.forEach(x => delayMap.set(x.proc, x));
                        }
                        const sortedProcs = hasPhaseCtx
                          ? [...dirTLDrill.procs].sort((a, b) => {
                              const da = delayMap.get(a), db = delayMap.get(b);
                              // Atrasados na fase primeiro, depois por dias na fase desc
                              if (da && db) { if (da.atrasoFase !== db.atrasoFase) return da.atrasoFase ? -1 : 1; return (db.diasNaFase || 0) - (da.diasNaFase || 0); }
                              return (b.diasTotais || 0) - (a.diasTotais || 0);
                            })
                          : [...dirTLDrill.procs].sort((a, b) => (b.diasTotais || 0) - (a.diasTotais || 0));
                        const slaFaseLabel = hasPhaseCtx && dirTLDrill.phaseCtx.nextSLA ? `${dirTLDrill.phaseCtx.nextSLA} d.u.` : "—";
                        const totalAtrasoFase = hasPhaseCtx ? [...delayMap.values()].filter(x => x.atrasoFase).length : 0;
                        const totalOkFase = hasPhaseCtx ? dirTLDrill.procs.length - totalAtrasoFase : 0;
                        return <>
                          {/* Resumo por fase (só quando veio de uma bolha de fase) */}
                          {hasPhaseCtx && (
                            <div style={{ display: "flex", gap: 12, padding: "12px 16px", borderBottom: "1px solid var(--border2)", background: "var(--card2)", flexWrap: "wrap", alignItems: "center" }}>

                              <div style={{ fontSize: 11 }}><span style={{ background: totalAtrasoFase > 0 ? "#e74c3c" : "#27ae6022", color: totalAtrasoFase > 0 ? "#fff" : "#27ae60", borderRadius: 4, padding: "2px 8px", fontWeight: 700 }}>{totalAtrasoFase} em atraso na etapa</span></div>
                            </div>
                          )}
                          <table style={{ width: "100%", borderCollapse: "collapse", fontSize: 12 }}>
                            <thead>
                              <tr style={{ background: "var(--card2)", borderBottom: "2px solid var(--border2)", position: "sticky", top: 0, zIndex: 1 }}>
                                <th style={{ padding: "10px 8px", textAlign: "left", fontSize: 10, fontWeight: 700, color: "var(--text3)", textTransform: "uppercase" }}>Nº RC</th>
                                <th style={{ padding: "10px 8px", textAlign: "left", fontSize: 10, fontWeight: 700, color: "var(--text3)", textTransform: "uppercase" }}>Ticket pré-compra</th>
                                <th style={{ padding: "10px 8px", textAlign: "left", fontSize: 10, fontWeight: 700, color: "var(--text3)", textTransform: "uppercase", maxWidth: 220 }}>Objeto</th>
                                <th style={{ padding: "10px 8px", textAlign: "left", fontSize: 10, fontWeight: 700, color: "var(--text3)", textTransform: "uppercase" }}>Área</th>
                                <th style={{ padding: "10px 8px", textAlign: "left", fontSize: 10, fontWeight: 700, color: "var(--text3)", textTransform: "uppercase" }}>Comprador</th>
                                {hasPhaseCtx && <>
                                  <th style={{ padding: "10px 8px", textAlign: "center", fontSize: 10, fontWeight: 700, color: "#8e44ad", textTransform: "uppercase" }}>Dias na Fase</th>
                                  <th style={{ padding: "10px 8px", textAlign: "center", fontSize: 10, fontWeight: 700, color: "#8e44ad", textTransform: "uppercase" }}>SLA Fase</th>
                                  <th style={{ padding: "10px 8px", textAlign: "center", fontSize: 10, fontWeight: 700, color: "#8e44ad", textTransform: "uppercase" }}>Status Fase</th>
                                </>}
                                <th style={{ padding: "10px 8px", textAlign: "center", fontSize: 10, fontWeight: 700, color: "var(--text3)", textTransform: "uppercase" }}>Dias (RC)</th>
                                <th style={{ padding: "10px 8px", textAlign: "center", fontSize: 10, fontWeight: 700, color: "var(--text3)", textTransform: "uppercase" }}>Prazo Geral</th>
                                <th style={{ padding: "10px 8px", textAlign: "center", fontSize: 10, fontWeight: 700, color: "var(--text3)", textTransform: "uppercase" }}>Status Geral</th>
                              </tr>
                            </thead>
                            <tbody>
                              {sortedProcs.map((r, i) => {
                                const late = r.atrasoGeral;
                                const cor = late ? "#c0392b" : (r.diasTotais || 0) > r.prazoGeral * 0.7 ? "#e67e22" : "#27ae60";
                                const phDelay = delayMap.get(r);
                                return (
                                  <tr key={r.ProcessKey || i} onClick={() => { setDirTLDrill(null); setSelProc(r); }} style={{ cursor: "pointer", borderBottom: "1px solid var(--border2)", transition: "background .15s", background: phDelay && phDelay.atrasoFase ? "#fdecea44" : "transparent" }}
                                    onMouseEnter={e => e.currentTarget.style.background = "var(--hover)"}
                                    onMouseLeave={e => e.currentTarget.style.background = phDelay && phDelay.atrasoFase ? "#fdecea44" : "transparent"}>
                                    <td style={{ padding: "9px 8px", fontWeight: 700, color: "#2e86c1" }}>{r.NumRC || "—"}</td>
                                    <td style={{ padding: "9px 8px", color: "#27ae60", fontSize: 11 }}>{r.TicketSD || "—"}</td>
                                    <td style={{ padding: "9px 8px", color: "var(--text)", maxWidth: 220, overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }} title={r.Objeto}>{(r.Objeto || "").slice(0, 60) || "—"}</td>
                                    <td style={{ padding: "9px 8px", color: "var(--text2)" }}>{r["Área Requisitante"] || "—"}</td>
                                    <td style={{ padding: "9px 8px", color: "var(--text2)" }}>{r.Comprador || r.respNCL || "—"}</td>
                                    {hasPhaseCtx && phDelay && <>
                                      <td style={{ padding: "9px 8px", textAlign: "center", fontWeight: 800, color: phDelay.atrasoFase ? "#c0392b" : "#1a5276" }}>{phDelay.diasNaFase}</td>
                                      <td style={{ padding: "9px 8px", textAlign: "center", fontSize: 11, color: "#8e44ad" }}>{phDelay.slaFase != null ? `${phDelay.slaFase} d.u.` : "—"}</td>
                                      <td style={{ padding: "9px 8px", textAlign: "center" }}>
                                        {phDelay.atrasoFase
                                          ? <span style={{ background: "#e74c3c", color: "#fff", borderRadius: 4, padding: "2px 8px", fontSize: 10, fontWeight: 700 }}>ATRASO</span>
                                          : <span style={{ background: "#27ae6022", color: "#27ae60", borderRadius: 4, padding: "2px 8px", fontSize: 10, fontWeight: 600 }}>Ok</span>}
                                      </td>
                                    </>}
                                    {hasPhaseCtx && !phDelay && <>
                                      <td style={{ padding: "9px 8px", textAlign: "center", color: "var(--text3)" }}>—</td>
                                      <td style={{ padding: "9px 8px", textAlign: "center", color: "var(--text3)" }}>—</td>
                                      <td style={{ padding: "9px 8px", textAlign: "center", color: "var(--text3)" }}>—</td>
                                    </>}
                                    <td style={{ padding: "9px 8px", textAlign: "center", fontWeight: 800, color: cor }}>{r.diasTotais || 0}</td>
                                    <td style={{ padding: "9px 8px", textAlign: "center", fontSize: 11, color: "var(--text3)" }}>{r.prazoGeral} d.u.</td>
                                    <td style={{ padding: "9px 8px", textAlign: "center" }}>
                                      {late
                                        ? <span style={{ background: "#e74c3c", color: "#fff", borderRadius: 4, padding: "2px 8px", fontSize: 10, fontWeight: 700 }}>ATRASO</span>
                                        : <span style={{ background: "#27ae6022", color: "#27ae60", borderRadius: 4, padding: "2px 8px", fontSize: 10, fontWeight: 600 }}>No prazo</span>}
                                    </td>
                                  </tr>
                                );
                              })}
                            </tbody>
                          </table>
                        </>;
                      })()}
                  </div>
                </div>
              </>}

              {/* Legenda */}
              <div style={{ background: "var(--card)", borderRadius: 12, padding: "14px 20px", boxShadow: "var(--shadow)", marginTop: 10 }}>
                <div style={{ fontSize: 11, fontWeight: 700, color: "var(--text2)", marginBottom: 8 }}>Legenda</div>
                <div style={{ display: "flex", gap: 20, flexWrap: "wrap", fontSize: 11, color: "var(--text2)" }}>
                  <span><span style={{ display: "inline-block", width: 12, height: 12, background: "#eafaf1", border: "2px solid #27ae60", borderRadius: 4, marginRight: 4, verticalAlign: "middle" }} /> No prazo</span>
                  <span><span style={{ display: "inline-block", width: 12, height: 12, background: "#fdecea", border: "2px solid #e74c3c", borderRadius: 4, marginRight: 4, verticalAlign: "middle" }} /> Fora do prazo</span>
                  <span style={{ color: "var(--text3)" }}>Licitações (Pregão, Concorrência): <b>{PRAZO_LICITACAO} d.u.</b> a partir do Recebimento RC</span>
                  <span style={{ color: "var(--text3)" }}>Compras Diretas (Dispensa, Inexig., Adesão ARP, Credenc.): <b>{PRAZO_COMPRA_DIRETA} d.u.</b> a partir do Recebimento RC</span>
                  <span style={{ color: "var(--text3)" }}>Pré-compra (Abertura → Encerramento): <b>{PRAZO_SD} d.u.</b> (prazo apartado)</span>
                </div>
              </div>
            </div>
          );
        })()}

        {/* ════════════ ABA: UPLOAD ════════════ */}
        {isDiretor && dirTLDrill && aba !== "dirTimeline" && <>
          <div onClick={() => setDirTLDrill(null)} style={{ position: "fixed", top: 0, left: 0, right: 0, bottom: 0, background: "rgba(0,0,0,0.5)", zIndex: 9998 }} />
          <div style={{ position: "fixed", top: "5vh", left: "5vw", right: "5vw", bottom: "5vh", background: "var(--bg, #fff)", borderRadius: 16, boxShadow: "0 12px 48px rgba(0,0,0,0.3)", zIndex: 9999, display: "flex", flexDirection: "column", overflow: "hidden" }}>
            <div style={{ padding: "16px 24px", borderBottom: "2px solid var(--border2)", display: "flex", justifyContent: "space-between", alignItems: "center", flexShrink: 0, background: "var(--card)" }}>
              <div>
                <div style={{ fontWeight: 800, fontSize: 16, color: "#1a5276" }}>{dirTLDrill.title}</div>
                <div style={{ fontSize: 12, color: "var(--text3)", marginTop: 2 }}>{dirTLDrill.procs.length} processo(s) · Clique em uma linha para ver detalhes</div>
              </div>
              <button onClick={() => setDirTLDrill(null)} style={{ background: "#e74c3c15", border: "1px solid #e74c3c33", color: "#e74c3c", cursor: "pointer", fontSize: 14, fontWeight: 700, borderRadius: 8, padding: "6px 16px", transition: "background .15s" }}
                onMouseEnter={e => e.currentTarget.style.background = "#e74c3c25"}
                onMouseLeave={e => e.currentTarget.style.background = "#e74c3c15"}>Fechar</button>
            </div>
            <div style={{ flex: 1, overflowY: "auto", padding: "0 4px" }}>
              {dirTLDrill.procs.length === 0
                ? <div style={{ textAlign: "center", padding: 40, color: "var(--text3)", fontSize: 14 }}>Nenhum processo nesta seleção.</div>
                : (() => {
                  const hasPhaseCtx = !!dirTLDrill.phaseCtx;
                  const delayMap = new Map();
                  if (hasPhaseCtx && dirTLDrill.phaseCtx.procsComDelay) {
                    dirTLDrill.phaseCtx.procsComDelay.forEach(x => delayMap.set(x.proc, x));
                  }
                  const sortedProcs = hasPhaseCtx
                    ? [...dirTLDrill.procs].sort((a, b) => {
                        const da = delayMap.get(a), db = delayMap.get(b);
                        if (da && db) { if (da.atrasoFase !== db.atrasoFase) return da.atrasoFase ? -1 : 1; return (db.diasNaFase || 0) - (da.diasNaFase || 0); }
                        return (b.diasTotais || 0) - (a.diasTotais || 0);
                      })
                    : [...dirTLDrill.procs].sort((a, b) => (b.diasTotais || 0) - (a.diasTotais || 0));
                  const slaFaseLabel = hasPhaseCtx && dirTLDrill.phaseCtx.nextSLA ? `${dirTLDrill.phaseCtx.nextSLA} d.u.` : "—";
                  const totalAtrasoFase = hasPhaseCtx ? [...delayMap.values()].filter(x => x.atrasoFase).length : 0;
                  const totalOkFase = hasPhaseCtx ? dirTLDrill.procs.length - totalAtrasoFase : 0;
                  return <>
                    {hasPhaseCtx && (
                      <div style={{ display: "flex", gap: 12, padding: "12px 16px", borderBottom: "1px solid var(--border2)", background: "var(--card2)", flexWrap: "wrap", alignItems: "center" }}>
                        <div style={{ fontSize: 11, fontWeight: 700, color: "var(--text2)" }}>SLA da etapa: <span style={{ color: "#1a5276" }}>{slaFaseLabel}</span></div>
                        <div style={{ fontSize: 11 }}><span style={{ background: "#27ae6022", color: "#27ae60", borderRadius: 4, padding: "2px 8px", fontWeight: 700 }}>{totalOkFase} no prazo da etapa</span></div>
                        <div style={{ fontSize: 11 }}><span style={{ background: totalAtrasoFase > 0 ? "#e74c3c" : "#27ae6022", color: totalAtrasoFase > 0 ? "#fff" : "#27ae60", borderRadius: 4, padding: "2px 8px", fontWeight: 700 }}>{totalAtrasoFase} em atraso na etapa</span></div>
                      </div>
                    )}
                    <table style={{ width: "100%", borderCollapse: "collapse", fontSize: 12 }}>
                      <thead>
                        <tr style={{ background: "var(--card2)", borderBottom: "2px solid var(--border2)", position: "sticky", top: 0, zIndex: 1 }}>
                          <th style={{ padding: "10px 8px", textAlign: "left", fontSize: 10, fontWeight: 700, color: "var(--text3)", textTransform: "uppercase" }}>Nº RC</th>
                          <th style={{ padding: "10px 8px", textAlign: "left", fontSize: 10, fontWeight: 700, color: "var(--text3)", textTransform: "uppercase" }}>Ticket pré-compra</th>
                          <th style={{ padding: "10px 8px", textAlign: "left", fontSize: 10, fontWeight: 700, color: "var(--text3)", textTransform: "uppercase", maxWidth: 220 }}>Objeto</th>
                          <th style={{ padding: "10px 8px", textAlign: "left", fontSize: 10, fontWeight: 700, color: "var(--text3)", textTransform: "uppercase" }}>Área</th>
                          <th style={{ padding: "10px 8px", textAlign: "left", fontSize: 10, fontWeight: 700, color: "var(--text3)", textTransform: "uppercase" }}>Comprador</th>
                          {hasPhaseCtx && <>
                            <th style={{ padding: "10px 8px", textAlign: "center", fontSize: 10, fontWeight: 700, color: "#8e44ad", textTransform: "uppercase" }}>Dias na Fase</th>
                            <th style={{ padding: "10px 8px", textAlign: "center", fontSize: 10, fontWeight: 700, color: "#8e44ad", textTransform: "uppercase" }}>SLA Fase</th>
                            <th style={{ padding: "10px 8px", textAlign: "center", fontSize: 10, fontWeight: 700, color: "#8e44ad", textTransform: "uppercase" }}>Status Fase</th>
                          </>}
                          <th style={{ padding: "10px 8px", textAlign: "center", fontSize: 10, fontWeight: 700, color: "var(--text3)", textTransform: "uppercase" }}>Dias (RC)</th>
                          <th style={{ padding: "10px 8px", textAlign: "center", fontSize: 10, fontWeight: 700, color: "var(--text3)", textTransform: "uppercase" }}>Prazo Geral</th>
                          <th style={{ padding: "10px 8px", textAlign: "center", fontSize: 10, fontWeight: 700, color: "var(--text3)", textTransform: "uppercase" }}>Status Geral</th>
                        </tr>
                      </thead>
                      <tbody>
                        {sortedProcs.map((r, i) => {
                          const late = r.atrasoGeral;
                          const cor = late ? "#c0392b" : (r.diasTotais || 0) > r.prazoGeral * 0.7 ? "#e67e22" : "#27ae60";
                          const phDelay = delayMap.get(r);
                          return (
                            <tr key={r.ProcessKey || i} onClick={() => { setDirTLDrill(null); setSelProc(r); }} style={{ cursor: "pointer", borderBottom: "1px solid var(--border2)", transition: "background .15s", background: phDelay && phDelay.atrasoFase ? "#fdecea44" : "transparent" }}
                              onMouseEnter={e => e.currentTarget.style.background = "var(--hover)"}
                              onMouseLeave={e => e.currentTarget.style.background = phDelay && phDelay.atrasoFase ? "#fdecea44" : "transparent"}>
                              <td style={{ padding: "9px 8px", fontWeight: 700, color: "#2e86c1" }}>{r.NumRC || "—"}</td>
                              <td style={{ padding: "9px 8px", color: "#27ae60", fontSize: 11 }}>{r.TicketSD || "—"}</td>
                              <td style={{ padding: "9px 8px", color: "var(--text)", maxWidth: 220, overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }} title={r.Objeto}>{(r.Objeto || "").slice(0, 60) || "—"}</td>
                              <td style={{ padding: "9px 8px", color: "var(--text2)" }}>{r["Área Requisitante"] || "—"}</td>
                              <td style={{ padding: "9px 8px", color: "var(--text2)" }}>{r.Comprador || r.respNCL || "—"}</td>
                              {hasPhaseCtx && phDelay && <>
                                <td style={{ padding: "9px 8px", textAlign: "center", fontWeight: 800, color: phDelay.atrasoFase ? "#c0392b" : "#1a5276" }}>{phDelay.diasNaFase}</td>
                                <td style={{ padding: "9px 8px", textAlign: "center", fontSize: 11, color: "#8e44ad" }}>{phDelay.slaFase != null ? `${phDelay.slaFase} d.u.` : "—"}</td>
                                <td style={{ padding: "9px 8px", textAlign: "center" }}>
                                  {phDelay.atrasoFase
                                    ? <span style={{ background: "#e74c3c", color: "#fff", borderRadius: 4, padding: "2px 8px", fontSize: 10, fontWeight: 700 }}>ATRASO</span>
                                    : <span style={{ background: "#27ae6022", color: "#27ae60", borderRadius: 4, padding: "2px 8px", fontSize: 10, fontWeight: 600 }}>Ok</span>}
                                </td>
                              </>}
                              {hasPhaseCtx && !phDelay && <>
                                <td style={{ padding: "9px 8px", textAlign: "center", color: "var(--text3)" }}>?</td>
                                <td style={{ padding: "9px 8px", textAlign: "center", color: "var(--text3)" }}>?</td>
                                <td style={{ padding: "9px 8px", textAlign: "center", color: "var(--text3)" }}>?</td>
                              </>}
                              <td style={{ padding: "9px 8px", textAlign: "center", fontWeight: 800, color: cor }}>{r.diasTotais || 0}</td>
                              <td style={{ padding: "9px 8px", textAlign: "center", fontSize: 11, color: "var(--text3)" }}>{r.prazoGeral} d.u.</td>
                              <td style={{ padding: "9px 8px", textAlign: "center" }}>
                                {late
                                  ? <span style={{ background: "#e74c3c", color: "#fff", borderRadius: 4, padding: "2px 8px", fontSize: 10, fontWeight: 700 }}>ATRASO</span>
                                  : <span style={{ background: "#27ae6022", color: "#27ae60", borderRadius: 4, padding: "2px 8px", fontSize: 10, fontWeight: 600 }}>No prazo</span>}
                              </td>
                            </tr>
                          );
                        })}
                      </tbody>
                    </table>
                  </>;
                })()}
            </div>
          </div>
        </>}

        {aba === "upload" && <div style={{ maxWidth: 540, margin: "40px auto" }}>
          <div style={{ background: "var(--card)", borderRadius: 14, padding: 36, boxShadow: "var(--shadow2)", border: "2px dashed #85c1e9", textAlign: "center" }}>
            <div style={{ fontSize: 44, marginBottom: 10 }}>📂</div>
            <div style={{ fontWeight: 700, fontSize: 17, marginBottom: 6, color: "#1a5276" }}>Carregar Base Consolidada</div>
            <div style={{ fontSize: 12, color: "var(--text2)", marginBottom: 20 }}>Aceita <b>.xlsx</b> ou <b>.csv</b> — ou coloque <b>dados.js</b> na mesma pasta para carga automática.</div>

            {!senhaOk
              ? <div style={{ background: "var(--card2)", borderRadius: 10, padding: "20px 24px", marginBottom: 16, textAlign: "left" }}>
                  <div style={{ fontSize: 13, fontWeight: 700, color: "#1a5276", marginBottom: 6 }}>Acesso restrito</div>
                  <div style={{ fontSize: 12, color: "var(--text2)", marginBottom: 12 }}>Digite a senha para liberar o upload.</div>
                  <input type="password" value={senhaInput} onChange={e => { setSenhaInput(e.target.value); setSenhaErro(false); }}
                    onKeyDown={async e => { if (e.key === "Enter") { const h = await gaqHashSenha(senhaInput); if (typeof UPLOAD_PASS !== "undefined" && h === UPLOAD_PASS) { setSenhaOk(true); setSenhaErro(false); } else { setSenhaErro(true); setSenhaInput(""); } } }}
                    placeholder="Senha de acesso..."
                    style={{ width: "100%", padding: "9px 12px", borderRadius: 7, border: `1.5px solid ${senhaErro ? "#e74c3c" : "var(--input-bd)"}`, fontSize: 13, background: "var(--input-bg)", color: "var(--text)", marginBottom: 8 }} />
                  {senhaErro && <div style={{ fontSize: 12, color: "#c0392b", marginBottom: 8 }}>Senha incorreta.</div>}
                  <button onClick={async () => { const h = await gaqHashSenha(senhaInput); if (typeof UPLOAD_PASS !== "undefined" && h === UPLOAD_PASS) { setSenhaOk(true); setSenhaErro(false); } else { setSenhaErro(true); setSenhaInput(""); } }}
                    style={{ background: "#1a5276", color: "#fff", border: "none", borderRadius: 8, padding: "9px 24px", cursor: "pointer", fontWeight: 700, fontSize: 13, width: "100%" }}>Confirmar</button>
                </div>
              : <>
                  <div style={{ background: "#eafaf1", borderRadius: 8, padding: "8px 14px", fontSize: 12, color: "#1e8449", fontWeight: 600, marginBottom: 16 }}>Acesso autorizado</div>
                  <div style={{ fontSize: 11, color: "var(--text3)", marginBottom: 20, background: "var(--card2)", borderRadius: 8, padding: "10px 14px", textAlign: "left", lineHeight: 1.6 }}>
                    <b>Como compartilhar (Opção C):</b><br/>
                    1. Faça upload da planilha abaixo<br/>
                    2. Clique "Exportar dados.js" e "Exportar tags.js"<br/>
                    3. Coloque <b>index.html + dados.js + tags.js</b> na mesma pasta (rede ou SharePoint)<br/>
                    4. Colegas abrem o index.html — dados carregam automaticamente
                  </div>
                  {loading
                    ? <div style={{ background: "#eaf4fb", borderRadius: 8, padding: 16, color: "#1a5276", fontWeight: 600 }}>Processando...</div>
                    : <label style={{ background: "#1a5276", color: "#fff", padding: "12px 30px", borderRadius: 8, cursor: "pointer", fontSize: 14, fontWeight: 600, display: "inline-block" }}>
                        Selecionar arquivo
                        <input type="file" accept=".xlsx,.csv" onChange={handleUpload} style={{ display: "none" }} />
                      </label>}
                  {erro && <div style={{ marginTop: 14, background: "#fdecea", borderRadius: 8, padding: 12, fontSize: 12, color: "#c0392b" }}>{erro}</div>}
                  {base.length > 0 && !loading && <div style={{ marginTop: 16 }}>
                    <div style={{ fontSize: 13, color: "#1e8449", fontWeight: 600, marginBottom: 10 }}>
                      {base.length} registros carregados · <span style={{ cursor: "pointer", textDecoration: "underline" }} onClick={() => setAba("overview")}>Ver painel →</span>
                    </div>
                    <div style={{ display: "flex", gap: 8, justifyContent: "center", flexWrap: "wrap" }}>
                      <button onClick={() => exportAsJS(rawRows)}
                        style={{ background: "#2e86c1", color: "#fff", border: "none", borderRadius: 7, padding: "8px 18px", cursor: "pointer", fontSize: 12, fontWeight: 600 }}>
                        💾 Exportar dados.js
                      </button>
                      <button onClick={() => exportTagsAsJS()}
                        style={{ background: "#34495e", color: "#fff", border: "none", borderRadius: 7, padding: "8px 18px", cursor: "pointer", fontSize: 12, fontWeight: 600 }}>
                        🏷️ Exportar tags.js
                      </button>
                    </div>
                  </div>}
                </>}
          </div>
        </div>}

        {/* ════════════ ABA: OVERVIEW ════════════ */}
        {aba === "overview" && (base.length === 0

                            <div style={{ fontSize: 16, flexShrink: 0 }}>{icon}</div>
                            <div style={{ flex: 1 }}>
                              <div style={{ fontSize: 12, fontWeight: 700, color: "var(--text)" }}>{faixa}</div>
                              <div style={{ height: 5, borderRadius: 3, background: "#e0e0e0", marginTop: 4 }}>
                                <div style={{ height: "100%", borderRadius: 3, background: color, width: fBack.length > 0 ? (data.length / fBack.length * 100) + "%" : "0%", transition: "width .4s" }} />

                            <div style={{ textAlign: "right", flexShrink: 0 }}>
                              <div style={{ fontSize: 20, fontWeight: 900, color, lineHeight: 1 }}>{data.length}</div>
