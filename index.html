                            <span style={{ fontSize: 10, background: "transparent", borderRadius: 6, padding: "1px 7px", color: "#b45309", fontWeight: 600, border: "1px solid #fde68a" }}>enc. sem RC</span>
                            {duEnc > 7 && <span style={{ fontSize: 10, background: "#dc2626", color: "#fff", borderRadius: 6, padding: "2px 9px", fontWeight: 700 }}>URGENTE {duEnc} d.u.</span>}
                            {r["Área Requisitante"] && <span style={{ fontSize: 10, background: "#eff6ff", color: "#2563eb", borderRadius: 6, padding: "1px 7px", fontWeight: 700 }}>{r["Área Requisitante"]}</span>}
                            {r.Modalidade && <span style={{ fontSize: 10, color: "var(--text3)" }}>{r.Modalidade}</span>}
                            <span onClick={(e) => { e.stopPropagation(); onOpenTags(r); }} style={{ fontSize: 10, cursor: "pointer", color: "var(--text3)", textDecoration: "underline" }}>+tag</span>
                            <span onClick={(e) => { e.stopPropagation(); toggleWatch(r); }} style={{ fontSize: 10, cursor: "pointer", color: watched ? "#f59e0b" : "var(--border2)", fontWeight: watched ? 700 : 400 }}>{watched ? "★" : "☆"}</span>
                          </div>
                          {r.statusDet && <div style={{ display: "inline-block", fontSize: 10, color: "#7c3aed", background: "#f5f3ff", borderRadius: 5, padding: "1px 7px", marginBottom: 4 }}>{r.statusDet}</div>}
                          <div style={{ fontSize: 12, color: "var(--text)", marginBottom: 4, overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }}>{(r.Objeto || "").slice(0, 100) || "—"}</div>
                          <ServiceDeskAlertStrip summary={sdAlert} />
                          <div style={{ display: "flex", gap: 5, flexWrap: "wrap", fontSize: 10, color: "var(--text3)" }}>
                            {r["Área Requisitante"] && <span>Área: <b style={{ color: "var(--text2)" }}>{r["Área Requisitante"]}</b></span>}
                            {r.aberturaSD && <span>· Abertura pré-compra: <b style={{ color: "var(--text2)" }}>{r.aberturaSD.toLocaleDateString("pt-BR")}</b></span>}
                            {r.encSD && <span>· Encerramento pré-compra: <b style={{ color: "#b45309" }}>{r.encSD.toLocaleDateString("pt-BR")}</b></span>}
                            {r.diasAgingSD > 0 && <span>· Aging pré-compra: <b style={{ color: "var(--text2)" }}>{r.diasAgingSD} d.u.</b></span>}
                          </div>
                          {tags.length > 0 && <div style={{ marginTop: 4 }}>{tags.map(t => <TagBadge key={t} tag={t} small />)}</div>}
                        </div>
                        <div style={{ textAlign: "center", minWidth: 64, flexShrink: 0, background: bgBadge, borderRadius: 10, padding: "8px 10px", display: "flex", flexDirection: "column", alignItems: "center", justifyContent: "center" }}>
                          <div style={{ fontSize: 26, fontWeight: 800, color: cor, lineHeight: 1 }}>{duEnc}</div>
                          <div style={{ fontSize: 9, color: "var(--text3)", fontWeight: 600, textTransform: "uppercase", marginTop: 2 }}>d.u. s/ RC</div>
                          <div style={{ fontSize: 9, color: "#b45309", fontWeight: 600, marginTop: 3 }}>Pend. Área</div>
                        </div>
                      </div>
                    </div>
                  );
                })}
                <Pagination total={alertSDEncerrado.length} page={pgAlertSDEnc} pageSize={pgAlertSDEncSz} onPage={setPgAlertSDEnc} onSize={setPgAlertSDEncSz} />
              </>}
            </>
          }
        </div>}

        {/* ════════════ ABA: MAPEAMENTO (ENRIQUECIDO) ════════════ */}
        {aba === "mapeamento" && <div className="anim-fade">
          {renderBuscaPanel()}
          <div style={{ marginBottom: 18 }}>
            <div className="gaq-h1" style={{ marginBottom: 4 }}>Mapeamento</div>
            <div className="gaq-body" style={{ color: "var(--gaq-text-3)" }}>Cancelamentos e fracassos · padroes recorrentes nas RCs encerradas sem efetivacao</div>
          </div>

          {/* KPIs */}
          <div className="gaq-kpi-grid" style={{ gridTemplateColumns: "repeat(auto-fit, minmax(180px, 1fr))", marginBottom: 18 }}>
            {mapInsights.taxas.map(t => (
              <div key={t.label} className="gaq-kpi" style={{ borderTop: `3px solid ${t.color}` }}>
                <span className="lbl">{t.label}</span>
                <div className="val" style={{ color: t.color }}>{t.val}</div>
              </div>
            ))}
          </div>

          {/* NOVO: Evolução anual */}
          {mapInsights.evolucaoAnual.length > 1 && <WCard title="Evolução Anual — Cancelamentos + Fracassos" border="#e67e22">
            <ResponsiveContainer width="100%" height={180}>
              <BarChart data={mapInsights.evolucaoAnual}>
                <XAxis dataKey="ano" fontSize={11} />
                <YAxis fontSize={11} />
                <Tooltip formatter={(v, name) => [name === "cf" ? `${v} problemáticos` : `${v} total`, name === "cf" ? "Canc./Frac." : "Total"]} />
                <Bar dataKey="total" fill="#85c1e9" radius={[3,3,0,0]} name="Total" />
                <Bar dataKey="cf" fill="#e74c3c" radius={[3,3,0,0]} name="Canc./Frac." />
              </BarChart>
            </ResponsiveContainer>
            <div style={{ display: "flex", gap: 16, marginTop: 8, fontSize: 11, color: "var(--text2)" }}>
              {mapInsights.evolucaoAnual.map(e => (
                <span key={e.ano}><b>{e.ano}:</b> {e.taxa}% ({e.cf}/{e.total})</span>
              ))}
            </div>
          </WCard>}

          <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 16, marginBottom: 16 }}>
            <div className="gaq-card" style={{ padding: 22 }}>
              <div className="gaq-h3" style={{ marginBottom: 12 }}>Taxa por Area (min. 4 proc.)</div>
              {mapInsights.porArea.length === 0 ? <div className="gaq-meta">Sem dados.</div> : mapInsights.porArea.map((x, i) => (
                <div key={x.name} style={{ display: "flex", justifyContent: "space-between", alignItems: "center", padding: "6px 0", borderBottom: "1px solid var(--gaq-line)", fontSize: 12, cursor: "pointer" }}
                  onClick={() => { setFArea(x.name); setAba("processos"); }}>
                  <span style={{ overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap", maxWidth: 200, color: "var(--gaq-text)" }}><span className="gaq-meta" style={{ marginRight: 6 }}>#{i+1}</span>{x.name}</span>
                  <span style={{ display: "flex", gap: 6, alignItems: "center" }}>
                    <span style={{ background: x.taxa > 40 ? "#c0392b" : x.taxa > 20 ? "#e67e22" : "#f39c12", color: "#fff", borderRadius: 999, padding: "2px 10px", fontSize: 11, fontWeight: 700 }}>{x.taxa}%</span>
                    <span className="gaq-meta">{x.cf}/{x.tot}</span>
                  </span>
                </div>
              ))}
            </div>
            <div className="gaq-card" style={{ padding: 22 }}>
              <div className="gaq-h3" style={{ marginBottom: 12 }}>Taxa por Modalidade</div>
              {mapInsights.porMod.length === 0 ? <div className="gaq-meta">Sem dados.</div> : mapInsights.porMod.map((x, i) => (
                <div key={x.name} style={{ display: "flex", justifyContent: "space-between", alignItems: "center", padding: "6px 0", borderBottom: "1px solid var(--gaq-line)", fontSize: 12 }}>
                  <span style={{ overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap", maxWidth: 180, color: "var(--gaq-text)" }}><span className="gaq-meta" style={{ marginRight: 6 }}>#{i+1}</span>{x.name}</span>
                  <span style={{ display: "flex", gap: 6, alignItems: "center" }}>
                    <span style={{ background: x.taxa > 40 ? "#c0392b" : x.taxa > 20 ? "#e67e22" : "#f39c12", color: "#fff", borderRadius: 999, padding: "2px 10px", fontSize: 11, fontWeight: 700 }}>{x.taxa}%</span>
                    {x.medLT && <span className="gaq-meta">{x.medLT} d.u.</span>}
                  </span>
                </div>
              ))}
            </div>
          </div>

          {/* NOVO: Tempo médio até cancelamento vs conclusão */}
          {mapInsights.tempoMedio.length > 0 && <WCard title="Tempo Médio até Cancelamento/Fracasso vs. Conclusão (por Modalidade)" border="#2e86c1">
            <div style={{ marginBottom: 4 }}>
              {mapInsights.tempoMedio.map(t => (
                <div key={t.name} style={{ display: "flex", justifyContent: "space-between", alignItems: "center", padding: "5px 0", borderBottom: "1px solid var(--border2)", fontSize: 12 }}>
                  <span style={{ color: "var(--text)", maxWidth: 200, overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }}>{t.name} <span style={{ color: "var(--text3)", fontSize: 10 }}>({t.qtdCF} proc.)</span></span>
                  <span style={{ display: "flex", gap: 10, alignItems: "center" }}>
                    <span style={{ color: "#c0392b", fontWeight: 700 }}>{t.medCF} d.u. <span style={{ fontWeight: 400, fontSize: 10 }}>canc./frac.</span></span>
                    {t.medConc && <span style={{ color: "#27ae60", fontWeight: 700 }}>{t.medConc} d.u. <span style={{ fontWeight: 400, fontSize: 10 }}>concluído</span></span>}
                  </span>
                </div>
              ))}
            </div>
            <div style={{ fontSize: 10, color: "var(--text3)", marginTop: 4 }}>Insight: se o tempo até cancelamento é alto, há custo de oportunidade significativo.</div>
          </WCard>}

          {/* Reincidentes */}
          {mapInsights.reincidentes.length > 0 && <div className="gaq-card" style={{ padding: 22, marginBottom: 16 }}>
            <div className="gaq-h3" style={{ marginBottom: 12 }}>Objetos com reincidencia</div>
            <div className="gaq-meta" style={{ marginBottom: 14 }}>2+ tentativas de contratacao no ano</div>
            {mapInsights.reincidentes.map((r, i) => (
              <div key={i} className="gaq-card" style={{ padding: "14px 18px", marginBottom: 10, borderRadius: 16, borderLeft: `3px solid ${r.count >= 3 ? "#c0392b" : "#e67e22"}` }}>
                <div style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-start", gap: 10 }}>
                  <div style={{ flex: 1 }}>
                    <div style={{ fontSize: 13, fontWeight: 500, color: "var(--gaq-text)", marginBottom: 6 }}>{r.objeto}</div>
                    <div style={{ display: "flex", gap: 8, flexWrap: "wrap", fontSize: 11 }}>
                      <span style={{ color: "#e67e22", background: "rgba(230,126,34,0.1)", borderRadius: 999, padding: "2px 10px", fontWeight: 600 }}>{r.cancelados} cancelados</span>
                      <span style={{ color: "#8e44ad", background: "rgba(142,68,173,0.1)", borderRadius: 999, padding: "2px 10px", fontWeight: 600 }}>{r.fracassados} fracassados</span>
                      <span className="gaq-meta">Areas: {r.areas.join(", ") || "—"}</span>
                    </div>
                    <div className="gaq-meta" style={{ marginTop: 4 }}>RCs: {r.nums.join(" · ")}</div>
                  </div>
                  <div style={{ fontWeight: 800, fontSize: 24, color: r.count >= 3 ? "#c0392b" : "#e67e22", flexShrink: 0 }}>{r.count}x</div>
                </div>
              </div>
            ))}
          </div>}

          {/* Padroes fracasso */}
          <div className="gaq-card" style={{ padding: 22, marginBottom: 16 }}>
            <div className="gaq-h3" style={{ color: "#8e44ad", marginBottom: 4 }}>Padroes exclusivos de fracassados (≥2)</div>
            <div className="gaq-meta" style={{ marginBottom: 14 }}>Foco em objetos com historico de disputa fracassada.</div>
            {mapInsights.padFracasso.length === 0 ? <div className="gaq-meta" style={{ textAlign: "center", padding: 16 }}>Nenhum padrao.</div>
              : mapInsights.padFracasso.map(p => <PatternCard key={p.word} p={p} accent="#8e44ad" />)}
          </div>

          {/* Padroes gerais */}
          <div className="gaq-card" style={{ padding: 22, marginBottom: 16 }}>
            <div className="gaq-h3" style={{ marginBottom: 4 }}>Padroes Gerais — Cancelados + Fracassados (≥3)</div>
            <div className="gaq-meta" style={{ marginBottom: 14 }}>Padroes recorrentes na base de dados.</div>
            {mapInsights.padroes.length === 0 ? <div className="gaq-meta" style={{ textAlign: "center", padding: 16 }}>Nenhum padrao.</div>
              : mapInsights.padroes.map(p => <PatternCard key={p.word} p={p} />)}
          </div>
        </div>}

      </div>

      {/* MODAL: Comprador/Responsável */}
      {/* ════════════ WATCHLIST NOTIFICATION PANEL ════════════ */}
      {showWatchPanel && (
        <div style={{ position: "fixed", top: 80, right: 20, width: 420, maxHeight: "70vh", zIndex: 850, background: "var(--card)", borderRadius: 14, boxShadow: "0 8px 40px rgba(0,0,0,0.25)", border: `2px solid ${watchChanges.length > 0 ? "#f39c12" : "#2e86c1"}`, display: "flex", flexDirection: "column", overflow: "hidden" }}>
          <div style={{ padding: "14px 18px", background: watchChanges.length > 0 ? "linear-gradient(135deg, #f39c12 0%, #e67e22 100%)" : "linear-gradient(135deg, #1a5276 0%, #2c3e50 100%)", color: "#fff", display: "flex", justifyContent: "space-between", alignItems: "center" }}>
            <div>
              <div style={{ fontWeight: 700, fontSize: 14 }}>👁 Watchlist {watchChanges.length > 0 ? "— Mudanças Detectadas" : ""}</div>
              <div style={{ fontSize: 10, opacity: .85 }}>
                {watchChanges.length > 0
                  ? `${watchChanges.length} processo(s) com alterações desde a última verificação`
                  : `${WatchlistManager.count()} processo(s) acompanhados`}
              </div>
            </div>
            <button onClick={() => setShowWatchPanel(false)} style={{ background: "none", border: "none", color: "#fff", fontSize: 20, cursor: "pointer" }}>×</button>
          </div>
          <div style={{ overflow: "auto", padding: "12px 16px", flex: 1 }}>
            {watchChanges.length > 0 ? watchChanges.map((ch, i) => (
              <div key={ch.pk} style={{ background: "var(--card2)", borderRadius: 8, padding: "10px 14px", marginBottom: 8, borderLeft: "4px solid #f39c12", cursor: "pointer" }}
                onClick={() => { setSelProc(ch.proc); setShowWatchPanel(false); }}>
                <div style={{ fontWeight: 700, fontSize: 12, color: "#2e86c1", marginBottom: 4 }}>
                  {ch.proc.NumRC || "—"} {ch.proc.TicketSD ? `· Pré-compra: ${ch.proc.TicketSD}` : ""}
                </div>
                <div style={{ fontSize: 11, color: "var(--text2)", overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap", marginBottom: 6 }}>
                  {(ch.proc.Objeto || "").slice(0, 80) || "—"}
                </div>
                {ch.items.map((it, j) => (
                  <div key={j} style={{ fontSize: 11, color: "#d35400", padding: "2px 0", display: "flex", gap: 6, alignItems: "flex-start" }}>
                    <span>{it.icon}</span><span>{it.desc}</span>
                  </div>
                ))}
              </div>
            )) : (() => {
              const wList = WatchlistManager.getList();
              const wProcs = wList.map(pk => base.find(r => r.ProcessKey === pk)).filter(Boolean);
              return wProcs.length === 0
                ? <div style={{ textAlign: "center", padding: 30, color: "var(--text3)" }}>
                    <div style={{ fontSize: 32, marginBottom: 8 }}>👁</div>
                    <div style={{ fontSize: 13, fontWeight: 600 }}>Nenhum processo na watchlist</div>
                    <div style={{ fontSize: 11, marginTop: 4 }}>Abra a timeline de um processo e clique em "Acompanhar" ou use a ☆ nos cards de alerta.</div>
                  </div>
                : wProcs.map(r => (
                  <div key={r.ProcessKey} style={{ background: "var(--card2)", borderRadius: 8, padding: "8px 12px", marginBottom: 6, cursor: "pointer", display: "flex", justifyContent: "space-between", alignItems: "center", borderLeft: `3px solid ${r.emA ? "#2e86c1" : r.isConcluded ? "#27ae60" : "#e67e22"}` }}
                    onClick={() => { setSelProc(r); setShowWatchPanel(false); }}>
                    <div style={{ flex: 1, minWidth: 0 }}>
                      <div style={{ fontWeight: 700, fontSize: 12, color: "#2e86c1" }}>{r.NumRC || "—"}</div>
                      <div style={{ fontSize: 10, color: "var(--text2)", overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }}>{(r.Objeto || "").slice(0, 60)}</div>
                      <div style={{ fontSize: 10, color: "var(--text3)" }}>{r.status} · {r.diasTotais} d.u. · {r.respNCL || r.Pregoeiro || "—"}</div>
                    </div>
                    <button onClick={(e) => { e.stopPropagation(); toggleWatch(r); }} title="Remover da watchlist"
                      style={{ background: "none", border: "none", color: "#e74c3c", fontSize: 14, cursor: "pointer", flexShrink: 0 }}>✕</button>
                  </div>
                ));
            })()}
          </div>
          <div style={{ padding: "10px 16px", borderTop: "1px solid var(--border)", display: "flex", gap: 8, justifyContent: "space-between" }}>
            {watchChanges.length > 0 && <button onClick={() => { WatchlistManager.acknowledgeAll(base); setWatchChanges([]); }}
              style={{ background: "#27ae60", color: "#fff", border: "none", borderRadius: 7, padding: "7px 16px", cursor: "pointer", fontSize: 11, fontWeight: 700, flex: 1 }}>
              ✓ Marcar tudo como visto
            </button>}
            {WatchlistManager.count() > 0 && <button onClick={() => { setFWatch(true); setAba("processos"); setShowWatchPanel(false); }}
              style={{ background: "#1a5276", color: "#fff", border: "none", borderRadius: 7, padding: "7px 16px", cursor: "pointer", fontSize: 11, fontWeight: 600, flex: 1 }}>
              📋 Ver na tabela
            </button>}
            <button onClick={() => setShowWatchPanel(false)}
              style={{ background: "var(--card2)", color: "var(--text2)", border: "1px solid var(--border)", borderRadius: 7, padding: "7px 16px", cursor: "pointer", fontSize: 11, fontWeight: 600 }}>
              Fechar
            </button>
          </div>
        </div>
      )}

      {selComp && <div style={{ position: "fixed", inset: 0, background: "#0007", display: "flex", alignItems: "center", justifyContent: "center", zIndex: 900 }} onClick={() => setSelComp(null)}>
        <div style={{ background: "var(--card)", borderRadius: 12, width: "min(860px,95vw)", maxHeight: "85vh", display: "flex", flexDirection: "column", boxShadow: "0 8px 40px #0004" }} onClick={e => e.stopPropagation()}>
          <div style={{ padding: "16px 22px", background: selComp.tipo === "cpl" ? "#6c3483" : "#1a5276", color: "#fff", borderRadius: "12px 12px 0 0", display: "flex", justifyContent: "space-between", alignItems: "center" }}>
            <div><div style={{ fontWeight: 700, fontSize: 15 }}>{selComp.nome}</div>
              <div style={{ fontSize: 10, opacity: .8 }}>{procComp.length} processo(s) · {selComp.tipo === "cpl" ? "CPL" : "NCL"}</div></div>
            <button onClick={() => setSelComp(null)} style={{ background: "none", border: "none", color: "#fff", fontSize: 22, cursor: "pointer" }}>×</button>
          </div>
          <div style={{ overflow: "auto", padding: "14px 22px", flex: 1 }}>
            {procComp.length === 0 ? <div style={{ color: "var(--text3)", textAlign: "center", padding: 20 }}>Nenhum processo.</div>
              : procComp.map((r, i) => {
                const tags = TagsManager.getForProcess(r.ProcessKey, r.TicketSD);
                return (
                  <div key={i} style={{ borderBottom: "1px solid var(--border2)", padding: "9px 0", cursor: "pointer" }} onClick={() => setSelProc(r)}>
                    <div style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-start", gap: 6 }}>
                      <div style={{ flex: 1 }}>
                        <div style={{ display: "flex", gap: 5, flexWrap: "wrap", alignItems: "center", marginBottom: 2 }}>
                          <span style={{ fontSize: 9, color: "var(--text3)", background: "var(--card2)", borderRadius: 3, padding: "0 4px" }}>{r.ProcessKey || "—"}</span>
                          <span style={{ fontWeight: 700, fontSize: 12, color: "#2e86c1" }}>{r.NumRC || "—"}</span>
                          {r.TicketSD && <span style={{ fontSize: 10, color: "#27ae60" }}>Pré-compra: {r.TicketSD}</span>}
                          <span style={{ fontSize: 10, color: "#2e86c1" }}>{r.Modalidade || "—"}</span>
                          {r.criticoNclGestao && <span style={{ fontSize: 10, color: "#c0392b", fontWeight: 700 }}>NCL crit.</span>}
                          {r.criticoCpl && <span style={{ fontSize: 10, color: "#8e44ad", fontWeight: 700 }}>CPL crit.</span>}
                          {tags.map(t => <TagBadge key={t} tag={t} small />)}
                        </div>
                        <div style={{ fontSize: 11, color: "var(--text)", overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap", maxWidth: 480 }}>{(r.Objeto || "").slice(0, 120) || "—"}</div>
                        <div style={{ fontSize: 10, color: "var(--text3)", marginTop: 2 }}>Status: <b>{r.status}</b>{r.statusDet ? <span style={{ fontSize: 10, background: "#f0ebfa33", borderRadius: 4, padding: "0 5px", color: "#8e44ad", fontWeight: 600, marginLeft: 5 }}>{r.statusDet}</span> : ""} | Abertura: {r.dataAbertura ? r.dataAbertura.toLocaleDateString("pt-BR") : "—"}{r.aberturaSD ? "" : " (RC)"}</div>
                      </div>
                      <div style={{ textAlign: "right", flexShrink: 0, minWidth: 75 }}>
                        {r.diasTotaisGestao > 0 && <div style={{ fontSize: 11, fontWeight: 700, color: r.criticoNclGestao ? "#c0392b" : "#e67e22" }}>{r.diasTotaisGestao} d.u. RC</div>}
                        {r.diasCpl > 0 && <div style={{ fontSize: 11, fontWeight: 700, color: r.criticoCpl ? "#8e44ad" : "#a569bd" }}>{r.diasCpl} d.u. CPL</div>}
                        <div style={{ fontSize: 9, color: "var(--text3)", marginTop: 3 }}>timeline →</div>
                      </div>
                    </div>
                  </div>
                );
              })}
          </div>
        </div>
      </div>}

        {/* ------------ ABA: GESTAO / PERFORMANCE ------------ */}
        {aba === "gestao" && !loginUser && <div className="anim-fade">
          {!gestaoUnlocked ? (
            <div style={{ maxWidth: 400, margin: "80px auto", background: "var(--card)", borderRadius: 16, padding: 36, boxShadow: "var(--shadow)", textAlign: "center" }}>
              <div style={{ fontSize: 32, marginBottom: 12 }}>📊</div>
              <div style={{ fontSize: 18, fontWeight: 800, color: "var(--text)", marginBottom: 6 }}>Painel de Gestão</div>
              <div style={{ fontSize: 12, color: "var(--text3)", marginBottom: 24 }}>Acesso restrito. Digite a senha do painel de gestão.</div>
              <input type="password" placeholder="Senha do painel" value={gestaoPassInput} onChange={e => { setGestaoPassInput(e.target.value); setGestaoPassErr(false); }}
                onKeyDown={async e => { if (e.key === "Enter") { const h = await gaqHashSenha(gestaoPassInput); if (typeof GESTAO_PASS !== "undefined" && h === GESTAO_PASS) { setGestaoUnlocked(true); setGestaoPassInput(""); } else setGestaoPassErr(true); }}}

                                      <td style={{ padding: "8px 10px" }}>
                                        <div style={{ display: "flex", alignItems: "center", gap: 6 }}>
                                          <div style={{ height: 8, width: 70, background: "var(--border2)", borderRadius: 4, overflow: "hidden" }}>
                                            <div style={{ height: "100%", width: r.delayProb + "%", background: probColor, borderRadius: 4 }} />
                                          </div>
                                          <span style={{ fontSize: 12, fontWeight: 800, color: probColor, whiteSpace: "nowrap" }}>{r.delayProb}%</span>
                                        </div>
                                      </td>
                                    </tr>
                                  );
                                })}
                              </tbody>
                            </table>
                          </div>
                      }
                    </div>

                    {/* 3 — SCORE DE COMPLEXIDADE */}
                    <div style={{ background: "var(--card)", borderRadius: 12, padding: 18, boxShadow: "var(--shadow)", marginBottom: 20 }}>
                      <div style={{ fontWeight: 700, fontSize: 13, color: "var(--text)", marginBottom: 4 }}>🧩 Score de Complexidade — Processos em Andamento</div>
                      <div style={{ fontSize: 11, color: "var(--text3)", marginBottom: 14 }}>
                        Score 1–10 baseado em: modalidade · risco histórico de C/F · tamanho do objeto · presença de CPL · top 15 por complexidade
                      </div>
                      <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fill, minmax(280px, 1fr))", gap: 10 }}>
                        {complexAtivos.map((r,i) => {
                          const cxColor = r.complexidade >= 8 ? "#8e44ad" : r.complexidade >= 6 ? "#2e86c1" : r.complexidade >= 4 ? "#27ae60" : "#7f8c8d";
                          const probColor = (r.delayProb||0) >= 75 ? "#c0392b" : (r.delayProb||0) >= 55 ? "#e67e22" : "#27ae60";
                          return (
                            <div key={i} onClick={() => setSelProc(r)} style={{ background: "var(--card2)", borderRadius: 10, padding: "12px 14px", cursor: "pointer", borderLeft: "4px solid " + cxColor, transition: "transform .15s" }}
                              onMouseEnter={e => e.currentTarget.style.transform="translateY(-2px)"}
                              onMouseLeave={e => e.currentTarget.style.transform="none"}>
                              <div style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-start", marginBottom: 6 }}>
                                <div>
                                  <div style={{ fontWeight: 700, color: "#2e86c1", fontSize: 12 }}>{r.NumRC || r.TicketSD || "—"}</div>
                                  <div style={{ fontSize: 10, color: "var(--text3)" }}>{r["Área Requisitante"] || "—"} · {r.Modalidade || "—"}</div>
                                </div>
                                <div style={{ textAlign: "right" }}>
                                  <div style={{ fontSize: 18, fontWeight: 800, color: cxColor }}>{r.complexidade}<span style={{ fontSize: 10, color: "var(--text3)" }}>/10</span></div>
                                  <div style={{ fontSize: 9, color: "var(--text3)", textTransform: "uppercase" }}>complexidade</div>
                                </div>
                              </div>
                              <div style={{ fontSize: 10, color: "var(--text2)", overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap", marginBottom: 8 }}>{(r.Objeto||"").slice(0,70)||"—"}</div>
                              <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", gap: 8 }}>
                                <div>
                                  <div style={{ fontSize: 9, color: "var(--text3)", marginBottom: 2 }}>Complexidade</div>
                                  <div style={{ height: 5, width: 80, background: "var(--border)", borderRadius: 3, overflow: "hidden" }}>
                                    <div style={{ height: "100%", width: (r.complexidade*10)+"%", background: cxColor, borderRadius: 3 }} />
                                  </div>
                                </div>
                                {r.delayProb !== null && (
                                  <div style={{ textAlign: "right" }}>
                                    <div style={{ fontSize: 9, color: "var(--text3)", marginBottom: 2 }}>Risco atraso</div>
                                    <span style={{ fontSize: 11, fontWeight: 800, color: probColor }}>{r.delayProb}%</span>
                                  </div>
                                )}
                                <span style={{ fontSize: 10, fontWeight: 700, color: r.diasTotais > 50 ? "#c0392b" : "#27ae60" }}>{r.diasTotais} d.u.</span>
                              </div>
                            </div>
                          );
                        })}
                      </div>
                    </div>

                  </div>
                );
              })()}

            </div>
          )}
        </div>}

        {/* ════════════ ABA: LINHA DE METRO ════════════ */}
        {aba === "metro" && <div className="anim-fade" style={{ minHeight: "max-content", overflow: "visible", paddingBottom: 40 }}>
          {base.length === 0 ? (
            <div style={{ textAlign: "center", padding: 60, color: "var(--text3)" }}>
              <div style={{ fontSize: 38 }}>🚇</div>
              <div style={{ fontWeight: 600, marginTop: 8 }}>Carregue a base para acessar a Linha de Metro.</div>
              <button onClick={() => setAba("upload")} style={{ marginTop: 12, background: "#1a5276", color: "#fff", border: "none", borderRadius: 8, padding: "9px 22px", cursor: "pointer", fontSize: 13 }}>Upload</button>
            </div>
          ) : (() => {
            const stColor = r => r.emA ? "#1e8449" : r.isConcluded ? "#2e86c1" : r.isCanceled ? "#e67e22" : r.isFailed ? "#c0392b" : r.isSuspended ? "#7f8c8d" : "#95a5a6";
            const getResp = r => (r.respAtivo && r.respAtivo !== "N/A") ? r.respAtivo : (r.respNCL || "Sem responsável");
            const compList = [...new Set(fBase.map(getResp).filter(Boolean))].sort();
            const metroBuscaNrm = nrm(metroBusca);
            const filteredMetro = fBase.filter(r => {
              if (metroComp && getResp(r) !== metroComp) return false;
              if (metroBuscaNrm.length >= 2 &&
                  !nrm(r.Objeto || "").includes(metroBuscaNrm) &&
                  !nrm(r.TicketSD || "").includes(metroBuscaNrm) &&
                  !nrm(r.NumRC || "").includes(metroBuscaNrm) &&
                  !nrm(r.NumPedidoSuite || "").includes(metroBuscaNrm) &&
                  !nrm(r.NumProcesso || "").includes(metroBuscaNrm)) return false;
              return true;
            });
            const METRO_COLORS = ["#1565c0","#1e8449","#8e44ad","#c0392b","#e67e22","#16a085","#b7950b","#2c3e50","#117a65","#6c3483"];

            // Paginação — aplicada ANTES de montar os grupos
            const metroTotal = filteredMetro.length;
            const metroPage = Math.min(pgMetro, Math.ceil(metroTotal / pgMetroSz) || 1);
            const metroSlice = filteredMetro.slice((metroPage - 1) * pgMetroSz, metroPage * pgMetroSz);
            const forwardMetroWheel = (e) => {
              if (Math.abs(e.deltaY) <= Math.abs(e.deltaX)) return;
              const scroller = e.currentTarget.closest("[data-metro-scroll='true']");
              if (!scroller) return;
              scroller.scrollTop += e.deltaY;
              e.preventDefault();
            };

            const renderStation = (r, i, total, lineColor) => {
              const sc = stColor(r);
              const resp = getResp(r);
              const cron = buildCronograma(r, phaseIntervals);

              // Mini SLA track — versão aprimorada para gestores
              const SHORT_LBL = {
                "Abertura SD": "Aber. pré-compra", "Distribuição SD": "Dist. pré-compra",
                "Encerramento SD": "Enc. pré-compra", "Recebimento RC": "Receb. RC",
                "Planejamento RC": "Plan. RC", "Início propostas": "Prop. Iníc.",
                "Fim propostas": "Prop. Fim", "Envio aprovação": "Env. Apr.",
                "Última aprovação": "Últ. Apr.", "Envio Pedido/Suite": "Env. Pedido",
                "CPL: Recebido do NCL": "CPL NCL",
                "CPL: Enviado p/ DJS": "CPL DJS",
                "CPL: Recebimento": "CPL Receb.", "CPL: Publicação": "CPL Pub.",
                "CPL: Abertura Disputa": "CPL Disp.", "CPL: Fase ext.": "CPL F.Ext.",
                "CPL: Homologação": "CPL Homol.", "Indicação Analista de Contrato": "Ind. Analista",
                "Recebimento DJ": "Receb. DJ",
              };

              const miniTrack = cron ? (() => {
                const rows = cron.rows;
                const nOk   = rows.filter(x => x.status === "No prazo").length;
                const nLate = rows.filter(x => x.status === "Atrasado").length;
                const nLogged = rows.filter(x => x.status === "Registrado").length;
                const nPend = rows.filter(x => x.status === "Pendente").length;
                const nDone = rows.filter(x => x._ok).length;

                // current stage = first Pendente after last completed
                let currentIdx = -1;
                for (let ci = rows.length - 1; ci >= 0; ci--) {
                  if (rows[ci]._ok) { currentIdx = ci + 1; break; }
                }
                if (currentIdx < 0 && rows.some(x => x.status === "Pendente")) currentIdx = 0;

                // SLA bar: percent of total SLA dias used
                const pct = Math.min(100, Math.round(((r.diasTotais || r.diasTotaisCronograma) / cron.metaTotal) * 100));
                const barColor = pct > 120 ? "#c0392b" : pct > 80 ? "#e67e22" : "#1e8449";

                // Determine step icon + colors
                const stepInfo = rows.map((row, ri) => {
                  const isCurrent = ri === currentIdx && r.emA;
                  let bg, border, icon, textColor;
                  if (row._ok) {
                    bg = row.status === "Atrasado" ? "#c0392b" : row.status === "Registrado" ? "#8e44ad" : "#1e8449";
                    border = bg;
                    icon = row.status === "Atrasado" ? "!" : row.status === "Registrado" ? "R" : "✓";
                    textColor = "#fff";
                  } else if (isCurrent) {
                    bg = "#fff7ed";
                    border = "#e67e22";
                    icon = String(ri + 1);
                    textColor = "#e67e22";
                  } else {
                    bg = "var(--card2)";
                    border = "var(--border)";
                    icon = String(ri + 1);
                    textColor = "var(--text3)";
                  }
                  return { ...row, isCurrent, bg, border, icon, textColor };
                });

                return (
                  <div style={{ marginBottom: 10 }}>
                    {/* SLA progress bar */}
                    <div style={{ display: "flex", alignItems: "center", gap: 8, marginBottom: 10 }}>
                      <div style={{ fontSize: 9, color: "var(--text3)", fontWeight: 700, whiteSpace: "nowrap" }}>SLA {cron.metaTotal} d.u.</div>
                      <div style={{ flex: 1, height: 6, background: "var(--border2)", borderRadius: 4, overflow: "hidden" }}>
                        <div style={{ height: "100%", width: pct + "%", background: barColor, borderRadius: 4, transition: "width .3s" }} />
                      </div>
                      <div style={{ fontSize: 9, fontWeight: 800, color: barColor, whiteSpace: "nowrap" }}>{r.diasTotaisCronograma} / {cron.metaTotal} d.u. ({pct}%)</div>
                    </div>

                    {/* Steps track — scrollable horizontally */}
                    <div onWheel={forwardMetroWheel} style={{ overflowX: "auto", overflowY: "hidden", overscrollBehaviorX: "contain", paddingBottom: 4 }}>
                      <div style={{ display: "flex", alignItems: "flex-start", gap: 0, minWidth: "max-content" }}>
                        {stepInfo.map((step, ri) => (
                          <React.Fragment key={ri}>
                            {/* Connector line */}
                            {ri > 0 && (
                              <div style={{
                                width: 18, height: 3, marginTop: 18, flexShrink: 0,
                                background: (stepInfo[ri-1]._ok && step._ok)
                                  ? (stepInfo[ri-1].status === "Atrasado" || step.status === "Atrasado" ? "#c0392b" : stepInfo[ri-1].status === "Registrado" || step.status === "Registrado" ? "#8e44ad" : "#1e8449")
                                  : step.isCurrent ? "#e67e2255" : "var(--border2)"
                              }} />
                            )}
                            {/* Step column */}
                            <div style={{ display: "flex", flexDirection: "column", alignItems: "center", width: 42 }}
                              title={`${step.etapa}\nResponsável: ${step.responsavel}\nPlanejado: ${step.planejada}\nReal: ${step.real}\nStatus: ${step.status}${step.variacao !== "—" ? "\nVariação: " + step.variacao : ""}`}>
                              {/* Circle */}
                              <div style={{
                                width: 38, height: 38, borderRadius: "50%",
                                background: step.bg, border: `2.5px solid ${step.border}`,
                                display: "flex", alignItems: "center", justifyContent: "center",
                                fontSize: step._ok ? 14 : 11, fontWeight: 800, color: step.textColor,
                                flexShrink: 0,
                                boxShadow: step.isCurrent ? `0 0 0 3px #e67e2233, 0 2px 8px #e67e2244` : step._ok ? `0 1px 4px ${step.bg}55` : "none",
                                transition: "box-shadow .2s"
                              }}>
                                {step.icon}
                              </div>
                              {/* Label */}
                              <div style={{
                                fontSize: 8, fontWeight: step.isCurrent ? 800 : 500,
                                color: step.isCurrent ? "#e67e22" : step._ok ? (step.status === "Atrasado" ? "#c0392b" : step.status === "Registrado" ? "#8e44ad" : "#1e8449") : "var(--text3)",
                                textAlign: "center", marginTop: 4, lineHeight: 1.2,
                                maxWidth: 42, wordBreak: "break-word"
                              }}>
                                {SHORT_LBL[step.etapa] || step.etapa}
                              </div>
                              {/* Variação badge (só se atrasado ou no prazo) */}
                              {step._ok && step.variacao !== "—" && (
                                <div style={{ fontSize: 7, fontWeight: 700, color: step.variacao.startsWith("+") ? "#c0392b" : "#1e8449", marginTop: 2 }}>
                                  {step.variacao}
                                </div>
                              )}
                              {/* "Atual" badge */}
                              {step.isCurrent && (
                                <div style={{ fontSize: 7, fontWeight: 800, color: "#e67e22", marginTop: 2, background: "#fff7ed", borderRadius: 3, padding: "1px 4px", border: "1px solid #e67e2244" }}>
                                  ATUAL
                                </div>
                              )}
                            </div>
                          </React.Fragment>
                        ))}
                      </div>
                    </div>

                    {/* Summary row */}
                    <div style={{ display: "flex", gap: 10, flexWrap: "wrap", marginTop: 8, paddingTop: 6, borderTop: "1px solid var(--border2)", alignItems: "center" }}>
                      <span style={{ fontSize: 10, color: "var(--text3)" }}>{nDone}/{rows.length} etapas</span>
                      {nOk   > 0 && <span style={{ background: "#eafaf1", color: "#1e8449", border: "1px solid #a9dfbf", borderRadius: 5, padding: "2px 8px", fontSize: 10, fontWeight: 700 }}>✓ {nOk} no prazo</span>}
                      {nLate > 0 && <span style={{ background: "#fdf0f0", color: "#c0392b", border: "1px solid #f1948a", borderRadius: 5, padding: "2px 8px", fontSize: 10, fontWeight: 700 }}>⚠ {nLate} atrasada{nLate > 1 ? "s" : ""}</span>}
                      {nLogged > 0 && <span style={{ background: "#f5eef8", color: "#8e44ad", border: "1px solid #d2b4de", borderRadius: 5, padding: "2px 8px", fontSize: 10, fontWeight: 700 }}>~ {nLogged} sem SLA</span>}
                      {nPend > 0 && <span style={{ background: "var(--card2)", color: "var(--text3)", border: "1px solid var(--border)", borderRadius: 5, padding: "2px 8px", fontSize: 10 }}>○ {nPend} pendente{nPend > 1 ? "s" : ""}</span>}
                      {currentIdx >= 0 && currentIdx < rows.length && r.emA && (
                        <span style={{ marginLeft: "auto", fontSize: 10, color: "#e67e22", fontWeight: 700 }}>▶ {SHORT_LBL[rows[currentIdx]?.etapa] || rows[currentIdx]?.etapa}</span>
                      )}
                    </div>
                  </div>
                );
              })() : null;

              return (
                <div key={r.ProcessKey + i} style={{ display: "flex", alignItems: "stretch", minHeight: 0 }}>
                  {/* Trilho esquerdo */}
                  <div style={{ display: "flex", flexDirection: "column", alignItems: "center", width: 36, flexShrink: 0, marginRight: 14 }}>
                    <div style={{ width: 3, flex: i === 0 ? "0 0 16px" : "1 1 16px", background: lineColor, opacity: i === 0 ? 0 : 0.35 }} />
                    <div style={{ width: 22, height: 22, borderRadius: "50%", background: sc, border: "3px solid var(--card)", boxShadow: `0 0 0 2.5px ${sc}55`, flexShrink: 0, zIndex: 1 }} />
                    <div style={{ width: 3, flex: "1 1 16px", background: lineColor, opacity: i === total - 1 ? 0 : 0.35 }} />
                  </div>
                  {/* Card */}
                  <div style={{ flex: 1, marginBottom: 10, marginTop: 2 }}>
                    <div className="gaq-card" style={{ padding: "14px 18px", borderRadius: 16, borderLeft: `3px solid ${sc}`, cursor: "pointer" }}
                      onClick={() => setSelProc(r)}>
                      <div style={{ display: "flex", gap: 8, alignItems: "center", marginBottom: 6, flexWrap: "wrap" }}>
                        <span style={{ fontWeight: 600, color: "var(--gaq-text)", fontSize: 13 }}>{r.TicketSD || r.NumRC || "—"}</span>
                        <span className="gaq-meta">{r["Área Requisitante"] || "—"}</span>
                        <span style={{ fontSize: 12, fontWeight: 600, color: sc }}>{resp}</span>
                      </div>
                      <div style={{ fontSize: 12, color: "var(--gaq-text-2)", lineHeight: 1.5, marginBottom: 10 }}>{(r.Objeto || "Sem descricao").slice(0, 220)}{(r.Objeto || "").length > 220 ? "..." : ""}</div>
                      {miniTrack}
                      <div style={{ display: "flex", gap: 5, flexWrap: "wrap", alignItems: "center", borderTop: miniTrack ? "1px solid var(--border2)" : "none", paddingTop: miniTrack ? 8 : 0 }}>
                        {r.Modalidade && <span style={{ background: "#1565c015", color: "#1565c0", borderRadius: 6, padding: "2px 8px", fontSize: 10, fontWeight: 700 }}>{r.Modalidade}</span>}
                        <span style={{ background: sc + "20", color: sc, borderRadius: 6, padding: "2px 8px", fontSize: 10, fontWeight: 700 }}>{r.status || "—"}</span>
                        {r.faseAtual && r.faseAtual !== "—" && <span style={{ background: "var(--card2)", color: "var(--text2)", borderRadius: 6, padding: "2px 8px", fontSize: 10 }}>{r.faseAtual}</span>}
                        {r.diasParado > 10 && <span style={{ background: "#c0392b15", color: "#c0392b", borderRadius: 6, padding: "2px 8px", fontSize: 10, fontWeight: 700 }}>{r.diasParado} d.u. sem movimento</span>}
                        {r.diasTotais > 0 && <span style={{ marginLeft: "auto", fontWeight: 800, fontSize: 12, color: r.diasTotais > 100 ? "#c0392b" : r.diasTotais > 50 ? "#e67e22" : "#27ae60" }}>{r.diasTotais} d.u.</span>}
                      </div>
                    </div>
                  </div>
                </div>
              );
            };

            const groups = metroAgrupado
              ? compList
                  .map((c, gi) => ({ name: c, color: METRO_COLORS[gi % METRO_COLORS.length], items: metroSlice.filter(r => getResp(r) === c) }))
                  .filter(g => g.items.length > 0)
              : [{ name: null, color: "#1565c0", items: metroSlice }];

            return (
              <div style={{ minHeight: "max-content", paddingLeft: 20, paddingRight: 10 }}>
                {/* Cabecalho */}
                <div style={{ marginBottom: 18 }}>
                  <div className="gaq-h1" style={{ marginBottom: 4 }}>Linha do Metro</div>
                  <div className="gaq-body" style={{ color: "var(--gaq-text-3)" }}>Trilha visual de cada processo pelas estacoes da jornada de compra · {metroTotal.toLocaleString("pt-BR")} processos</div>
                </div>

                <div className="gaq-card" style={{ padding: "14px 20px", marginBottom: 18, display: "flex", gap: 10, alignItems: "center", flexWrap: "wrap" }}>
                  <input type="text" value={metroBusca} onChange={e => { setMetroBusca(e.target.value); setPgMetro(1); }}
                    placeholder="Buscar pré-compra, RC, Suite, Processo, Objeto..."
                    style={{ padding: "8px 14px", borderRadius: 10, border: "1px solid var(--gaq-line)", background: "var(--gaq-surface)", color: "var(--gaq-text)", fontSize: 12, width: 260, outline: "none" }} />
                  <select value={metroComp} onChange={e => { setMetroComp(e.target.value); setPgMetro(1); }}
                    style={{ padding: "8px 12px", borderRadius: 10, border: "1px solid var(--gaq-line)", background: "var(--gaq-surface)", color: "var(--gaq-text)", fontSize: 12, cursor: "pointer" }}>
                    <option value="">Todos os responsaveis</option>
                    {compList.map(c => <option key={c} value={c}>{c}</option>)}
                  </select>
                  <button onClick={() => { setMetroAgrupado(v => !v); setPgMetro(1); }} className="gaq-btn"
                    style={{ fontSize: 12 }}>
                    {metroAgrupado ? "Agrupado" : "Agrupar por responsavel"}
                  </button>
                  <select value={pgMetroSz} onChange={e => { setPgMetroSz(+e.target.value); setPgMetro(1); }}
                    style={{ padding: "8px 12px", borderRadius: 10, border: "1px solid var(--gaq-line)", background: "var(--gaq-surface)", color: "var(--gaq-text)", fontSize: 12, cursor: "pointer" }}>
                    {[50, 100].map(n => <option key={n} value={n}>{n} / pag</option>)}
                  </select>
                </div>

                <div style={{ paddingRight: 6, paddingBottom: 28 }}>
                  {filteredMetro.length === 0 ? (
                    <div style={{ textAlign: "center", padding: 60, color: "var(--text3)" }}>
                      <div style={{ fontSize: 32 }}>🚉</div>
                      <div style={{ marginTop: 8 }}>Nenhum processo encontrado com os filtros atuais.</div>
                    </div>
                  ) : (
                    <div>
                      <div style={{ display: "flex", flexDirection: "column", gap: 28 }}>
                        {groups.map((group, gi) => (
                          <div key={group.name || "all"}>
                            {group.name && (
                              <div style={{ display: "flex", alignItems: "center", gap: 10, marginBottom: 14 }}>
                                <div style={{ width: 13, height: 13, borderRadius: "50%", background: group.color, flexShrink: 0 }} />
                                <div style={{ fontWeight: 800, fontSize: 15, color: "var(--text)" }}>{group.name}</div>
                                <div style={{ height: 2, flex: 1, background: group.color, opacity: .22, borderRadius: 2 }} />
                                <span style={{ background: group.color + "22", color: group.color, borderRadius: 10, padding: "2px 10px", fontSize: 11, fontWeight: 700 }}>{group.items.length}</span>
                              </div>
                            )}
                            <div style={{ paddingLeft: group.name ? 6 : 0 }}>
                              {group.items.map((r, i) => renderStation(r, i, group.items.length, group.color))}
                            </div>
                          </div>
                        ))}
                      </div>
                      {/* Paginação */}
                      {metroTotal > pgMetroSz && (
                        <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", padding: "12px 4px", flexWrap: "wrap", gap: 8, borderTop: "1px solid var(--border2)", marginTop: 8 }}>
                          <div style={{ fontSize: 12, color: "var(--text3)" }}>
                            {((metroPage-1)*pgMetroSz)+1}–{Math.min(metroPage*pgMetroSz, metroTotal)} de {metroTotal.toLocaleString("pt-BR")}
                          </div>
                          <div style={{ display: "flex", gap: 4, alignItems: "center" }}>
                            <select value={pgMetroSz} onChange={e => { setPgMetroSz(+e.target.value); setPgMetro(1); }}
                              style={{ padding: "4px 8px", borderRadius: 6, border: "1px solid var(--input-bd)", fontSize: 12, background: "var(--input-bg)", color: "var(--text)" }}>
                              {[50, 100].map(n => <option key={n} value={n}>{n}/pág</option>)}
                            </select>
                            <button disabled={metroPage <= 1} onClick={() => setPgMetro(p => p - 1)}
                              style={{ padding: "4px 10px", borderRadius: 5, border: "1px solid var(--border)", background: "var(--card)", color: "var(--text)", cursor: metroPage <= 1 ? "default" : "pointer", fontSize: 12, fontWeight: 600, opacity: metroPage <= 1 ? .4 : 1 }}>◀</button>
                            <span style={{ fontSize: 12, fontWeight: 700, color: "var(--text2)", minWidth: 70, textAlign: "center" }}>
                              {metroPage} / {Math.ceil(metroTotal / pgMetroSz)}
                            </span>

        {/* ════════════ ABA: PANTANAL ════════════ */}

        {/* ════════════ ABA: PLANEJAMENTO DE COMPRA ════════════ */}
        {aba === "planejamento" && !loginUser && !loginArea && <div className="anim-fade" style={{ paddingBottom: 16 }}>

            /* ── Design system: clean, light and Apple-like ── */
            const PL = {

              line:    "#e5e7eb",

              accentL: "#e8f2ff",

              greenL:  "#def7e8",

              amberL:  "#fff3d6",

              redL:    "#ffede5",
              mono:    "'SF Mono','Fira Mono','Consolas',monospace",
            };
            const MESES = ["Jan","Fev","Mar","Abr","Mai","Jun","Jul","Ago","Set","Out","Nov","Dez"];

            const hoje = new Date(); hoje.setHours(0,0,0,0);
            const anoAtual = hoje.getFullYear();
            const anoBase = anoAtual - 1;

            const concAno = base.filter(r => r.isConcluded && ((r.anoRC === anoBase) || (!r.anoRC && r.anoSD === anoBase)));
            const totalConc = concAno.length;

            const mesesCount = Array(12).fill(0);
            concAno.forEach(r => { if (r.mesAbertura !== null && r.mesAbertura !== undefined) mesesCount[r.mesAbertura]++; });
            const maxMes = Math.max(...mesesCount, 1);
            const avgMes = totalConc / 12;
            const peakMesIdx = mesesCount.indexOf(maxMes);

            const areaMap = {};
            concAno.forEach(r => {
              const a = r["Área Requisitante"] || "N/I";
              if (!areaMap[a]) areaMap[a] = { total: 0, leads: [], meses: Array(12).fill(0) };
              areaMap[a].total++;
              if (r.diasTotais > 0) areaMap[a].leads.push(r.diasTotais);
              if (r.mesAbertura !== null) areaMap[a].meses[r.mesAbertura]++;
            });
            const topAreas = Object.entries(areaMap)
              .sort((a, b) => b[1].total - a[1].total).slice(0, 10)
              .map(([area, d]) => ({
                area, total: d.total,
                avgLead: d.leads.length ? Math.round(d.leads.reduce((s,v) => s+v, 0) / d.leads.length) : 0,
                peakMes: d.meses.indexOf(Math.max(...d.meses)),
                projecao: Math.round(d.total * 1.05),
              }));

            const modMap = {};
            concAno.forEach(r => {
              const m = r.Modalidade || "N/I";
              if (!modMap[m]) modMap[m] = { total: 0, leads: [] };
              modMap[m].total++;
              if (r.diasTotais > 0) modMap[m].leads.push(r.diasTotais);
            });
            const topMods = Object.entries(modMap)
              .sort((a, b) => b[1].total - a[1].total).slice(0, 7)
              .map(([m, d]) => ({
                mod: m, total: d.total,
                avg: d.leads.length ? Math.round(d.leads.reduce((s,x) => s+x, 0) / d.leads.length) : 0,
                min: d.leads.length ? Math.min(...d.leads) : 0,
                max: d.leads.length ? Math.max(...d.leads) : 0,
              }));
            const avgLeadGeral = topMods.reduce((s,m) => s + m.avg * m.total, 0) / (topMods.reduce((s,m) => s + m.total, 0) || 1) | 0;
            const recorrentes = fBack.filter(r => r.emA && !r.aberturaRC);
            const maxBarMod = Math.max(...topMods.map(m => m.max), 1);

            return (
              <div style={{ background: PL.bg, minHeight: 600, borderRadius: 32, overflow: "hidden", boxShadow: "0 24px 60px rgba(15,23,42,0.08)", border: "1px solid rgba(15,23,42,0.06)", fontFamily: "-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', sans-serif" }}>

                {/* ── HERO: soft gradient + clean glass stats ── */}
                <div style={{ background: "linear-gradient(135deg, #09111f 0%, #153d6f 52%, #0a84ff 100%)", position: "relative", overflow: "hidden", padding: "42px 42px 34px" }}>
                  <div style={{ position: "absolute", inset: 0, backgroundImage: "radial-gradient(circle, rgba(255,255,255,0.08) 1px, transparent 1px)", backgroundSize: "30px 30px", pointerEvents: "none" }} />
                  <div style={{ position: "absolute", right: -60, top: "50%", transform: "translateY(-50%)", width: 520, height: 520, background: "radial-gradient(ellipse at center, rgba(10,132,255,0.28) 0%, transparent 68%)", pointerEvents: "none" }} />
                  <div style={{ position: "relative", zIndex: 1 }}>
                    <div style={{ fontSize: 10, color: "rgba(255,255,255,.52)", letterSpacing: 4, textTransform: "uppercase", marginBottom: 18, fontWeight: 600 }}>Sesc GAQ — Inteligência de Compras</div>
                    <div style={{ display: "flex", alignItems: "flex-end", justifyContent: "space-between", flexWrap: "wrap", gap: 20 }}>
                      <div>
                        <div style={{ fontSize: 52, fontWeight: 900, color: "#fff", lineHeight: 1, letterSpacing: -2, marginBottom: 10 }}>

                      </div>
                      <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 10, minWidth: 300 }}>

                {totalConc === 0 ? (

                  <div style={{ padding: "36px 48px", borderBottom: `1px solid ${PL.line}` }}>
                    <div style={{ display: "flex", justifyContent: "space-between", alignItems: "baseline", marginBottom: 24, flexWrap: "wrap", gap: 8 }}>
                      <div>
                        <div style={{ fontSize: 10, color: PL.ink3, textTransform: "uppercase", letterSpacing: 3, fontWeight: 600, marginBottom: 4 }}>Análise · {anoBase}</div>

                    <div style={{ display: "grid", gridTemplateColumns: "repeat(12, 1fr)", gap: 6 }}>
                      {mesesCount.map((c, i) => {
                        const pct = maxMes > 0 ? (c / maxMes) : 0;
                        const isPeak = c >= maxMes;
                        const isHigh = c > avgMes * 1.2 && !isPeak;
                        const barH = Math.max(6, Math.round(pct * 110));
                        const barBg = isPeak ? PL.ink : isHigh ? "#3d3d3d" : PL.line;

                          </div>

                  </div>

                  {/* ── LEAD TIME POR MODALIDADE: horizontal bars editoriais ── */}

                      <div style={{ fontSize: 24, fontWeight: 800, color: PL.ink, letterSpacing: -1 }}>Lead Time por Modalidade</div>
                    </div>
                    <div style={{ display: "flex", flexDirection: "column", gap: 0 }}>
                      {topMods.map((m, i) => {

                        const maxPct = maxBarMod > 0 ? Math.round((m.max / maxBarMod) * 100) : 0;
                        const risk = m.avg > 60 ? { bg: PL.redL, text: PL.red, label: "Alto" } : m.avg > 30 ? { bg: PL.amberL, text: PL.amber, label: "Médio" } : { bg: PL.greenL, text: PL.green, label: "Baixo" };
                        return (

                            <div style={{ textAlign: "right", fontFamily: PL.mono, fontSize: 13, fontWeight: 800, color: PL.ink }}>

                      <span><span style={{ display: "inline-block", width: 12, height: 4, background: "#d5d0c8", borderRadius: 1, verticalAlign: "middle", marginRight: 5 }} />Máximo histórico</span>

                      </div>
                      {recorrentes.length > 12 && <div style={{ fontSize: 11, color: PL.ink3, marginTop: 12 }}>+ {recorrentes.length - 12} demandas adicionais na aba Processos</div>}
                    </div>
                  )}

                  {/* ── RODAPÉ ── */}
                  <div style={{ padding: "20px 48px", display: "flex", justifyContent: "space-between", flexWrap: "wrap", gap: 8, alignItems: "center" }}>

      {selProc && <TimelineModal proc={selProc} onClose={() => setSelProc(null)} onOpenTags={onOpenTags} onUpdate={refreshTags} phaseIntervals={phaseIntervals} onToggleWatch={toggleWatch} watchVersion={watchVersion} hidePredictions={isDiretor} serviceDeskData={serviceDeskData} />}

      {/* Spotlight Search (Ctrl+K) */}

            {buscaResults.map((r, i) => (
              <div key={i} className="spotlight-item" onClick={() => { setSelProc(r); setSpotlight(false); }}>
                <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center" }}>

                  </div>

                <div style={{ fontSize: 11, color: "var(--text3)", overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap", marginTop: 2 }}>{(r.Objeto || "").slice(0, 100)}</div>

            {busca.length < 3 && <div style={{ padding: 20, textAlign: "center", color: "var(--text3)", fontSize: 12 }}>Digite pelo menos 3 caracteres...</div>}
