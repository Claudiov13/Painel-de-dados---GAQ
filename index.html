                procs: emAF_CPL.filter(r => pd(r[COL_CPL_ENVIADO_DJS_CHANCELA]) && !pd(r["CPL_DATA_RECEBIMENTO_FINAL"])) },
              { label: "CPL: Recebimento",         area: "CPL", color: "#8e44ad", grad: "linear-gradient(90deg, #8e44ad, #c39bd3)",
                procs: emAF_CPL.filter(r => pd(r["CPL_DATA_RECEBIMENTO_FINAL"]) && !pd(r["CPL_PUBLICACAO_AVISO_FINAL"])) },
              { label: "CPL: Publicação",           area: "CPL", color: "#8e44ad", grad: "linear-gradient(90deg, #8e44ad, #c39bd3)",
                procs: emAF_CPL.filter(r => pd(r["CPL_PUBLICACAO_AVISO_FINAL"]) && !pd(r["CPL_ABERTURA_DISPUTA_FINAL"])) },
              { label: "CPL: Abertura Disputa",    area: "CPL", color: "#8e44ad", grad: "linear-gradient(90deg, #8e44ad, #c39bd3)",
                procs: emAF_CPL.filter(r => pd(r["CPL_ABERTURA_DISPUTA_FINAL"]) && !pd(r["CPL_FINALIZACAO_FASE_EXTERNA_FINAL"])) },
              { label: "CPL: Fase ext.",            area: "CPL", color: "#8e44ad", grad: "linear-gradient(90deg, #8e44ad, #c39bd3)",
                procs: emAF_CPL.filter(r => pd(r["CPL_FINALIZACAO_FASE_EXTERNA_FINAL"]) && !pd(r["CPL_DATA_HOMOLOGACAO_FINAL"])) },
              { label: "CPL: Homologação",          area: "CPL", color: "#8e44ad", grad: "linear-gradient(90deg, #8e44ad, #c39bd3)",
                procs: emAF_CPL.filter(r => pd(r["CPL_DATA_HOMOLOGACAO_FINAL"]) && !pd(r["DATA DE RECEBIMENTO DA DEMANDA PELA ANALISTA DE CONTRATO"])) },
              // ── Contratos (SCONT / DJ) ──
              { label: "Indicação Analista",       area: "Contratos", color: "#16a085", grad: "linear-gradient(90deg, #16a085, #76d7c4)",
                procs: emAF.filter(r => pd(r["DATA DE RECEBIMENTO DA DEMANDA PELA ANALISTA DE CONTRATO"]) && !pd(r["DATA DE RECEBIMENTO NA DJ (QUANDO APLICÁVEL)"])) },
              { label: "Recebimento DJ",            area: "Contratos", color: "#16a085", grad: "linear-gradient(90deg, #16a085, #76d7c4)",
                procs: emAF.filter(r => pd(r["DATA DE RECEBIMENTO NA DJ (QUANDO APLICÁVEL)"])) },
            ].map(f => ({ ...f, count: f.procs.length }));
            // Totais por grupo (para decidir se mostra o grupo)
            const totalPorGrupo = {};
            fasesExpandidas.forEach(f => { totalPorGrupo[f.area] = (totalPorGrupo[f.area] || 0) + f.count; });
            const maxFase = Math.max(...fasesExpandidas.map(f => f.count), 1);

            return <>
            {/* Funil de Fases Expandido — NCL + CPL + Contratos */}
            <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 14, marginBottom: 16 }}>
              <div className="gaq-card" style={{ padding: 22, borderRadius: 24, position: "relative" }}>
                <div style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-start", marginBottom: 14 }}>
                  <div>
                    <div style={{ fontWeight: 700, fontSize: 15, color: "var(--gaq-text)" }}>Funil de fases</div>
                    <div style={{ fontSize: 11, color: "var(--gaq-text-3)", marginTop: 2 }}>Onde cada processo está parado agora</div>
                  </div>
                  <button onClick={() => setShowFunilInfo(!showFunilInfo)}
                    style={{ background: showFunilInfo ? "#2e86c1" : "var(--border2)", border: "none", borderRadius: "50%", width: 22, height: 22, cursor: "pointer", fontSize: 12, fontWeight: 800, color: showFunilInfo ? "#fff" : "var(--text3)", flexShrink: 0, lineHeight: "22px", textAlign: "center" }}
                    title="Ver legenda das subáreas">?</button>
                </div>
                {showFunilInfo && (
                  <div style={{ background: "var(--bg)", border: "1px solid var(--border2)", borderRadius: 8, padding: 12, marginBottom: 12, fontSize: 10, lineHeight: 1.6, color: "var(--text2)" }}>
                    <div style={{ fontWeight: 700, fontSize: 11, marginBottom: 6, color: "var(--text)" }}>Legenda das subáreas</div>
                    <div style={{ display: "flex", gap: 14, flexWrap: "wrap" }}>
                      <span><span style={{ color: "#2e86c1", fontWeight: 700 }}>■</span> NCL — Núcleo de Compras e Licitações</span>
                      <span><span style={{ color: "#8e44ad", fontWeight: 700 }}>■</span> CPL — Comissão Permanente de Licitação</span>
                      <span><span style={{ color: "#16a085", fontWeight: 700 }}>■</span> Contratos — SCONT / DJ</span>
                    </div>
                    <div style={{ marginTop: 6, fontSize: 9, color: "var(--text3)", fontStyle: "italic" }}>Cada fase mostra quantos processos ativos estão naquela etapa. Clique para ver a lista.</div>
                  </div>
                )}
                {(() => {
                  let lastArea = "";
                  return fasesExpandidas.map((f, i) => {
                    const pct = maxFase > 0 ? Math.round((f.count / maxFase) * 100) : 0;
                    const showHeader = f.area !== lastArea;
                    const grupoTemProcessos = (totalPorGrupo[f.area] || 0) > 0;
                    lastArea = f.area;
                    // Esconder grupo inteiro só se não tem nenhum processo (ex: CPL quando não há pregões)
                    if (!grupoTemProcessos && f.area !== "NCL") return null;
                    return (
                      <React.Fragment key={f.label}>
                        {showHeader && (
                          <div style={{ fontSize: 9, fontWeight: 700, textTransform: "uppercase", letterSpacing: ".06em", color: f.color, marginTop: i > 0 ? 10 : 0, marginBottom: 4, paddingLeft: 148, opacity: .8 }}>
                            {f.area} {f.area !== "NCL" && <span style={{ fontWeight: 400, opacity: .7 }}>({totalPorGrupo[f.area] || 0})</span>}
                          </div>
                        )}
                        <div style={{ display: "flex", alignItems: "center", gap: 8, marginBottom: 4, cursor: f.count > 0 ? "pointer" : "default", borderRadius: 6, padding: "3px 4px", transition: "background .15s", opacity: f.count === 0 ? .45 : 1 }}
                          onMouseEnter={e => { if (f.count > 0) e.currentTarget.style.background = "var(--hover)"; }} onMouseLeave={e => e.currentTarget.style.background = "transparent"}
                          onClick={() => { if (f.count > 0) { setDrillDown({ title: "Fase: " + f.label, data: f.procs, color: f.color, sourceAba: "operacional" }); setAba("overview"); } }}>
                          <div style={{ fontSize: 10, color: "var(--text2)", width: 140, flexShrink: 0, textAlign: "right", lineHeight: 1.2 }}>{f.label}</div>
                          <div style={{ flex: 1, background: "var(--border2)", borderRadius: 4, height: 18, overflow: "hidden" }}>
                            {f.count > 0 && <div style={{ width: Math.max(pct, 3) + "%", height: "100%", background: f.grad, borderRadius: 4, transition: "width .5s" }} />}
                          </div>
                          <div style={{ fontSize: 12, fontWeight: 700, color: f.count > 0 ? f.color : "var(--text3)", width: 32, textAlign: "right" }}>{f.count}</div>
                        </div>
                      </React.Fragment>
                    );
                  });
                })()}
                {emAF.length === 0 && <div style={{ color: "var(--text3)", fontSize: 12, textAlign: "center", padding: 20 }}>Nenhum processo em andamento.</div>}
              </div>

              {/* Estagnados */}
              <div className="gaq-card" style={{ padding: 22, borderRadius: 24, borderTop: "3px solid #e67e22" }}>
                <div style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-start", marginBottom: 10 }}>
                  <div>
                    <div style={{ fontWeight: 700, fontSize: 15, color: "var(--gaq-text)" }}>Estagnados</div>
                    <div style={{ fontSize: 11, color: "var(--gaq-text-3)", marginTop: 2 }}>{emAF.filter(r => r.diasParado > 15).length} processos sem movimentação ha mais de 15 d.u.</div>
                  </div>
                  {emAF.filter(r => r.diasParado > 15).length > 8 && (
                    <button className="gaq-btn" style={{ fontSize: 11 }}
                      onClick={() => { setDrillDown({ title: "Processos estagnados (>15 d.u. sem movimentação)", data: emAF.filter(r => r.diasParado > 15).sort((a,b) => b.diasParado - a.diasParado), color: "#e67e22", sourceAba: "operacional" }); setAba("overview"); }}>
                      Ver todos
                    </button>
                  )}
                </div>
                {(() => {
                  const parados = [...emAF].filter(r => r.diasParado > 15).sort((a,b) => b.diasParado - a.diasParado).slice(0, 8);
                  if (parados.length === 0) return <div style={{ color: "var(--text3)", fontSize: 12, textAlign: "center", padding: 12 }}>Nenhum processo estagnado.</div>;
                  return parados.map(r => (
                    <div key={r.ProcessKey} style={{ display: "flex", alignItems: "center", gap: 8, padding: "5px 0", borderBottom: "1px solid var(--gaq-line)", cursor: "pointer", fontSize: 11 }}
                      onClick={() => setSelProc(r)}>
                      <div style={{ width: 6, height: 6, borderRadius: "50%", background: r.diasParado > 30 ? "#c0392b" : "#e67e22", flexShrink: 0 }} />
                      <div style={{ flex: 1, minWidth: 0, overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap", color: "var(--gaq-text)" }}>{r.NumRC || r.TicketSD || "—"} — {(r.Objeto || "").slice(0, 40)}</div>
                      <div style={{ flexShrink: 0, fontWeight: 700, color: r.diasParado > 30 ? "#c0392b" : "#e67e22" }}>{r.diasParado} d.u.</div>
                      <div style={{ flexShrink: 0, fontSize: 9, color: "var(--gaq-text-3)" }}>{r.faseAtual || "—"}</div>
                    </div>
                  ));
                })()}
              </div>
            </div>

            {/* Status Detalhado + Modalidades */}
            <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 14, marginBottom: 16 }}>
              <div className="gaq-card" style={{ padding: 22, borderRadius: 24 }}>
                <div style={{ fontWeight: 700, fontSize: 15, color: "var(--gaq-text)", marginBottom: 2 }}>Status detalhado</div>
                <div style={{ fontSize: 11, color: "var(--gaq-text-3)", marginBottom: 10 }}>Processos em andamento por status</div>
                {statusDetArr.slice(0, 15).map(([s, cnt]) => (
                  <div key={s} style={{ display: "flex", justifyContent: "space-between", padding: "4px 0", borderBottom: "1px solid var(--gaq-line)", fontSize: 11, gap: 8, alignItems: "center" }}>
                    <span style={{ color: "var(--gaq-text)", flex: 1, wordBreak: "break-word", lineHeight: 1.3 }} title={s}>{s}</span>
                    <span style={{ fontWeight: 700, color: "#2e86c1", flexShrink: 0 }}>{cnt} <span style={{ fontSize: 9, fontWeight: 400, color: "var(--gaq-text-3)" }}>({emAF.length > 0 ? Math.round((cnt/emAF.length)*100) : 0}%)</span></span>
                  </div>
                ))}
              </div>
              <div className="gaq-card" style={{ padding: 22, borderRadius: 24 }}>
                <div style={{ fontWeight: 700, fontSize: 15, color: "var(--gaq-text)", marginBottom: 2 }}>Modalidades activas</div>
                <div style={{ fontSize: 11, color: "var(--gaq-text-3)", marginBottom: 10 }}>Volume e aging por modalidade</div>
                {modArr.slice(0, 10).map(m => (
                  <div key={m.name} style={{ display: "flex", justifyContent: "space-between", padding: "4px 0", borderBottom: "1px solid var(--gaq-line)", fontSize: 11, gap: 6, alignItems: "center", cursor: "pointer" }}
                    onClick={() => {
                      const procs = emAF.filter(r => (r.Modalidade || "N/I") === m.name);
                      setDrillDown({ title: "Modalidade: " + m.name + " — Em Andamento", data: procs, color: "#2e86c1", sourceAba: "operacional" }); setAba("overview");
                    }}>
                    <span style={{ color: "var(--gaq-text)", flex: 1, overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }}>{m.name}</span>
                    <span style={{ display: "flex", gap: 6, alignItems: "center", flexShrink: 0 }}>
                      <span style={{ fontWeight: 700, color: "#2e86c1" }}>{m.total}</span>
                      {m.crit > 0 && <span style={{ fontSize: 9, background: "#c0392b", color: "#fff", borderRadius: 4, padding: "0 5px", fontWeight: 700 }}>{m.crit} crít.</span>}
                      <span style={{ fontSize: 9, color: "var(--gaq-text-3)" }}>~{m.media} d.u.</span>
                    </span>
                  </div>
                ))}
              </div>
            </div>

            {/* Fluxo Mensal — pré-compra e RC */}
            {(() => {
              const MESES = ["Jan","Fev","Mar","Abr","Mai","Jun","Jul","Ago","Set","Out","Nov","Dez"];
              const getYM = (d) => d ? `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}` : null;
              const ymLabel = (ym) => { const [y,m] = ym.split("-"); return MESES[parseInt(m,10)-1] + "/" + y.slice(2); };

              // Coletar todos os meses presentes na base
              const ymSet = new Set();
              fBase.forEach(r => {
                const ym1 = getYM(r.aberturaSD);
                const ym2 = getYM(r.aberturaRC);
                const ym3 = getYM(r.ultimaData);
                if (ym1) ymSet.add(ym1);
                if (ym2) ymSet.add(ym2);
                if (ym3) ymSet.add(ym3);
              });
              const allYM = [...ymSet].sort();
              if (allYM.length < 2) return null;
              // Últimos 12 meses no máximo
              const recentYM = allYM.slice(-12);

              // ── Gráfico SD ──
              // SD: processos que TÊM abertura de SD (todos, mesmo que depois gerem RC)
              const sdBase = fBase.filter(r => r.aberturaSD);
              const sdData = recentYM.map(ym => {
                const abertos = sdBase.filter(r => getYM(r.aberturaSD) === ym).length;
                // Cancelados SD: somenteSD (só tem SD, não virou RC) e está cancelado/fracassado
                const cancelados = sdBase.filter(r => r.somenteSD && (r.isCanceled || r.isFailed) && getYM(r.aberturaSD) === ym).length;
                // Concluídos SD: tem encerramento do SD nesse mês
                const concluidos = sdBase.filter(r => r.encSD && getYM(r.encSD) === ym).length;
                const saldo = abertos - cancelados - concluidos;
                return { mes: ymLabel(ym), Abertos: abertos, Cancelados: cancelados, Concluídos: concluidos, Saldo: saldo };
              });

              // ── Gráfico RC ──
              const rcBase = fBase.filter(r => r.aberturaRC);
              const rcData = recentYM.map(ym => {
                const abertos = rcBase.filter(r => getYM(r.aberturaRC) === ym).length;
                // Cancelados RC: tem RC e está cancelado/fracassado, pela data da RC
                const cancelados = rcBase.filter(r => (r.isCanceled || r.isFailed) && getYM(r.aberturaRC) === ym).length;
                // Concluídos RC: concluído e a última data preenchida cai nesse mês
                const concluidos = rcBase.filter(r => r.isConcluded && r.ultimaData && getYM(r.ultimaData) === ym).length;
                const saldo = abertos - cancelados - concluidos;
                return { mes: ymLabel(ym), Abertos: abertos, Cancelados: cancelados, Concluídos: concluidos, Saldo: saldo };
              });

              return (
                <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 14, marginBottom: 16 }}>
                  <div className="gaq-card" style={{ padding: 22, borderRadius: 24 }}>
                    <div style={{ fontWeight: 700, fontSize: 15, color: "var(--gaq-text)", marginBottom: 2 }}>Fluxo mensal — pré-compra</div>
                    <div style={{ fontSize: 11, color: "var(--gaq-text-3)", marginBottom: 10 }}>Aberturas, cancelamentos e conclusões de pré-compra por mês</div>
                    <Recharts.ResponsiveContainer width="100%" height={220}>
                      <Recharts.ComposedChart data={sdData} margin={{ top: 5, right: 10, left: 0, bottom: 5 }}>
                        <Recharts.CartesianGrid strokeDasharray="3 3" stroke="var(--gaq-line)" />
                        <Recharts.XAxis dataKey="mes" fontSize={9} tick={{ fill: "var(--gaq-text-3)" }} />
                        <Recharts.YAxis fontSize={10} tick={{ fill: "var(--gaq-text-3)" }} />
                        <Recharts.Tooltip formatter={(v, n) => [n === "Saldo" ? (v >= 0 ? "+" + v : v) : v, n]} />
                        <Recharts.Legend wrapperStyle={{ fontSize: 10 }} />
                        <Recharts.Bar dataKey="Abertos" fill="#2e86c1" radius={[3,3,0,0]} />
                        <Recharts.Bar dataKey="Cancelados" fill="#e74c3c" radius={[3,3,0,0]} />
                        <Recharts.Bar dataKey="Concluídos" fill="#27ae60" radius={[3,3,0,0]} />
                        <Recharts.Bar dataKey="Saldo" fill="#d4a017" radius={[3,3,0,0]} />
                        <Recharts.ReferenceLine y={0} stroke="var(--gaq-text-3)" strokeDasharray="3 3" />
                      </Recharts.ComposedChart>
                    </Recharts.ResponsiveContainer>
                  </div>
                  <div className="gaq-card" style={{ padding: 22, borderRadius: 24 }}>
                    <div style={{ fontWeight: 700, fontSize: 15, color: "var(--gaq-text)", marginBottom: 2 }}>Fluxo mensal — RC</div>
                    <div style={{ fontSize: 11, color: "var(--gaq-text-3)", marginBottom: 10 }}>Aberturas, cancelamentos e conclusões de RC por mês</div>
                    <Recharts.ResponsiveContainer width="100%" height={220}>
                      <Recharts.ComposedChart data={rcData} margin={{ top: 5, right: 10, left: 0, bottom: 5 }}>
                        <Recharts.CartesianGrid strokeDasharray="3 3" stroke="var(--gaq-line)" />
                        <Recharts.XAxis dataKey="mes" fontSize={9} tick={{ fill: "var(--gaq-text-3)" }} />
                        <Recharts.YAxis fontSize={10} tick={{ fill: "var(--gaq-text-3)" }} />
                        <Recharts.Tooltip formatter={(v, n) => [n === "Saldo" ? (v >= 0 ? "+" + v : v) : v, n]} />
                        <Recharts.Legend wrapperStyle={{ fontSize: 10 }} />
                        <Recharts.Bar dataKey="Abertos" fill="#2e86c1" radius={[3,3,0,0]} />
                        <Recharts.Bar dataKey="Cancelados" fill="#e74c3c" radius={[3,3,0,0]} />
                        <Recharts.Bar dataKey="Concluídos" fill="#27ae60" radius={[3,3,0,0]} />
                        <Recharts.Bar dataKey="Saldo" fill="#d4a017" radius={[3,3,0,0]} />
                        <Recharts.ReferenceLine y={0} stroke="var(--gaq-text-3)" strokeDasharray="3 3" />
                      </Recharts.ComposedChart>
                    </Recharts.ResponsiveContainer>
                  </div>
                </div>
              );
            })()}

            {/* ── Distribuição por comprador e modalidade / ano ── */}
            {(() => {
              const shortName = name => { const p = (name||"").trim().split(/\s+/); return p.length > 1 ? `${p[0]} ${p[p.length-1]}` : p[0]; };
              const truncate  = (s, n) => s.length > n ? s.slice(0, n-1) + "…" : s;

              // Acumular dados por ano para compradores e modalidades
              const anoCompMap = {};
              const anoModMap  = {};
              fBase.forEach(r => {
                if (r.isCanceled || r.isFailed) return;
                const dataRef = r.aberturaSD || r.aberturaRC;
                if (!dataRef || !(dataRef instanceof Date)) return;
                const ano  = String(dataRef.getFullYear());
                const _validResp = v => { if (!v) return false; const n = nrm(v.trim()); return n && n !== "n/a" && n !== "n/i" && !n.includes("nao aplic") && !n.includes("não aplic"); };
                const comp = (_validResp(r.Comprador) ? r.Comprador : _validResp(r.Avaliador) ? r.Avaliador : "Sem responsável").trim();
                const mod  = (r.Modalidade || "N/I").trim();
                if (!anoCompMap[ano]) anoCompMap[ano] = {};
                anoCompMap[ano][comp] = (anoCompMap[ano][comp] || 0) + 1;
                if (!anoModMap[ano]) anoModMap[ano] = {};
                anoModMap[ano][mod]  = (anoModMap[ano][mod]  || 0) + 1;
              });

              const allAnos    = [...new Set([...Object.keys(anoCompMap), ...Object.keys(anoModMap)])].sort();
              if (allAnos.length === 0) return null;
              const recentAnos = allAnos.slice(-5); // últimos 5 anos para navegação
              const anoMaisRecente = recentAnos[recentAnos.length - 1];

              // displayAnos: null → apenas o mais recente; array → seleção explícita
              const displayAnos = distAnosFilter === null ? [anoMaisRecente] : distAnosFilter;

              // Paleta fixa por posição dentro de recentAnos
              const YEAR_PAL = ["#94a3b8","#64748b","#2e86c1","#059669","#d35400"];
              const anoColor   = ano => YEAR_PAL[recentAnos.indexOf(ano)] ?? "#94a3b8";
              const anoAtivo   = ano => displayAnos.includes(ano);

              const toggleAno = ano => {
                const atual = distAnosFilter === null ? [anoMaisRecente] : distAnosFilter;
                const novo  = anoAtivo(ano) ? atual.filter(a => a !== ano) : [...atual, ano].sort();
                setDistAnosFilter(novo.length === 0 ? [ano] : novo);
              };

              // ── Compradores ──
              // totais históricos (todos os recentAnos) → usados nas pills e no total do subtítulo
              const buyerTotalsAll = {};
              recentAnos.forEach(ano => Object.entries(anoCompMap[ano]||{}).forEach(([c,n]) => { buyerTotalsAll[c]=(buyerTotalsAll[c]||0)+n; }));
              const buyerTotal = Object.values(buyerTotalsAll).reduce((a,b)=>a+b,0);

              // totais dos anos selecionados → determinam quem entra no top e a ordenação
              const buyerTotalsDisplay = {};
              displayAnos.forEach(ano => Object.entries(anoCompMap[ano]||{}).forEach(([c,n]) => { buyerTotalsDisplay[c]=(buyerTotalsDisplay[c]||0)+n; }));
              const topBuyers = Object.entries(buyerTotalsDisplay).sort((a,b)=>b[1]-a[1]).slice(0,10).map(([n])=>n);

              const buyerData  = topBuyers.map(b => {
                const row = { name: shortName(b) };
                recentAnos.forEach(ano => { row[ano] = (anoCompMap[ano]||{})[b] || 0; });
                row._tot = displayAnos.reduce((s,a)=>s+(row[a]||0),0); // ordena pelo período exibido
                return row;
              }).sort((a,b)=>b._tot-a._tot);

              // ── Modalidades ──
              // mesmo padrão: totais históricos para pills, totais do período para ranking
              const modTotalsAll = {};
              recentAnos.forEach(ano => Object.entries(anoModMap[ano]||{}).forEach(([m,n]) => { modTotalsAll[m]=(modTotalsAll[m]||0)+n; }));
              const modTotal = Object.values(modTotalsAll).reduce((a,b)=>a+b,0);

              const modTotalsDisplay = {};
              displayAnos.forEach(ano => Object.entries(anoModMap[ano]||{}).forEach(([m,n]) => { modTotalsDisplay[m]=(modTotalsDisplay[m]||0)+n; }));
              const topMods = Object.entries(modTotalsDisplay).sort((a,b)=>b[1]-a[1]).slice(0,8).map(([n])=>n);

              const modData  = topMods.map(m => {
                const row = { name: truncate(m, 30) };
                recentAnos.forEach(ano => { row[ano] = (anoModMap[ano]||{})[m] || 0; });
                row._tot = displayAnos.reduce((s,a)=>s+(row[a]||0),0);
                return row;
              }).sort((a,b)=>b._tot-a._tot);

              const BAR_H  = 11;
              const ROW_H  = displayAnos.length * (BAR_H + 3) + 18;
              const bChartH = Math.max(160, buyerData.length * ROW_H + 20);
              const mChartH = Math.max(160, modData.length  * ROW_H + 20);
              const YW_B = 88, YW_M = 110;

              // Seletor de anos compartilhado
              const YearLegend = () => (
                <div style={{ display:"flex", gap:5, marginBottom:12, flexWrap:"wrap", alignItems:"center" }}>
                  {recentAnos.map(ano => {
                    const ativo = anoAtivo(ano);
                    const cor   = anoColor(ano);
                    const isLatest = ano === anoMaisRecente;
                    return (
                      <button key={ano} onClick={() => toggleAno(ano)}
                        style={{ display:"flex", alignItems:"center", gap:5, padding:"4px 10px", borderRadius:20, cursor:"pointer", fontSize:11, fontWeight:700, border:`1.5px solid ${ativo ? cor : "var(--gaq-line)"}`, background: ativo ? cor : "var(--gaq-bg-2)", color: ativo ? "#fff" : "var(--gaq-text-3)", transition:"all .15s", position:"relative" }}>
                        {ano}
                        {isLatest && !ativo && <span style={{ fontSize:8, color:"var(--gaq-text-3)", fontWeight:400, marginLeft:2 }}>↩</span>}
                      </button>
                    );
                  })}
                  <button onClick={() => setDistAnosFilter(recentAnos.slice())}
                    style={{ padding:"4px 10px", borderRadius:20, cursor:"pointer", fontSize:11, fontWeight:600, border:"1.5px solid var(--gaq-line)", background:"var(--gaq-bg-2)", color:"var(--gaq-text-3)", transition:"all .15s" }}>
                    Todos
                  </button>
                  {distAnosFilter !== null && displayAnos.length < recentAnos.length && (
                    <button onClick={() => setDistAnosFilter(null)}
                      style={{ padding:"4px 10px", borderRadius:20, cursor:"pointer", fontSize:10, border:"none", background:"transparent", color:"var(--gaq-text-3)", textDecoration:"underline" }}>
                      resetar
                    </button>
                  )}
                </div>
              );

              const Pills = ({ items, totals, total, labelFn }) => (
                <div style={{ marginTop:12, display:"flex", flexWrap:"wrap", gap:5 }}>
                  {items.map(item => {
                    const tot = totals[item]||0;
                    const pct = total>0 ? Math.round((tot/total)*100) : 0;
                    return (
                      <div key={item} style={{ display:"flex", alignItems:"center", gap:4, background:"var(--gaq-bg-2)", borderRadius:6, padding:"2px 8px", fontSize:10, border:"1px solid var(--gaq-line)" }}>
                        <span style={{ color:"var(--gaq-text-2)" }}>{labelFn ? labelFn(item) : truncate(item,22)}</span>
                        <span style={{ fontWeight:700, color:"var(--gaq-text)" }}>{tot}</span>
                        <span style={{ color:"var(--gaq-text-3)" }}>({pct}%)</span>
                      </div>
                    );
                  })}
                </div>
              );

              const commonTooltip = {
                contentStyle:{ background:"var(--gaq-surface)", border:"1px solid var(--gaq-line)", borderRadius:8, fontSize:11, boxShadow:"0 4px 16px rgba(0,0,0,.08)" },
                cursor:{ fill:"var(--gaq-bg-2)" },
                formatter:(v, name) => [v||null, name],
              };

              return (
                <div style={{ display:"grid", gridTemplateColumns:"1fr 1fr", gap:14, marginBottom:16 }}>

                  {/* ─ Card: Por Comprador ─ */}
                  <div className="gaq-card" style={{ padding:22, borderRadius:24 }}>
                    <div style={{ fontWeight:700, fontSize:15, color:"var(--gaq-text)", marginBottom:2 }}>Distribuição por comprador</div>
                    <div style={{ fontSize:11, color:"var(--gaq-text-3)", marginBottom:10 }}>
                      Processos encaminhados · data ref.: abertura SD ou RC · <b style={{ color:"var(--gaq-text-2)" }}>{buyerTotal}</b> total
                    </div>
                    <YearLegend />
                    <Recharts.ResponsiveContainer width="100%" height={bChartH}>
                      <Recharts.BarChart layout="vertical" data={buyerData}
                        margin={{ top:0, right:28, left:0, bottom:0 }}
                        barCategoryGap="22%" barGap={2}>
                        <Recharts.CartesianGrid strokeDasharray="3 3" stroke="var(--gaq-line)" horizontal={false} />
                        <Recharts.XAxis type="number" fontSize={9} tick={{ fill:"var(--gaq-text-3)" }} axisLine={false} tickLine={false} allowDecimals={false} />
                        <Recharts.YAxis type="category" dataKey="name" width={YW_B} fontSize={10} tick={{ fill:"var(--gaq-text)", fontWeight:500 }} axisLine={false} tickLine={false} />
                        <Recharts.Tooltip {...commonTooltip} />
                        {displayAnos.map(ano => (
                          <Recharts.Bar key={ano} dataKey={ano} fill={anoColor(ano)} barSize={BAR_H} radius={[0,3,3,0]}>
                            <Recharts.LabelList dataKey={ano} position="right" style={{ fontSize:8, fill:"var(--gaq-text-3)" }} formatter={v => v > 0 ? v : ""} />
                          </Recharts.Bar>
                        ))}
                      </Recharts.BarChart>
                    </Recharts.ResponsiveContainer>
                    <Pills items={topBuyers} totals={buyerTotalsAll} total={buyerTotal} labelFn={shortName} />
                  </div>

                  {/* ─ Card: Por Modalidade ─ */}
                  <div className="gaq-card" style={{ padding:22, borderRadius:24 }}>
                    <div style={{ fontWeight:700, fontSize:15, color:"var(--gaq-text)", marginBottom:2 }}>Distribuição por modalidade</div>
                    <div style={{ fontSize:11, color:"var(--gaq-text-3)", marginBottom:10 }}>
                      Volume de processos por modalidade e ano · <b style={{ color:"var(--gaq-text-2)" }}>{modTotal}</b> total
                    </div>
                    <YearLegend />
                    <Recharts.ResponsiveContainer width="100%" height={mChartH}>
                      <Recharts.BarChart layout="vertical" data={modData}
                        margin={{ top:0, right:28, left:0, bottom:0 }}
                        barCategoryGap="22%" barGap={2}>
                        <Recharts.CartesianGrid strokeDasharray="3 3" stroke="var(--gaq-line)" horizontal={false} />
                        <Recharts.XAxis type="number" fontSize={9} tick={{ fill:"var(--gaq-text-3)" }} axisLine={false} tickLine={false} allowDecimals={false} />
                        <Recharts.YAxis type="category" dataKey="name" width={YW_M} fontSize={10} tick={{ fill:"var(--gaq-text)", fontWeight:500 }} axisLine={false} tickLine={false} />
                        <Recharts.Tooltip {...commonTooltip} />
                        {displayAnos.map(ano => (
                          <Recharts.Bar key={ano} dataKey={ano} fill={anoColor(ano)} barSize={BAR_H} radius={[0,3,3,0]}>
                            <Recharts.LabelList dataKey={ano} position="right" style={{ fontSize:8, fill:"var(--gaq-text-3)" }} formatter={v => v > 0 ? v : ""} />
                          </Recharts.Bar>
                        ))}
                      </Recharts.BarChart>
                    </Recharts.ResponsiveContainer>
                    <Pills items={topMods} totals={modTotalsAll} total={modTotal} />
                  </div>

                </div>
              );
            })()}

            {/* ── Top 10 áreas: SD concluído sem RC ── */}
            {(() => {
              const semRC = fBase.filter(r => r.encSD && !r.aberturaRC && !r.isCanceled && !r.isFailed);
              if (semRC.length === 0) return null;

              const areaMap = {};
              semRC.forEach(r => {
                const area = (r["Área Requisitante"] || "N/I").trim();
                if (!areaMap[area]) areaMap[area] = { total: 0, urgente: 0 };
                areaMap[area].total++;
                if ((r.diasDesdeEncSD || 0) > 7) areaMap[area].urgente++;
              });

              const chartData = Object.entries(areaMap)
                .sort((a, b) => b[1].total - a[1].total)
                .slice(0, 10)
                .map(([area, v]) => ({
                  name   : area.length > 30 ? area.slice(0, 29) + "…" : area,
                  urgente: v.urgente,
                  atencao: v.total - v.urgente,
                  total  : v.total,
                }));

              const chartH = Math.max(180, chartData.length * 40 + 20);

              return (
                <div className="gaq-card" style={{ padding: 22, borderRadius: 24, marginBottom: 16 }}>
                  <div style={{ display:"flex", justifyContent:"space-between", alignItems:"flex-start", marginBottom:14, flexWrap:"wrap", gap:8 }}>
                    <div>
                      <div style={{ fontWeight:700, fontSize:15, color:"var(--gaq-text)" }}>Top 10 áreas — SD encerrado sem RC aberta</div>
                      <div style={{ fontSize:11, color:"var(--gaq-text-3)", marginTop:2 }}>
                        Pré-compra encerrada pelo GAQ aguardando abertura da RC · <b style={{ color:"var(--gaq-text-2)" }}>{semRC.length}</b> processo{semRC.length !== 1 ? "s" : ""} no total
                      </div>
                    </div>
                    <div style={{ display:"flex", gap:12, alignItems:"center", flexWrap:"wrap" }}>
                      <div style={{ display:"flex", alignItems:"center", gap:5, fontSize:10 }}>
                        <div style={{ width:10, height:10, borderRadius:2, background:"#dc2626", flexShrink:0 }}/>
                        <span style={{ color:"var(--gaq-text-3)" }}>Urgente (&gt;7 d.u. s/ RC)</span>
                      </div>
                      <div style={{ display:"flex", alignItems:"center", gap:5, fontSize:10 }}>
                        <div style={{ width:10, height:10, borderRadius:2, background:"#f59e0b", flexShrink:0 }}/>
                        <span style={{ color:"var(--gaq-text-3)" }}>Atenção (≤7 d.u.)</span>
                      </div>
                    </div>
                  </div>

                  <Recharts.ResponsiveContainer width="100%" height={chartH}>
                    <Recharts.BarChart layout="vertical" data={chartData}
                      margin={{ top:0, right:36, left:0, bottom:0 }}
                      barCategoryGap="28%" barGap={0}>
                      <Recharts.CartesianGrid strokeDasharray="3 3" stroke="var(--gaq-line)" horizontal={false} />
                      <Recharts.XAxis type="number" fontSize={9} tick={{ fill:"var(--gaq-text-3)" }} axisLine={false} tickLine={false} allowDecimals={false} />
                      <Recharts.YAxis type="category" dataKey="name" width={138} fontSize={10} tick={{ fill:"var(--gaq-text)", fontWeight:500 }} axisLine={false} tickLine={false} />
                      <Recharts.Tooltip
                        contentStyle={{ background:"var(--gaq-surface)", border:"1px solid var(--gaq-line)", borderRadius:8, fontSize:11, boxShadow:"0 4px 16px rgba(0,0,0,.08)" }}
                        cursor={{ fill:"var(--gaq-bg-2)" }}
                        formatter={(v, name) => [v, name === "urgente" ? "Urgente (>7 d.u. s/ RC)" : "Atenção (≤7 d.u. s/ RC)"]}
                      />
                      <Recharts.Bar dataKey="urgente" stackId="s" fill="#dc2626" barSize={22} radius={[0,0,0,0]} />
                      <Recharts.Bar dataKey="atencao" stackId="s" fill="#f59e0b" barSize={22} radius={[0,3,3,0]}>
                        <Recharts.LabelList
                          content={({ x, y, width, height, value, index }) => {
                            const total = chartData[index]?.total;
                            if (!total) return null;
                            return <text x={x + width + 6} y={y + height / 2 + 1} textAnchor="start" fontSize={11} fontWeight={700} fill="var(--gaq-text)">{total}</text>;
                          }}
                        />
                      </Recharts.Bar>
                    </Recharts.BarChart>
                  </Recharts.ResponsiveContainer>
                </div>
              );
            })()}

            {/* Insights Operacionais */}
            <div className="gaq-card" style={{ padding: 22, borderRadius: 24 }}>
              <div style={{ fontWeight: 700, fontSize: 15, color: "var(--gaq-text)", marginBottom: 2 }}>Insights operacionais</div>
              <div style={{ fontSize: 11, color: "var(--gaq-text-3)", marginBottom: 10 }}>Alertas automáticos baseados nos filtros actuais</div>
              {(() => {
                const opsInsights = [];
                const bigFase = [...fasesExpandidas].filter(f => f.count > 0).sort((a,b) => b.count - a.count)[0];
                if (bigFase && bigFase.count > 5) opsInsights.push({ icon: "🔄", text: `Maior concentração na fase "${bigFase.label}" (${bigFase.area}) com ${bigFase.count} processos. Avaliar ações para destravar esta etapa.`, color: "#d35400" });
                const topComp = compArr[0];
                if (!loginArea && topComp && topComp.crit > 3) opsInsights.push({ icon: "👤", text: `${topComp.name} concentra ${topComp.crit} processos críticos. Priorizar redistribuição.`, color: "#c0392b" });
                if (loginArea && opsCriticos.length > 0) opsInsights.push({ icon: "⚠️", text: `${opsCriticos.length} processo(s) da área ${loginArea} estão críticos pela combinação SLA + entrega. Verificar priorização junto ao GAQ.`, color: "#c0392b" });
                const paradosTotal = emAF.filter(r => r.diasParado > 15).length;
                if (paradosTotal > 5) opsInsights.push({ icon: "⏸", text: `${paradosTotal} processos estagnados (>15 d.u. sem movimentação). Verificar pendências e destravar.`, color: "#e67e22" });
                if (mediaAging > 50) opsInsights.push({ icon: "⏱", text: `Aging médio de ${mediaAging} d.u. está elevado. Meta recomendada: abaixo de 50 d.u.`, color: "#c0392b" });
                if (semPedido > emAF.length * 0.3 && semPedido > 5) opsInsights.push({ icon: "📦", text: `${semPedido} processos (${Math.round((semPedido/emAF.length)*100)}%) ainda sem envio de pedido. Verificar gargalos no fluxo de aprovação.`, color: "#e67e22" });
                if (opsInsights.length === 0) opsInsights.push({ icon: "✅", text: "Indicadores operacionais dentro dos parâmetros para os filtros selecionados.", color: "#27ae60" });
                return opsInsights.map((ins, i) => (
                  <div key={i} style={{ display: "flex", gap: 10, alignItems: "flex-start", padding: "7px 0", borderBottom: i < opsInsights.length - 1 ? "1px solid var(--gaq-line)" : "none" }}>
                    <span style={{ fontSize: 16 }}>{ins.icon}</span>
                    <span style={{ fontSize: 12, color: ins.color, fontWeight: 500 }}>{ins.text}</span>
                  </div>
                ));
              })()}
            </div>
            </>;
          })()}
        </div> : <div style={{ textAlign: "center", padding: 60, color: "var(--text3)" }}>
          <div style={{ fontSize: 38 }}>📭</div><div style={{ fontWeight: 600, marginTop: 8 }}>Carregue a base para acessar o painel operacional.</div>
          <button onClick={() => setAba("upload")} style={{ marginTop: 12, background: "#1a5276", color: "#fff", border: "none", borderRadius: 8, padding: "9px 22px", cursor: "pointer", fontSize: 13 }}>Upload</button>
        </div>)}

        {/* ════════════ ABA: TODOS OS PROCESSOS ════════════ */}
        {aba === "processos" && <div>
          {renderBuscaPanel()}
          <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 12, flexWrap: "wrap", gap: 8 }}>
            <div style={{ display: "flex", alignItems: "center", gap: 10, flexWrap: "wrap" }}>
              <div style={{ fontWeight: 700, fontSize: 15, color: "var(--gaq-text)" }}>
                Todos os Processos ({allProcesses.length}{hideSDConcluido && fBase.length !== allProcesses.length ? ` de ${fBase.length}` : ""})
              </div>
              <button onClick={() => { setHideSDConcluido(v => !v); setPgAll(1); }}
                style={{ display:"flex", alignItems:"center", gap:6, padding:"5px 12px", borderRadius:20, cursor:"pointer", fontSize:11, fontWeight:600, border:`1.5px solid ${hideSDConcluido ? "#dc2626" : "var(--gaq-line)"}`, background: hideSDConcluido ? "#fee2e2" : "var(--gaq-bg-2)", color: hideSDConcluido ? "#dc2626" : "var(--gaq-text-3)", transition:"all .15s" }}>
                {hideSDConcluido ? "✕ Ocultando SD Concluído" : "Ocultar SD Concluído"}
              </button>
            </div>
            <button className="gaq-btn" onClick={() => exportToExcel(fBase, "processos.xlsx")}>
              <Icon name="download" size={13}/> Exportar Excel
            </button>
          </div>
          <div className="gaq-card" style={{ padding: 0, overflow: "auto" }}>
            <table className="gaq-table" style={{ width: "100%", borderCollapse: "collapse" }}>
              <thead>
                <tr>
                  {[
                    { key: "ProcessKey", label: "Processo", w: 130 },
                    { key: "Objeto", label: "Objeto", w: 220 },
                    { key: "Modalidade", label: "Modalidade", w: 110 },
                    { key: "_tags", label: "Tags", w: 100 },
                    { key: "status", label: "Status", w: 100 },
                    { key: "diasParado", label: "Último Movimento", w: 80 },
                    { key: "diasTotais", label: "Aging", w: 100 },
                    { key: "_score", label: "Score", w: 64 },
                  ].map(({ key, label, w }) => (
                    <th key={key} onClick={() => key !== "_score" && key !== "_tags" && toggleSort(key)}
                      style={{ padding: "10px 10px", textAlign: "left", cursor: key !== "_score" ? "pointer" : "default", color: "var(--gaq-text-3)", fontWeight: 600, fontSize: 10.5, textTransform: "uppercase", letterSpacing: "0.04em", whiteSpace: "nowrap", minWidth: w, userSelect: "none" }}>
                      {label} {sortAll.col === key && (sortAll.dir === "desc" ? "▼" : "▲")}
                    </th>
                  ))}
                </tr>
              </thead>
              <tbody>
                {allPage.map((r, i) => {
                  const sla = calcSLAClassification(r, phaseIntervals);
                  const bk = sla ? (SLA_BUCKETS[sla.bucket] || SLA_BUCKETS.no_prazo) : null;
                  const pctAging = sla ? Math.min(100, sla.pctSLALabel) : 0;
                  const agingColor = sla ? sla.color : "var(--gaq-text-3)";
                  const subareaColor = (sa) => sa === "NCL" ? "var(--gaq-ncl)" : sa === "CPL" ? "var(--gaq-cpl)" : sa === "Scont" ? "var(--gaq-rsp)" : "var(--gaq-text-3)";
                  const subareaColorBg = (sa) => sa === "NCL" ? "rgba(10,132,255,0.08)" : sa === "CPL" ? "rgba(94,92,230,0.08)" : sa === "Scont" ? "rgba(52,199,89,0.08)" : "transparent";
                  const stDot = r.emA ? "#34c759" : r.isConcluded ? "#007aff" : r.isCanceled ? "#ff9500" : r.isFailed ? "#ff3b30" : "#8e8e93";
                  const statusLabel = r.statusDet || r.status || "—";
                  return (
                    <tr key={i} style={{ borderBottom: "1px solid var(--gaq-line)", cursor: "pointer", transition: "background .15s" }}
                      onMouseEnter={e => e.currentTarget.style.background = "var(--gaq-bg-2)"} onMouseLeave={e => e.currentTarget.style.background = "transparent"}
                      onClick={() => setSelProc(r)}>
                      <td style={{ padding: "12px 10px" }}>
                        <div style={{ display: "flex", alignItems: "center", gap: 8 }}>
                          <div>
                            <div style={{ fontSize: 13, fontWeight: 600, color: "var(--gaq-text)", fontFamily: "var(--gaq-mono)" }}>{r.NumRC || r.TicketSD || r.ProcessKey || "—"}</div>
                            <div style={{ display: "flex", gap: 4, marginTop: 3 }}>
                              {r.faseSubarea && <span style={{ fontSize: 9, fontWeight: 600, background: subareaColorBg(r.faseSubarea), color: subareaColor(r.faseSubarea), borderRadius: 4, padding: "1px 6px" }}>{r.faseSubarea}</span>}
                              {r.ehCPL && r.faseSubarea !== "CPL" && <span style={{ fontSize: 9, fontWeight: 600, background: "rgba(94,92,230,0.08)", color: "var(--gaq-cpl)", borderRadius: 4, padding: "1px 6px" }}>CPL</span>}
                              {r.isLegado && <span style={{ fontSize: 8, background: "var(--gaq-bg-2)", color: "var(--gaq-text-3)", borderRadius: 3, padding: "1px 5px" }}>Legado</span>}
                            </div>
                          </div>
                        </div>
                      </td>
                      <td style={{ padding: "12px 10px", maxWidth: 260 }}>
                        <div style={{ fontSize: 12.5, color: "var(--gaq-text)", overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap", fontWeight: 500, lineHeight: 1.35 }} title={r.Objeto || ""}>{r.Objeto || "Sem objeto"}</div>
                        <div style={{ fontSize: 11, color: "var(--gaq-text-3)", marginTop: 2, overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }}>
                          {r["Área Requisitante"] || "Área n/i"} · {r.respAtivo && r.respAtivo !== "N/A" ? r.respAtivo : (r.Comprador || r.Pregoeiro || "—")}
                        </div>
                      </td>
                      <td style={{ padding: "12px 10px", fontSize: 12, color: "var(--gaq-text-2)" }}>{r.Modalidade || "—"}</td>
                      <td style={{ padding: "8px 10px", maxWidth: 140 }}>
                        {(() => { const tags = TagsManager.getForProcess(r.ProcessKey, r.TicketSD); return tags.length > 0 ? <div style={{ display:"flex", flexWrap:"wrap", gap:3 }}>{tags.slice(0,3).map(t => <TagBadge key={t} tag={t} small />)}{tags.length > 3 && <span style={{ fontSize:9, color:"var(--gaq-text-3)" }}>+{tags.length-3}</span>}</div> : <span style={{ fontSize:11, color:"var(--gaq-text-3)" }}>—</span>; })()}
                      </td>
                      <td style={{ padding: "12px 10px" }}>
                        <div style={{ display: "flex", alignItems: "center", gap: 6 }}>
                          <span style={{ width: 7, height: 7, borderRadius: 999, background: stDot, flex: "none" }} />
                          <span style={{ fontSize: 12, color: "var(--gaq-text)", overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap", maxWidth: 120 }} title={statusLabel}>{statusLabel}</span>
                        </div>
                      </td>
                      <td style={{ padding: "12px 10px", fontVariantNumeric: "tabular-nums" }}>
                        <span style={{ fontSize: 12, fontWeight: 500, color: r.diasParado > 15 ? "var(--gaq-orange)" : "var(--gaq-text-2)" }}>
                          {r.emA && r.diasParado > 0 ? `${r.diasParado} d.u.` : "—"}
                        </span>
                      </td>
                      <td style={{ padding: "12px 10px", minWidth: 100 }}>
                        {r.emA ? (
                          <div>
                            <div style={{ display: "flex", alignItems: "center", gap: 6, marginBottom: 3 }}>
                              <span style={{ fontSize: 12, fontWeight: 600, color: agingColor, fontVariantNumeric: "tabular-nums" }}>{r.diasTotais || 0} d.u.</span>
                            </div>
                            <div style={{ height: 5, background: "rgba(0,0,0,0.06)", borderRadius: 3, overflow: "hidden", width: "100%" }}>
                              <div style={{ width: `${Math.min(100, pctAging)}%`, height: "100%", background: agingColor, borderRadius: 3, transition: "width .3s" }} />
                            </div>
                            <div style={{ fontSize: 9, color: "var(--gaq-text-3)", marginTop: 2 }}>{pctAging}% do SLA ({sla?.prazo || 0} d.u.)</div>
                          </div>
                        ) : (
                          <span style={{ fontSize: 12, color: "var(--gaq-text-3)" }}>{r.diasTotais || "—"}</span>
                        )}
                      </td>
                      <td style={{ padding: "12px 10px", textAlign: "center" }}>
                        {sla ? (
                          <div style={{ display: "inline-flex", alignItems: "center", justifyContent: "center", width: 38, height: 38, borderRadius: 999, background: bk.bg, border: `2px solid ${bk.color}` }}>
                            <span style={{ fontSize: 12, fontWeight: 700, color: bk.color, fontVariantNumeric: "tabular-nums" }}>{sla.processScore}</span>
                          </div>
                        ) : (
                          <span style={{ fontSize: 11, color: "var(--gaq-text-3)" }}>—</span>
                        )}
                      </td>
                    </tr>
                  );
                })}
                {allPage.length === 0 && <tr><td colSpan={8} style={{ textAlign: "center", padding: 30, color: "var(--gaq-text-3)" }}>Nenhum processo encontrado.</td></tr>}
              </tbody>
            </table>
          </div>
          <Pagination total={allProcesses.length} page={pgAll} pageSize={pgAllSz} onPage={setPgAll} onSize={setPgAllSz} />
        </div>}

        {/* ════════════ ABA: NOVA DEMANDA (NCL + CPL separados) ════════════ */}
        {aba === "nova" && <div style={{ maxWidth: 920, margin: "0 auto" }}>
          {renderBuscaPanel()}
          <div style={{ background: "var(--card)", borderRadius: 10, padding: 22, boxShadow: "var(--shadow)", marginBottom: 16 }}>
            <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 8 }}>
              <div style={{ fontWeight: 700, fontSize: 15, color: "#1a5276" }}>Dados da Nova Demanda</div>
              {(recsNCL.length > 0 || recsCPL.length > 0) && (
                <button onClick={limparDemanda}
                  style={{ background: "none", border: "1px solid #e74c3c", color: "#e74c3c", borderRadius: 6, padding: "5px 14px", cursor: "pointer", fontSize: 12, fontWeight: 600 }}>
                  ✕ Limpar e Nova Consulta
                </button>
              )}
            </div>
            <div className="grid-3" style={{ display: "grid", gridTemplateColumns: "1fr 1fr 2fr", gap: 10 }}>
              <div><label style={{ fontSize: 11, color: "var(--text3)" }}>Área Requisitante</label>
                <select value={dem.area} onChange={e => setDem({ ...dem, area: e.target.value })} style={{ width: "100%", padding: "7px", borderRadius: 6, border: "1px solid var(--input-bd)", marginTop: 3, fontSize: 12, background: "var(--input-bg)", color: "var(--text)" }}>
                  <option value="">Selecione...</option>{areas.map(a => <option key={a} value={a}>{a}</option>)}</select></div>
              <div><label style={{ fontSize: 11, color: "var(--text3)" }}>Modalidade</label>
                <select value={dem.modalidade} onChange={e => setDem({ ...dem, modalidade: e.target.value })} style={{ width: "100%", padding: "7px", borderRadius: 6, border: "1px solid var(--input-bd)", marginTop: 3, fontSize: 12, background: "var(--input-bg)", color: "var(--text)" }}>
                  <option value="">Selecione...</option>{mods.map(m => <option key={m} value={m}>{m}</option>)}</select></div>
              <div><label style={{ fontSize: 11, color: "var(--text3)" }}>Objeto</label>
                <input value={dem.objeto} onChange={e => setDem({ ...dem, objeto: e.target.value })} placeholder="Ex: Aquisição de materiais de escritório..."
                  style={{ width: "100%", padding: "7px", borderRadius: 6, border: "1px solid var(--input-bd)", marginTop: 3, fontSize: 12, background: "var(--input-bg)", color: "var(--text)" }} /></div>
            </div>
            <button onClick={gerarRecs} disabled={base.length === 0}
              style={{ marginTop: 14, background: base.length === 0 ? "#aaa" : "#1a5276", color: "#fff", padding: "9px 26px", borderRadius: 8, border: "none", cursor: base.length === 0 ? "not-allowed" : "pointer", fontWeight: 700, fontSize: 13 }}>
              Gerar Recomendações</button>
          </div>
          {alertMapDem.length > 0 && <div style={{ background: "#fef9e7", border: "2px solid #e67e22", borderRadius: 10, padding: 14, marginBottom: 14 }}>
            <div style={{ fontWeight: 700, color: "#d35400", marginBottom: 6, fontSize: 13 }}>Alerta: Objeto com histórico problemático</div>
            {alertMapDem.map(p => (
              <div key={p.word} style={{ background: "var(--card)", borderRadius: 6, padding: "8px 12px", marginBottom: 6, border: "1px solid #f0c080" }}>
                <span style={{ background: "#e67e22", color: "#fff", borderRadius: 4, padding: "1px 8px", fontSize: 11, fontWeight: 700, marginRight: 8 }}>"{p.word}"</span>
                <span style={{ fontSize: 12, color: "var(--text2)" }}>{p.count} casos: {p.cancelados} cancelados · {p.fracassados} fracassados{p.avgLT ? ` · Lead médio: ${p.avgLT} d.u.` : ""}</span>
              </div>
            ))}
          </div>}
          {/* NCL recommendations */}
          {recsNCL.length > 0 && <div style={{ marginBottom: 20 }}>
            <div style={{ fontWeight: 700, fontSize: 14, color: "#1a5276", marginBottom: 10, padding: "8px 14px", background: "#1a527611", borderRadius: 8, border: "2px solid #1a5276" }}>
              Top 3 Compradores NCL Recomendados
              <div style={{ fontSize: 10, fontWeight: 400, color: "var(--text3)", marginTop: 2 }}>Núcleo de Compras e Licitações — pool exclusivo NCL</div>
            </div>
            {recsNCL.map((r, i) => <RecCard key={r.comp} r={r} i={i} pool="ncl" />)}
          </div>}
          {/* CPL recommendations */}
          {recsCPL.length > 0 && <div>
            <div style={{ fontWeight: 700, fontSize: 14, color: "#8e44ad", marginBottom: 10, padding: "8px 14px", background: "#8e44ad11", borderRadius: 8, border: "2px solid #8e44ad" }}>
              Top 3 Responsáveis CPL Recomendados
              <div style={{ fontSize: 10, fontWeight: 400, color: "var(--text3)", marginTop: 2 }}>Comissão Permanente de Licitações — pool exclusivo CPL</div>
            </div>
            {recsCPL.map((r, i) => <RecCard key={r.comp} r={r} i={i} pool="cpl" />)}
          </div>}
        </div>}

        {/* ════════════ ABA: BALANCEAMENTO ════════════ */}
        {aba === "bal" && <div>
          {renderBuscaPanel()}
          {[
            { title: "NCL — Carga por Comprador", color: "#1a5276", data: cargaNCL, tipo: "ncl", cols: C_NCL,
              extra: (d) => { const tot = cargaNCL.reduce((a,b) => a + b.total, 0) || 1; const pct = Math.round((d.total/tot)*100); return <span style={{ display: "flex", gap: 6, alignItems: "center" }}>{d.criticos > 0 && <span style={{ background: "#c0392b", color: "#fff", borderRadius: 8, padding: "0 7px", fontSize: 10, fontWeight: 700 }}>{d.criticos} crít.</span>}<b>{d.total}</b>({pct}%)</span>; } },
            { title: "CPL — Carga por Responsável", color: "#6c3483", data: cargaCPLResp, tipo: "cpl", cols: C_CPL, extra: (d) => <span><b>{d.total}</b> ativos</span> },
            { title: "CPL — Divisão por Pregoeiro", color: "#8e44ad", data: cargaCPLPreg, tipo: "cpl", cols: C_RSP,
              extra: (d) => { const tot = cargaCPLPreg.reduce((a,b) => a + b.total, 0) || 1; const pct = Math.round((d.total/tot)*100); return <span><b>{d.total}</b>({pct}%)</span>; } },
          ].map(({ title, color, data, tipo, cols, extra }) => (
            <div key={title} style={{ background: "var(--card)", borderRadius: 10, padding: 20, boxShadow: "var(--shadow)", marginBottom: 14, borderTop: `3px solid ${color}` }}>
              <div style={{ fontWeight: 700, fontSize: 14, color, marginBottom: 12 }}>{title}</div>
              {data.length === 0 ? <div style={{ color: "var(--text3)", fontSize: 13 }}>Sem dados.</div> : <>
                <ResponsiveContainer width="100%" height={Math.max(120, data.length * 30)}>
                  <BarChart data={data} layout="vertical" margin={{ left: 100, right: 20 }}>
                    <XAxis type="number" fontSize={11} /><YAxis type="category" dataKey="name" fontSize={10} width={96} />
                    <Tooltip formatter={v => [v + " proc", "Total"]} />
                    <Bar dataKey="total" radius={[0,5,5,0]} onClick={(entry) => { crossFilter("resp", entry.full); setAba("processos"); }}>
                      {data.map((_, i) => <Cell key={i} fill={cols[i % cols.length]} style={{ cursor: "pointer" }} />)}
                    </Bar>
                  </BarChart>
                </ResponsiveContainer>
                <div style={{ marginTop: 10 }}>
                  {data.map(d => (
                    <div key={d.full} onClick={() => setSelComp({ nome: d.full, tipo })}
                      style={{ display: "flex", justifyContent: "space-between", alignItems: "center", padding: "5px 0", borderBottom: "1px solid var(--border2)", fontSize: 12, cursor: "pointer" }}>
                      <span style={{ color, textDecoration: "underline" }}>{d.full}</span>{extra(d)}
                    </div>
                  ))}
                </div>
              </>}
            </div>
          ))}
        </div>}

        {/* ════════════ ABA: ALERTAS ════════════ */}
        {aba === "alertas" && <div className="anim-fade">
          {renderBuscaPanel()}

          {/* Header */}
          <div style={{ marginBottom: 18 }}>
            <div className="gaq-h1" style={{ marginBottom: 4 }}>Central de Alertas</div>
            <div className="gaq-body" style={{ color: "var(--gaq-text-3)" }}>Alertas ativos baseados em SLA, estagnacao e lead time por fase</div>
          </div>

          {/* KPIs resumo */}
          {(() => {
            const scored = fBack.map(r => { const sla = calcSLAClassification(r, phaseIntervals); return sla ? { ...r, _sla: sla } : null; }).filter(r => r && (r._sla.bucket === "critico" || r._sla.bucket === "sla_vencido")).sort((a,b) => (b._sla.pctSLA || 0) - (a._sla.pctSLA || 0));
            const stagnados = fBack.filter(r => r.diasParado > 15);
            const kpis = [
              { label: "Critico", value: scored.filter(r => r._sla.bucket === "critico").length, color: "var(--gaq-red)" },
              { label: "SLA Vencido", value: scored.filter(r => r._sla.bucket === "sla_vencido").length, color: "var(--gaq-orange)" },
              { label: "Estagnados", value: stagnados.length, color: "#e67e22" },
              { label: "NCL Criticos", value: alertNCL.length, color: "#2e86c1" },
              { label: "CPL Criticos", value: alertCPL.length, color: "#8e44ad" },
            ];
            return (
              <div className="gaq-kpi-grid" style={{ gridTemplateColumns: "repeat(auto-fit, minmax(160px, 1fr))", marginBottom: 18 }}>
                {kpis.map(k => (
                  <div key={k.label} className="gaq-kpi" style={{ borderTop: `3px solid ${k.color}` }}>
                    <span className="lbl">{k.label}</span>
                    <div className="val" style={{ color: k.color }}>{k.value}</div>
                  </div>
                ))}
              </div>
            );
          })()}

          {/* ── PAINEL: Classificação SLA (Crítico + SLA Vencido) ── */}
          {(() => {
          const scored = fBack.map(r => { const sla = calcSLAClassification(r, phaseIntervals); return sla ? { ...r, _sla: sla } : null; }).filter(r => r && (r._sla.bucket === "critico" || r._sla.bucket === "sla_vencido")).sort((a,b) => (b._sla.pctSLA || 0) - (a._sla.pctSLA || 0));
            const hsTotalPages = Math.ceil(scored.length / pgHSSz);
            const hsPage = scored.slice((pgHS-1)*pgHSSz, pgHS*pgHSSz);

            return scored.length > 0 && (
              <div className="gaq-card" style={{ marginBottom: 14, padding: 0, overflow: "hidden" }}>
                <div onClick={() => setShowHS(s => !s)} style={{ padding: "16px 22px", cursor: "pointer", display: "flex", justifyContent: "space-between", alignItems: "center", borderBottom: showHS ? "1px solid var(--gaq-line)" : "none" }}>
                  <div>
                    <div className="gaq-h3" style={{ color: "var(--gaq-red)", marginBottom: 2 }}>SLA Vencido e Critico</div>
                    <div className="gaq-meta">{scored.length} processos fora do SLA da modalidade</div>
                  </div>
                  <Icon name={showHS ? "chevU" : "chevD"} size={14} color="var(--gaq-text-3)" />
                </div>
                {showHS && <div style={{ padding: "12px 22px 18px" }}>
                  {hsPage.map((r, i) => {
                    const bk = SLA_BUCKETS[r._sla.bucket];
                    return (
                    <div key={r.ProcessKey} onClick={() => setSelProc(r)} className="gaq-card" style={{ padding: "14px 18px", marginBottom: 10, borderRadius: 16, cursor: "pointer", display: "flex", gap: 14, alignItems: "center" }}>
                      <div style={{ width: 40, height: 40, borderRadius: "50%", background: bk.bg, border: `2px solid ${bk.color}`, display: "flex", alignItems: "center", justifyContent: "center", fontWeight: 800, fontSize: 11, flexShrink: 0, color: bk.color }}>{r._sla.pctSLALabel}%</div>
                      <div style={{ flex: 1, minWidth: 0 }}>
                        <div style={{ display: "flex", gap: 6, flexWrap: "wrap", alignItems: "center", marginBottom: 4 }}>
                          <span style={{ fontWeight: 600, fontSize: 13, color: "var(--gaq-text)" }}>{r.NumRC || r.TicketSD || "—"}</span>
                          {r.TicketSD && r.NumRC && <span style={{ fontSize: 11, color: "var(--gaq-green)" }}>Pré-compra {r.TicketSD}</span>}
                          <span style={{ fontSize: 11, color: "var(--gaq-text-3)" }}>{r.Modalidade || "—"}</span>
                          <span style={{ fontSize: 11, color: "var(--gaq-text-3)" }}>{r.respNCL || r.Pregoeiro || "—"}</span>
                        </div>
                        <div style={{ fontSize: 12, color: "var(--gaq-text-2)", overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }}>{(r.Objeto||"").slice(0,100)}</div>
                      </div>
                      <div style={{ textAlign: "right", flexShrink: 0, display: "grid", gap: 4, justifyItems: "end" }}>
                        <span style={{ fontSize: 11, fontWeight: 700, color: bk.color, background: bk.bg, borderRadius: 999, padding: "4px 10px" }}>{bk.label}</span>
                        <span className="gaq-num" style={{ fontSize: 14, fontWeight: 700, color: bk.color }}>{r.diasTotais} d.u.</span>
                      </div>
                    </div>
                  );})}
                  {hsTotalPages > 1 && <Pagination total={scored.length} page={pgHS} pageSize={pgHSSz} onPage={setPgHS} onSize={setPgHSSz} />}
                </div>}
              </div>
            );
          })()}

          {/* ── PAINEL: Estagnação ── */}
          {(() => {
            const stagnados = fBack.filter(r => r.diasParado > 15).sort((a,b) => b.diasParado - a.diasParado);
            const stagTotalPages = Math.ceil(stagnados.length / pgStagSz);
            const stagPage = stagnados.slice((pgStag-1)*pgStagSz, pgStag*pgStagSz);

            return stagnados.length > 0 && (
              <div className="gaq-card" style={{ marginBottom: 14, padding: 0, overflow: "hidden" }}>
                <div onClick={() => setShowStag(s => !s)} style={{ padding: "16px 22px", cursor: "pointer", display: "flex", justifyContent: "space-between", alignItems: "center", borderBottom: showStag ? "1px solid var(--gaq-line)" : "none" }}>
                  <div>
                    <div className="gaq-h3" style={{ color: "var(--gaq-orange)", marginBottom: 2 }}>Processos Estagnados</div>
                    <div className="gaq-meta">{stagnados.length} processos sem movimentacao ha mais de 15 d.u.</div>
                  </div>
                  <Icon name={showStag ? "chevU" : "chevD"} size={14} color="var(--gaq-text-3)" />
                </div>
                {showStag && <div style={{ padding: "12px 22px 18px" }}>
                  {stagPage.map((r, i) => (
                    <div key={r.ProcessKey} onClick={() => setSelProc(r)} className="gaq-card" style={{ padding: "14px 18px", marginBottom: 10, borderRadius: 16, cursor: "pointer", display: "flex", gap: 14, alignItems: "center" }}>
                      <div style={{ width: 40, height: 40, borderRadius: 12, background: r.diasParado > 30 ? "#c0392b" : "#e67e22", display: "flex", alignItems: "center", justifyContent: "center", color: "#fff", fontWeight: 800, fontSize: 13, flexShrink: 0 }}>{r.diasParado}</div>
                      <div style={{ flex: 1, minWidth: 0 }}>
                        <div style={{ display: "flex", gap: 6, flexWrap: "wrap", alignItems: "center", marginBottom: 4 }}>
                          <span style={{ fontWeight: 600, fontSize: 13, color: "var(--gaq-text)" }}>{r.NumRC || r.TicketSD || "—"}</span>
                          {r.TicketSD && r.NumRC && <span style={{ fontSize: 11, color: "var(--gaq-green)" }}>Pré-compra {r.TicketSD}</span>}
                          <span style={{ fontSize: 11, color: "var(--gaq-text-3)" }}>{r.Modalidade || "—"}</span>
                          <span style={{ fontSize: 11, color: "var(--gaq-text-3)" }}>{r.respNCL || r.Pregoeiro || "—"}</span>
                        </div>
                        <div style={{ fontSize: 12, color: "var(--gaq-text-2)", overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }}>{(r.Objeto||"").slice(0,100)}</div>
                      </div>
                      <div style={{ fontSize: 12, color: "var(--gaq-text-3)", textAlign: "right", flexShrink: 0 }}>total {r.diasTotais} d.u.</div>
                    </div>
                  ))}
                  {stagTotalPages > 1 && <Pagination total={stagnados.length} page={pgStag} pageSize={pgStagSz} onPage={setPgStag} onSize={setPgStagSz} />}
                </div>}
              </div>
            );
          })()}

          {/* ── PAINEL: SLA por Fase ── */}
          {(() => {
            const phases = [];
            for (let i = 0; i < TL_COLS.length - 1; i++) {
              const [lA] = TL_COLS[i], [lB, keyB] = TL_COLS[i+1];
              const [, keyA] = TL_COLS[i];
              const pair = keyA + "\u2192" + keyB;
              const gd = phaseIntervals.global[pair];
              if (!gd || !gd.avg) continue;
              phases.push({ label: lA + " → " + lB, avg: gd.avg, med: gd.med, n: gd.n, isCPL: isCplTimelineKey(keyB) });
            }
            return phases.length > 0 && (
              <div className="gaq-card" style={{ marginBottom: 14, padding: 0, overflow: "hidden" }}>
                <div onClick={() => setShowSLA(s => !s)} style={{ padding: "16px 22px", cursor: "pointer", display: "flex", justifyContent: "space-between", alignItems: "center", borderBottom: showSLA ? "1px solid var(--gaq-line)" : "none" }}>
                  <div>
                    <div className="gaq-h3" style={{ color: "var(--gaq-blue)", marginBottom: 2 }}>SLA por Fase</div>
                    <div className="gaq-meta">Lead time medio entre etapas do processo</div>
                  </div>
                  <Icon name={showSLA ? "chevU" : "chevD"} size={14} color="var(--gaq-text-3)" />
                </div>
                {showSLA && <div style={{ padding: "12px 22px 18px" }}>
                  <div className="gaq-meta" style={{ marginBottom: 12 }}>Verde ≤10 d.u. · Amarelo ≤25 d.u. · Vermelho &gt;25 d.u.</div>
                  <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 8 }}>
                    {phases.map((p, i) => {
                      const cor = p.avg <= 10 ? "#27ae60" : p.avg <= 25 ? "#f39c12" : "#c0392b";
                      return (
                        <div key={i} className="gaq-card" style={{ padding: "12px 16px", borderRadius: 14, borderLeft: `3px solid ${cor}` }}>
                          <div style={{ fontSize: 11, fontWeight: 600, color: p.isCPL ? "#8e44ad" : "var(--gaq-text-2)", textTransform: "uppercase", marginBottom: 4, overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }}>{p.label}</div>
                          <div style={{ display: "flex", gap: 10, alignItems: "baseline" }}>
                            <span className="gaq-num" style={{ fontSize: 20, fontWeight: 800, color: cor }}>{p.avg}</span>
                            <span className="gaq-meta">d.u. media · {p.n} amostras</span>
                          </div>
                        </div>
                      );
                    })}
                  </div>
                </div>}
              </div>
            );
          })()}

          {/* ── NCL Críticos ── */}
          <div className="gaq-card" style={{ padding: 22, marginBottom: 14 }}>
            <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 12, flexWrap: "wrap", gap: 8 }}>
              <div>
                <div className="gaq-h3" style={{ color: "#2e86c1" }}>NCL — Criticos (&gt;50 d.u.)</div>
                <div className="gaq-meta">Em andamento · d.u. desde abertura &gt; 50</div>
              </div>
              {alertNCL.length > 0 && <button onClick={() => exportToExcel(alertNCL, "alertas_ncl.xlsx")} className="gaq-btn is-primary" style={{ fontSize: 11 }}>Exportar NCL</button>}
            </div>
            {alertNCL.length === 0 ? <div style={{ color: "var(--gaq-text-3)", fontSize: 13 }}>Nenhum critico NCL.</div>
              : alertNCL.slice((pgAlert-1)*pgAlertSz, pgAlert*pgAlertSz).map((r, i) => <ProcCard key={i} r={r} tipo="ncl" onClickComp={onClickComp} onClickProc={onClickProc} onOpenTags={onOpenTags} tagVersion={tagVersion} onToggleWatch={toggleWatch} watchVersion={watchVersion} />)}
            <Pagination total={alertNCL.length} page={pgAlert} pageSize={pgAlertSz} onPage={setPgAlert} onSize={setPgAlertSz} />
          </div>

          {/* ── CPL Críticos ── */}
          <div className="gaq-card" style={{ padding: 22 }}>
            <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 12, flexWrap: "wrap", gap: 8 }}>
              <div>
                <div className="gaq-h3" style={{ color: "#8e44ad" }}>CPL — Criticos (&gt;50 d.u.)</div>
                <div className="gaq-meta">CPL=VERDADEIRO · em andamento · d.u. &gt; 50</div>
              </div>
              {alertCPL.length > 0 && <button onClick={() => exportToExcel(alertCPL, "alertas_cpl.xlsx")} className="gaq-btn is-primary" style={{ fontSize: 11, background: "#8e44ad" }}>Exportar CPL</button>}
            </div>
            {alertCPL.length === 0 ? <div style={{ color: "var(--gaq-text-3)", fontSize: 13 }}>Nenhum critico CPL.</div>
              : alertCPL.slice((pgCpl-1)*pgCplSz, pgCpl*pgCplSz).map((r, i) => <ProcCard key={i} r={r} tipo="cpl" onClickComp={onClickComp} onClickProc={onClickProc} onOpenTags={onOpenTags} tagVersion={tagVersion} onToggleWatch={toggleWatch} watchVersion={watchVersion} />)}
            <Pagination total={alertCPL.length} page={pgCpl} pageSize={pgCplSz} onPage={setPgCpl} onSize={setPgCplSz} />
          </div>
        </div>}

        {/* ════════════ ABA: ALERTA RC ════════════ */}
        {aba === "alertaRC" && <div>
          {renderBuscaPanel()}
          {(() => {
            const slaVencido = alertRC.filter(r => r.atrasoGeral).length;
            const critRC = alertRC.filter(r => (r.diasTotaisGestao||0) > 100).length;
            const atencRC = alertRC.filter(r => { const d = r.diasTotaisGestao||0; return d > 60 && d <= 100; }).length;
            const parados = alertRC.filter(r => (r.diasParado||0) > 15).length;
            const mediaRC = alertRC.length ? Math.round(alertRC.reduce((s,r)=>s+(r.diasTotaisGestao||0),0)/alertRC.length) : 0;
            const cardKpi = (label, value, color) => (
              <div key={label} style={{ background: "rgba(255,255,255,.10)", backdropFilter: "blur(8px)", borderRadius: 12, padding: "14px 16px", border: "1px solid rgba(255,255,255,.14)" }}>
                <div style={{ fontSize: 10, fontWeight: 600, opacity: .78, letterSpacing: ".06em", textTransform: "uppercase", marginBottom: 6, color: "#fff" }}>{label}</div>
                <div style={{ fontSize: 30, fontWeight: 700, lineHeight: 1, color: color || "#fff", letterSpacing: "-.02em", fontVariantNumeric: "tabular-nums" }}>{value}</div>
              </div>
            );
            return (
              <div style={{ background: "linear-gradient(135deg, #0a1f3d 0%, #2980b9 100%)", color: "#fff", borderRadius: "var(--gaq-r-xl, 16px)", padding: "24px 28px", marginBottom: 18, boxShadow: "var(--gaq-shadow-2, 0 4px 16px rgba(10,31,61,.18))", border: "none" }}>
                <div style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-start", flexWrap: "wrap", gap: 12, marginBottom: 18 }}>
                  <div>
                    <div style={{ fontSize: 11, fontWeight: 600, opacity: .72, letterSpacing: ".05em", textTransform: "uppercase", marginBottom: 4 }}>Alerta RC · Processos com RC em andamento</div>
                    <div style={{ fontSize: 22, fontWeight: 700, letterSpacing: "-.02em" }}>Acompanhamento de RCs</div>
